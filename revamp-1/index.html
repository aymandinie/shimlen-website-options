<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shimlen · Daylight · Revamp 1</title>
<meta name="description" content="High-quality materials for custom-made furniture: plywood, MFC, HPL, edgeband, acoustic and lacquered panels. 10,000 sq m warehouse in Semenyih, Selangor.">
<link rel="icon" href="../img/logo-mark.svg">
<script>if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&location.search.indexOf('shot')<0)document.documentElement.classList.add('rx-loading')</script>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/motion.css">
<link rel="stylesheet" href="../shared/rx.css">
<style>
/* Revamp 1 · Open — story-first and unhurried. A light hero with the new building framed beside the words, then the
   page reads as one story: what we believe, the rooms our boards become, the three things a cabinet needs, the
   health of the boards, the scale behind them, what's next, 45 years, and a conversation. */
:root{--bg:#F3EFEA;--fg:#231F20;--fg2:#544C4B;--mut:#736A68;--line:rgba(35,31,32,.12);--acc:#867774;
  --deep:#2A2322;--deep2:#3A302E;--sand:#E7DED7;--card:#D9CAC0;--white:#FFFDFB;--r:20px;--hh:84px;--pad:clamp(80px,9vw,140px);
  --drawer-bg:#FFFDFB;--drawer-line:#E7DED7;--rxl-bg:#F3EFEA;--rxl-fg:#231F20;--rxl-mut:#736A68;--pre-bg:#2A2322;--pre-fg:#F3EFEA;--cur:#2A2322}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.t{font-family:"Saira","Helvetica Neue",Arial,sans-serif;font-weight:400;letter-spacing:-.015em;line-height:1.06}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.02em;color:var(--acc);font-weight:500}
.eyebrow::before{content:"";width:7px;height:7px;background:currentColor;border-radius:2px}
.h2{font-size:clamp(34px,4vw,58px)}
.lead{font-size:17px;color:var(--fg2);max-width:52ch}
section{position:relative;padding:var(--pad) 0}
.white{background:var(--white)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;font-size:15px;font-weight:500;transition:background .3s,color .3s}
.btn .ic{width:16px;height:16px;transition:transform .35s var(--ease)}
.btn:hover .ic{transform:translateX(4px)}
.btn-solid{background:var(--deep);color:#fff}.btn-solid:hover{background:var(--acc)}
.btn-ghost{border:1px solid var(--line)}.btn-ghost:hover{background:var(--sand)}
.btn-light{background:#fff;color:var(--fg)}.btn-light:hover{background:var(--card)}
.circ{width:42px;height:42px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;flex:none;transition:background .3s,color .3s,border-color .3s}
.circ .ic{width:16px;height:16px}
.tel{border-bottom:1px solid currentColor;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--white);border:1px solid var(--line);font-size:13.5px;transition:background .3s,color .3s,border-color .3s}
.chip:hover{background:var(--deep);color:#fff;border-color:var(--deep)}
.white .chip{background:var(--bg)}

/* header: a floating pill, light from the start */
#hdr{position:fixed;top:14px;left:0;right:0;height:calc(var(--hh) - 14px);z-index:60;transition:transform .5s var(--ease);--logo-a:#231F20;--logo-b:#867774;pointer-events:none}
#hdr.hide{transform:translateY(-130%)}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;background:rgba(255,253,251,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;padding:0 10px 0 26px;box-shadow:0 1px 0 rgba(35,31,32,.05),0 10px 30px rgba(42,35,34,.06);pointer-events:auto}
.nav .logo{width:132px}
.nav-links{display:flex;gap:2px;font-size:14px}
.nav-links a{padding:9px 13px;border-radius:99px;transition:background .3s,color .3s;color:var(--fg2)}
.nav-links a:hover{background:var(--sand);color:var(--fg)}
.nav-links a.active{background:var(--deep);color:#fff}
.nav-cta{display:flex;gap:8px;align-items:center}
.nav-cta .btn{padding:12px 18px;font-size:14px}
.burger{display:none;width:46px;height:46px;border-radius:50%;background:var(--deep);color:#fff;place-items:center}
.burger span{display:block;width:18px;height:1.5px;background:currentColor;margin:3px auto;transition:transform .3s}
.menu{position:fixed;inset:0;background:var(--bg);z-index:55;padding:calc(var(--hh) + 40px) 24px 40px;display:flex;flex-direction:column;gap:2px;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.menu a{font-family:Saira;font-size:30px;padding:10px 0;border-bottom:1px solid var(--line)}
body.menu-open .menu{opacity:1;visibility:visible}
body.menu-open .burger span:nth-child(1){transform:translateY(4.5px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){transform:translateY(-4.5px) rotate(-45deg)}

/* 1 · hero: words on the left, the new building framed on the right, the numbers underneath */
.hero{padding:calc(var(--hh) + 34px) 0 0}
.h-grid{display:grid;grid-template-columns:5fr 7fr;gap:clamp(28px,4vw,64px);align-items:end}
.h-copy{padding-bottom:clamp(8px,2vw,30px)}
.hero h1{font-size:clamp(44px,4.7vw,74px);font-weight:300;letter-spacing:-.025em;margin:22px 0 22px;max-width:13ch}
.hero .lead{max-width:40ch}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.h-pic{position:relative;height:min(68svh,700px);min-height:460px;border-radius:28px;overflow:hidden;background:var(--sand)}
.h-pic .reel{position:absolute;inset:0;background:var(--sand)}
.h-pic .cap{position:absolute;left:16px;bottom:16px;z-index:3;display:flex;gap:10px;align-items:center;background:rgba(255,253,251,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:10px 16px 10px 10px;border-radius:999px;font-size:13.5px}
.h-pic .cap i{width:30px;height:30px;border-radius:50%;background:var(--deep);display:grid;place-items:center;color:#fff}
.h-pic .cap .ic{width:14px;height:14px}
.h-stats{display:grid;grid-template-columns:repeat(4,1fr) 1.5fr;gap:0;margin-top:clamp(30px,3.6vw,52px);border-top:1px solid var(--line)}
.h-stats>div{padding:22px 22px 0 0}
.h-stats>div+div{padding-left:22px;border-left:1px solid var(--line)}
.h-stats .n{font-family:Saira;font-size:clamp(30px,2.8vw,42px);line-height:1;letter-spacing:-.02em}
.h-stats small{font-size:14px;margin-left:4px;color:var(--acc)}
.h-stats .l{font-size:13.5px;color:var(--mut);margin-top:6px}
.h-rec{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding-top:4px}
.h-rec .mbr{width:58px;height:58px;border-radius:50%;background:var(--deep);display:grid;place-items:center;flex:none}
.h-rec .mbr img{width:40px}
.h-rec b{display:block;font-size:14px;font-weight:500}
.h-rec span{font-size:13px;color:var(--fg2);line-height:1.4}
.h-rec:hover b{text-decoration:underline}

/* 2 · what we believe: one statement that fills in as you read */
.believe{text-align:center}
.fill-text{font-family:Saira;font-size:clamp(28px,3.4vw,50px);line-height:1.18;letter-spacing:-.015em;margin:26px auto 0;max-width:24ch}
.fill-text .fw{color:rgba(35,31,32,.16);transition:color .3s}
.fill-text .fw.on{color:var(--fg)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,48px);margin-top:clamp(56px,6vw,90px);text-align:left}
.trio>div{border-top:1px solid var(--line);padding-top:22px}
.trio i{width:44px;height:44px;border-radius:50%;background:var(--deep);display:grid;place-items:center;margin-bottom:18px}
.trio i img{width:22px;height:22px;object-fit:contain}
.trio h3{font-family:Saira;font-weight:500;font-size:20px;margin-bottom:8px}
.trio p{font-size:15px;color:var(--fg2)}
.makers{display:grid;grid-template-columns:1.1fr .9fr 1.1fr;gap:16px;margin-top:clamp(56px,6vw,90px);align-items:start}
.makers figure{position:relative;border-radius:var(--r);overflow:hidden;margin:0}
.makers figure:nth-child(1){aspect-ratio:4/5}
.makers figure:nth-child(2){aspect-ratio:3/4;margin-top:clamp(40px,6vw,110px)}
.makers figure:nth-child(3){aspect-ratio:4/5;margin-top:clamp(16px,2vw,30px)}
.makers img{width:100%;height:100%;object-fit:cover}
.makers figcaption{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(255,253,251,.92);padding:8px 14px;border-radius:999px;font-size:13px}

/* 3 · scale: one aerial view opens to the full width, then four facts with pictures */
.scl{padding-top:clamp(40px,5vw,72px)}
.scl-frame{position:relative;height:min(92svh,880px);min-height:560px;overflow:hidden;color:#fff;background:var(--deep)}
.scl-pic{position:absolute;inset:0}
.scl-pic img{width:100%;height:100%;object-fit:cover}
.scl-frame::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(28,22,21,.82),rgba(28,22,21,.3) 48%,rgba(28,22,21,.08) 72%),linear-gradient(90deg,rgba(28,22,21,.4),rgba(28,22,21,0) 60%)}
.scl-tx{position:absolute;left:0;right:0;bottom:clamp(34px,7vh,80px);z-index:2;margin:0 auto}
.scl-tx .eyebrow{color:#E7DED7}
.scl-n{font-family:Saira;font-weight:300;font-size:clamp(84px,13vw,220px);line-height:.85;letter-spacing:-.045em;margin:18px 0 14px;font-variant-numeric:tabular-nums}
.scl-n small{font-size:.26em;margin-left:.12em;color:#E7DED7;letter-spacing:0}
.scl-tx p{font-size:clamp(18px,1.6vw,23px);line-height:1.4;max-width:38ch;color:rgba(255,255,255,.94)}
.scl-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.scl-card{background:var(--white);border-radius:var(--r);overflow:hidden}
.scl-card .im{aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--sand)}
.scl-card img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.scl-card:hover img{transform:scale(1.05)}
.scl-card .tx{padding:18px 20px 22px}
.scl-card b{font-family:Saira;font-weight:400;font-size:clamp(28px,2.4vw,38px);letter-spacing:-.02em;line-height:1;display:block}
.scl-card b small{font-size:.5em;color:var(--acc);margin-left:3px}
.scl-card span{font-size:14px;color:var(--fg2);display:block;margin-top:8px;line-height:1.45}

/* 4 · rooms: the picture holds still while the rooms are read past it */
.rs{display:grid;grid-template-columns:7fr 5fr;gap:clamp(30px,5vw,90px)}
.rs-pics{position:sticky;top:calc(var(--hh) + 24px);height:calc(100svh - var(--hh) - 48px);max-height:780px;border-radius:var(--r);overflow:hidden;background:var(--sand)}
.rs-pics figure{position:absolute;inset:0;margin:0;clip-path:inset(100% 0 0 0)}
.rs-pics figure:first-child,.rs-pics figure.on,.rs-pics figure.was{clip-path:inset(0 0 0 0)}
.rs-pics img{width:100%;height:100%;object-fit:cover;will-change:transform}
.rs-cnt{position:absolute;left:16px;bottom:16px;z-index:3;background:rgba(255,253,251,.92);border-radius:999px;padding:8px 14px;font-family:Saira;font-size:14px;font-variant-numeric:tabular-nums}
.rs-step{min-height:80svh;display:flex;flex-direction:column;justify-content:center}
.rs-step:last-child{min-height:62svh}
.rs-step .k{font-family:Saira;font-size:15px;color:var(--acc)}
.rs-step h3{font-family:Saira;font-weight:400;font-size:clamp(34px,3.4vw,52px);letter-spacing:-.02em;margin:8px 0 14px;line-height:1}
.rs-step p{font-size:17px;color:var(--fg2);max-width:34ch}
.rs-step .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.rs-m{display:none}

/* 5 · board, surface, edge: three tall panels; the one you point at opens */
.acc{display:flex;gap:14px;height:clamp(540px,66vh,680px)}
.ap{position:relative;flex:1;min-width:0;border-radius:var(--r);overflow:hidden;color:#fff;cursor:pointer;transition:flex 1.1s var(--ease)}
.ap.on{flex:3.2;cursor:default}
.ap>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease)}
.ap.on>img{transform:scale(1.04)}
.ap::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(28,22,21,.9),rgba(28,22,21,.4) 55%,rgba(28,22,21,.18))}
.ap .vt{position:absolute;z-index:2;left:22px;bottom:26px;display:flex;align-items:center;gap:14px;writing-mode:vertical-rl;transform:rotate(180deg);font-family:Saira;font-size:clamp(26px,2.4vw,36px);transition:opacity .4s}
.ap .vt i{font-style:normal;font-size:14px;opacity:.8}
.ap.on .vt{opacity:0}
.ap .bd{position:absolute;z-index:2;left:clamp(20px,2.4vw,34px);right:clamp(20px,2.4vw,34px);bottom:clamp(20px,2.4vw,34px);opacity:0;transform:translateY(18px);transition:opacity .4s,transform .7s var(--ease);pointer-events:none}
.ap.on .bd{opacity:1;transform:none;transition-delay:.35s;pointer-events:auto}
.ap .bd .k{font-family:Saira;font-size:14px;opacity:.85}
.ap .bd h3{font-family:Saira;font-weight:400;font-size:clamp(40px,4vw,64px);letter-spacing:-.025em;line-height:1;margin:6px 0 10px}
.ap .bd p{max-width:44ch;margin-bottom:20px;color:rgba(255,255,255,.9)}
.ap .pl{display:flex;flex-wrap:wrap;gap:8px}
.ap .pl button{display:inline-flex;flex-direction:column;align-items:flex-start;padding:10px 16px;border-radius:14px;background:rgba(255,253,251,.95);color:var(--fg);text-align:left;transition:background .3s,transform .3s var(--ease)}
.ap .pl button:hover{background:#fff;transform:translateY(-2px)}
.ap .pl b{font-weight:500;font-size:14.5px}
.ap .pl span{font-size:12px;color:var(--mut)}

/* 3 · rooms: one at a time, left then right */
.head{display:grid;grid-template-columns:7fr 5fr;gap:clamp(28px,4vw,60px);align-items:end;margin-bottom:clamp(44px,5vw,80px)}
.head .h2{margin-top:14px}
.room{display:grid;grid-template-columns:7fr 4fr;gap:clamp(28px,5vw,90px);align-items:center}
.room+.room{margin-top:clamp(56px,7vw,110px)}
.room:nth-child(even){grid-template-columns:4fr 7fr}
.room:nth-child(even) .pic{order:2}
.room .pic{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--sand)}
.room .pic img{width:100%;height:100%;object-fit:cover}
.room .k{font-family:Saira;font-size:15px;color:var(--acc)}
.room h3{font-family:Saira;font-weight:400;font-size:clamp(30px,3vw,44px);letter-spacing:-.02em;margin:8px 0 14px}
.room p{font-size:16.5px;color:var(--fg2);max-width:34ch}
.room .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}

/* 4 · products in three groups */
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.grp{background:var(--white);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.grp .pic{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--sand)}
.grp .pic img{width:100%;height:100%;object-fit:cover}
.grp .tx{padding:24px 24px 10px}
.grp .k{font-family:Saira;font-size:14px;color:var(--acc)}
.grp h3{font-family:Saira;font-weight:400;font-size:32px;letter-spacing:-.02em;margin:4px 0 8px}
.grp .tx p{font-size:14.5px;color:var(--fg2)}
.grp ul{list-style:none;padding:8px 12px 14px}
.grp li button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:13px 12px;border-radius:12px;transition:background .3s}
.grp li+li button{border-top:1px solid var(--line)}
.grp li button:hover{background:var(--bg)}
.grp li b{display:block;font-weight:500;font-size:15.5px}
.grp li span{font-size:13px;color:var(--mut)}
.grp li .circ{width:34px;height:34px;color:var(--fg2);border-color:var(--line)}
.grp li button:hover .circ{background:var(--deep);color:#fff;border-color:var(--deep)}
.grp .big{padding:6px 24px 24px;display:flex;gap:18px}
.grp .big div{flex:1;background:var(--bg);border-radius:14px;padding:16px}
.grp .big b{font-family:Saira;font-weight:400;font-size:30px;display:block;line-height:1}
.grp .big span{font-size:12.5px;color:var(--mut)}
.brands{margin-top:16px;background:var(--white);border-radius:var(--r);padding:20px 0 16px}
.brands .bh{display:flex;justify-content:space-between;padding:0 24px 12px;font-size:13px;color:var(--mut)}
.mq-item{width:180px;height:96px;margin-right:12px;background:var(--bg);border-radius:14px;padding:12px}
.mq-item img{height:42px;width:auto;max-width:130px;object-fit:contain}
.mq-item img.sm{height:32px}
.mq-item span{font-size:11.5px;color:var(--mut)}

/* 5 · health: an inset walnut block with the record and a line of four years */
.health{padding:0}
.hbox{background:var(--deep);color:#F3EFEA;border-radius:28px;padding:clamp(40px,5.5vw,90px) clamp(24px,5vw,80px)}
.hbox .eyebrow{color:var(--card)}
.hbox .lead{color:rgba(243,239,234,.75)}
.htop{display:grid;grid-template-columns:7fr 5fr;gap:clamp(28px,5vw,80px);align-items:end}
.hbox .h2{margin:14px 0 16px}
.rec{display:flex;gap:20px;align-items:center;background:var(--deep2);border-radius:var(--r);padding:20px}
.rec .cert{width:84px;border-radius:6px;cursor:zoom-in;box-shadow:0 12px 30px rgba(0,0,0,.35);flex:none}
.rec .big{font-family:Saira;font-size:clamp(44px,4.6vw,66px);line-height:.9;font-weight:300;letter-spacing:-.02em}
.rec .big small{font-size:.28em;margin-left:6px;color:var(--card);letter-spacing:0}
.rec p{font-size:13.5px;color:rgba(243,239,234,.72);margin-top:8px}
.tl{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,2.6vw,40px);margin-top:clamp(48px,5vw,80px);padding-top:34px}
.tl::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:rgba(243,239,234,.18)}
.tl::after{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--card);transform-origin:left;transform:scaleX(var(--fill,0));transition:transform 1.1s var(--ease)}
.tl .step{position:relative;cursor:pointer;opacity:.45;transition:opacity .6s}
.tl .step.on{opacity:1}
.tl .step::before{content:"";position:absolute;left:0;top:-34px;width:13px;height:13px;border-radius:50%;background:var(--deep);border:1px solid var(--card);transition:background .5s;z-index:1}
.tl .step.on::before{background:var(--card)}
.tl .y{font-family:Saira;font-size:clamp(30px,2.6vw,40px);line-height:1}
.tl p{font-size:14.5px;margin-top:10px;color:rgba(243,239,234,.82)}
.e0{display:flex;gap:12px;align-items:center;font-size:14px;color:rgba(243,239,234,.78);margin-top:22px}
.e0 img{width:50px;background:#fff;border-radius:10px;padding:5px}

/* 6 · eucalli */
.euc{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);align-items:center}
.euc .pic{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden}
.euc .pic>img{width:100%;height:100%;object-fit:cover}
.euc .lay{position:absolute;right:14px;bottom:14px;width:40%;background:rgba(255,253,251,.95);border-radius:14px;padding:10px;z-index:3;cursor:zoom-in}
.euc-logo{height:40px;width:auto;margin-bottom:18px}
.euc .h2{margin:12px 0 14px;font-size:clamp(30px,3.2vw,46px)}
.corebox{background:var(--bg);border-radius:var(--r);padding:20px;margin:24px 0 14px}
.corebox h4{font-family:Saira;font-weight:500;font-size:18px}
.corebox .sub{font-size:13px;color:var(--mut);margin:2px 0 12px}
.bar{display:flex;height:48px;border-radius:12px;overflow:hidden;font-family:Saira;font-size:18px;color:#fff;background:var(--sand)}
.bar>div{display:flex;align-items:center;padding-left:16px;width:0;transition:width 1s var(--ease)}
.bar>div:first-child{background:var(--deep)}.bar>div:last-child{background:var(--acc)}
.bar.in>div:first-child{width:60%}.bar.in>div:last-child{width:40%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;font-size:13.5px;color:var(--fg2)}
.legend b{display:block;color:var(--fg);font-weight:500}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feats>div{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.feats b{font-family:Saira;font-weight:500;font-size:16px}
.feats p{font-size:13.5px;color:var(--fg2)}
.proof{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.proof button{width:62px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(42,35,34,.1);transition:transform .3s}
.proof button:hover{transform:translateY(-3px)}
.proof img{width:100%;height:100%;object-fit:cover}
.proof small{flex:1;min-width:160px;font-size:13px;color:var(--mut)}

/* 7 · scale */
.scale .pic{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:21/9;min-height:420px;background:var(--deep)}
.scale .pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.72) sepia(.08)}
.scale .pic::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(28,22,21,.82),rgba(28,22,21,.25) 52%,rgba(28,22,21,0) 75%)}
.nums{position:absolute;left:0;right:0;bottom:0;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);color:#fff;padding:0 clamp(18px,3vw,40px) clamp(20px,3vw,36px)}
.nums>div{padding-right:16px}
.nums>div+div{border-left:1px solid rgba(255,255,255,.25);padding-left:clamp(14px,2vw,26px)}
.nums b{font-family:Saira;font-weight:300;font-size:clamp(30px,3.6vw,56px);line-height:1;display:block;letter-spacing:-.02em}
.nums span{font-size:14px;opacity:.9}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pair figure{position:relative;margin:0;border-radius:var(--r);overflow:hidden;aspect-ratio:3/2}
.pair img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
.pair figcaption{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(255,253,251,.92);padding:8px 14px;border-radius:999px;font-size:13px}

/* 8 · next */
.next{display:grid;grid-template-columns:5fr 7fr;gap:0;background:var(--bg);border-radius:28px;overflow:hidden}
.next .tx{padding:clamp(32px,5vw,80px);display:flex;flex-direction:column;justify-content:center}
.next .h2{margin:14px 0 18px}
.next .reel{position:relative;min-height:520px}

/* 9 · story: a quiet list beside a heading that stays */
.story{display:grid;grid-template-columns:4fr 7fr;gap:clamp(28px,6vw,110px);align-items:start}
.story .stick{position:sticky;top:calc(var(--hh) + 30px)}
.story .h2{margin:14px 0 16px}
.yl{list-style:none;border-top:1px solid var(--line)}
.yl li{display:grid;grid-template-columns:96px 1fr 88px;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.yl .y{font-family:Saira;font-size:28px;color:var(--acc);line-height:1}
.yl h3{font-family:Saira;font-weight:500;font-size:18px}
.yl p{font-size:14.5px;color:var(--fg2)}
.yl .th{width:88px;height:66px;border-radius:12px;overflow:hidden;background:var(--sand);display:grid;place-items:center}
.yl .th img{width:100%;height:100%;object-fit:cover}
.yl .th.logo img,.yl .th.doc img{object-fit:contain;padding:10px}
.yl .th.archive img{filter:sepia(.35) saturate(.8)}

/* 10 · voices + recognition */
.voices{text-align:center}
.q-stack{max-width:min(980px,100%);margin:28px auto 0}
.q blockquote{font-family:Saira;font-weight:300;font-size:clamp(26px,2.9vw,42px);line-height:1.18;letter-spacing:-.015em}
.q cite{display:block;font-style:normal;margin-top:20px;font-size:14.5px;color:var(--mut)}
.q-dots{display:flex;gap:8px;justify-content:center;margin-top:26px}
.q-dots button{width:36px;height:4px;border-radius:4px;background:var(--sand)}
.q-dots button.on{background:var(--deep)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:clamp(56px,6vw,90px);text-align:left}
.cert{display:flex;flex-direction:column;gap:8px;text-align:left}
.cgrid{grid-template-columns:repeat(4,minmax(0,250px));justify-content:center}
.cert .fr{position:relative;height:160px;background:var(--bg);border-radius:var(--r);transition:background .3s}
.cert:hover .fr{background:var(--sand)}
.cert .fr img{position:absolute;inset:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain;filter:drop-shadow(0 6px 14px rgba(30,25,24,.2))}
.cert .yrp{font-size:12.5px;color:var(--acc);font-weight:500;margin-top:4px}
.cert h3{font-family:Saira;font-weight:500;font-size:16px;line-height:1.2}
.cert p{font-size:13px;color:var(--fg2);line-height:1.4}

/* 11 · contact */
.ct{display:grid;grid-template-columns:5fr 7fr;gap:16px}
.ct-info{background:var(--deep);color:#F3EFEA;border-radius:var(--r);padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:18px}
.ct-info .eyebrow{color:var(--card)}
.ct-info .h2{font-size:clamp(30px,3vw,44px);margin:6px 0 4px}
.ct-info .r{display:flex;gap:12px;font-size:15px}
.ct-info .r>.ic{width:20px;height:20px;color:var(--card);margin-top:2px}
.ct-info b{display:block;font-size:12px;opacity:.6;font-weight:500}
.ct-info .tels{display:flex;flex-wrap:wrap;gap:4px 14px}
.links{display:flex;gap:14px;margin-top:4px;font-size:14px}
.links a{border-bottom:1px solid currentColor}
form{background:var(--white);border-radius:var(--r);padding:clamp(24px,3vw,40px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 20px;align-content:start}
.field label{font-size:12.5px;color:var(--mut)}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;border-radius:0;outline:none;font-size:15.5px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--deep)}
.field textarea{min-height:70px;resize:vertical}
.full{grid-column:1/-1}
.sent{grid-column:1/-1;background:var(--sand);padding:12px 14px;border-radius:10px;font-size:14px}
.map{position:relative;height:380px;border-radius:var(--r);overflow:hidden;background:var(--sand);margin-top:16px}
.map-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:var(--fg2);font-size:14px}
.map-ph a{border-bottom:1px solid}

/* footer */
footer{background:var(--deep);color:#F3EFEA;padding:clamp(56px,6vw,90px) 0 0;overflow:hidden;--logo-a:#fff;--logo-b:#D9CAC0}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr;gap:30px}
footer .logo{width:170px}
footer h5{font-family:Saira;font-weight:500;font-size:15px;margin-bottom:12px;color:var(--card)}
footer ul{list-style:none;display:grid;gap:7px;font-size:14px;color:rgba(243,239,234,.75)}
footer ul a:hover{color:#fff}
.social{display:flex;gap:10px;margin-top:20px}
.social a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
.social .ic{width:18px;height:18px}
.f-bottom{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:13px;color:rgba(243,239,234,.55);padding:28px 0 6px;border-top:1px solid rgba(255,255,255,.1);margin-top:44px}
.f-wm{color:var(--deep2);margin-bottom:-1.4%;padding-top:4px}

@media (max-width:1200px){.nav-links{display:none}.burger{display:grid}}
@media (max-width:1080px){
  .h-stats{grid-template-columns:repeat(4,1fr)}.h-stats .h-rec-c{grid-column:1/-1;border-left:0!important;padding-left:0!important;padding-top:20px;margin-top:20px;border-top:1px solid var(--line)}
  .groups{grid-template-columns:1fr 1fr}.groups .grp:last-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
  .story{grid-template-columns:1fr}.story .stick{position:relative;top:0}
}
@media (max-width:900px){
  .scl-cards{grid-template-columns:1fr 1fr}
  .rs{grid-template-columns:1fr}.rs-pics{display:none}
  .rs-step,.rs-step:last-child{min-height:0;opacity:1;padding:24px 0 30px}
  .rs-m{display:block;position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;margin-bottom:18px}
  .rs-m img{width:100%;height:100%;object-fit:cover}
  .acc{flex-direction:column;height:auto}
  .ap{flex:none;height:96px;transition:height .8s var(--ease)}
  .ap.on{flex:none;height:auto;padding:150px 0 0}
  .ap .vt{writing-mode:horizontal-tb;transform:none;bottom:auto;top:50%;translate:0 -50%;font-size:26px}
  .ap .bd{position:relative;left:0;right:0;bottom:0;padding:0 20px 22px}
  .ap:not(.on) .bd{display:none}
  :root{--pad:clamp(64px,10vw,96px)}
  .nav-cta .btn{display:none}
  .h-grid,.head,.htop,.euc,.next,.ct{grid-template-columns:1fr}
  .h-pic{height:auto;min-height:0;aspect-ratio:4/3;order:-1}
  .hero{padding-top:calc(var(--hh) + 16px)}
  .h-copy{padding-bottom:0}
  .room,.room:nth-child(even){grid-template-columns:1fr;gap:22px}
  .room:nth-child(even) .pic{order:0}
  .trio{grid-template-columns:1fr}
  .cgrid{grid-template-columns:1fr 1fr}
  .next .reel{min-height:0;aspect-ratio:4/3;order:-1}
  form{grid-template-columns:1fr 1fr}
  .f-grid{grid-template-columns:1fr 1fr}
  .tl{grid-template-columns:1fr 1fr;row-gap:36px}
  .tl::before,.tl::after{display:none}
  .tl .step{opacity:1;padding-top:22px;border-top:1px solid rgba(243,239,234,.18)}
  .tl .step::before{top:-7px}
  .nums{grid-template-columns:1fr 1fr;row-gap:16px}
  .nums>div:nth-child(3){border-left:0;padding-left:0}
  .scale .pic{aspect-ratio:4/5;min-height:0}
}
@media (max-width:560px){
  .scl-cards{grid-template-columns:1fr}.scl-frame{height:86svh}
  .cgrid{grid-template-columns:1fr 1fr}
  :root{--hh:74px;--wrap:calc(100vw - 32px)}
  #hdr{top:10px;height:calc(var(--hh) - 10px)}
  .nav{padding-left:18px}.nav .logo{width:118px}
  .hero h1{font-size:clamp(38px,10.4vw,48px)}
  .ctas .btn{flex:1 1 100%;justify-content:center}
  .h-stats{grid-template-columns:1fr 1fr}
  .h-stats>div:nth-child(3){border-left:0;padding-left:0}
  .h-stats>div{padding-bottom:18px}
  .makers{grid-template-columns:1fr 1fr}.makers figure:nth-child(3){display:none}
  .groups{grid-template-columns:1fr}.groups .grp:last-child{display:flex}
  .legend,.feats{grid-template-columns:1fr}
  .tl{grid-template-columns:1fr}
  .rec{flex-direction:row;align-items:flex-start}.rec .cert{width:64px}
  .pair{grid-template-columns:1fr}
  .yl li{grid-template-columns:64px 1fr;gap:14px}.yl .th{display:none}.yl .y{font-size:22px}
  .cgrid{gap:12px}.cert .fr{height:150px}
  form{grid-template-columns:1fr}
  .f-grid{grid-template-columns:1fr}
  .map{height:320px}
}
</style>
</head>
<body>
<header id="hdr"><div class="wrap nav">
  <a href="#top" class="brand" aria-label="Shimlen home" id="hLogo"></a>
  <nav class="nav-links" id="navLinks" aria-label="Sections"></nav>
  <div class="nav-cta"><a href="#contact" class="btn btn-solid">Enquire <svg class="ic"><use href="#plus"/></svg></a>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button></div>
</div></header>
<nav class="menu" id="menu" aria-label="Menu"></nav>
<main id="app"></main>
<footer id="foot"></footer>

<script>window.ROOT='../'</script>
<script src="../shared/data.js"></script>
<script src="../shared/brand.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/ScrollTrigger.min.js"></script>
<script src="../shared/vendor/lenis.min.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/motion.js"></script>
<script src="../shared/rx.js"></script>
<script>
const {ic,R}=Core, S=SH, P=S.products.list, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NAV=[['About','about'],['Warehouse','warehouse'],['Rooms','rooms'],['Products','products'],['Low Formaldehyde','low-formaldehyde'],['Our Story','story'],['Contact','contact']];
$('#navLinks').innerHTML=RX.nav(NAV); $('#menu').innerHTML=RX.nav(NAV)+'<a href="#contact">Enquire</a>'; $('#hLogo').innerHTML=SHIMLEN_LOGO;
const GROUPS=[['Board','The core that holds the screw and keeps the door straight.','board-stack.jpg',[0,1,8,7,6]],
  ['Surface','The face you see and touch, every day.','surface.jpg',[2,3,4]],
  ['Edge','The line your hand finds first, matched to the decor.','veneer.jpg',[5]]];

$('#app').innerHTML=`
<section class="hero" id="top">
  <div class="wrap h-grid">
    <div class="h-copy">
      <div class="eyebrow">${S.hero.eyebrow}</div>
      <h1 class="t">${S.hero.h1}</h1>
      <p class="lead">${S.hero.lead}</p>
      <div class="ctas"><a href="#rooms" class="btn btn-solid">See what they become ${ic('arrow')}</a><a href="#products" class="btn btn-ghost">Products</a></div>
    </div>
    <div class="h-pic"><div class="reel" id="rReel"></div><div class="cap"><i>${ic('i-pin')}</i>Our next home, rising in Bandar Teknologi Kajang</div></div>
  </div>
  <div class="wrap h-stats">${S.hero.stats.map(([n,u,l])=>`<div><div class="n"><span data-count="${n}">0</span><small>${u}</small></div><div class="l">${l}</div></div>`).join('')}
    <div class="h-rec-c"><button class="h-rec" data-lb="mbr" data-src="${R}img/cert-mbor.jpg" data-cap="The Malaysia Book of Records, 2025"><span class="mbr"><img src="${R}img/mbr-logo-white.png" alt="The Malaysia Book of Records"></span><span><b>${S.hero.record[0]}</b>${S.hero.record[1]}</span></button></div></div>
</section>

<section class="believe" id="about"><div class="wrap">
  <div class="eyebrow rv">${S.about.eyebrow}</div>
  <p class="fill-text" id="fill">${S.about.h2} We supply the boards, surfaces and edges behind Malaysia’s custom-made furniture, and we make sure nothing slows the maker down.</p>
  <div class="trio">${S.about.tabs.map(([h,p],i)=>`<div class="rv"><i><img src="${R}img/${S.about.pillars[i][0]}" alt=""></i><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>
  <div class="makers">
    <figure><img src="${RX.stock('carpenter.jpg')}" alt="A carpenter at work" loading="lazy"><figcaption>Carpenters</figcaption></figure>
    <figure><img src="${RX.stock('swatches.jpg')}" alt="Choosing decor samples" loading="lazy"><figcaption>Designers</figcaption></figure>
    <figure><img src="${RX.stock('cutting.jpg')}" alt="Cutting a board to size" loading="lazy"><figcaption>Furniture makers</figcaption></figure>
  </div>
</div></section>

<section class="scl" id="warehouse">
  <div class="scl-frame" id="sclFrame"><div class="scl-pic"><img src="${RX.stock('wh-aerial.jpg')}" alt="A large warehouse seen from the air" loading="lazy"></div>
    <div class="wrap scl-tx"><div class="eyebrow">${S.warehouse.eyebrow}</div>
      <div class="scl-n"><span data-count="10000">0</span><small>m²</small></div>
      <p>${RX.SCALE.sqft.charAt(0).toUpperCase()+RX.SCALE.sqft.slice(1)}, ${RX.SCALE.pitch}. ${S.warehouse.h2}</p></div></div>
  <div class="wrap"><div class="scl-cards">
    ${[['board-stack.jpg','Boards stacked high',S.lf.record.n.toLocaleString('en'),'','low-formaldehyde boards in one record stockpile'],
       ['aisle.jpg','Wrapped panels in an aisle','500','+','HPL decors and 400+ MFC decors on the shelf'],
       ['fleet.jpg','Forklifts in a warehouse hall','24','h*','delivery across the Klang Valley, by our own team'],
       ['timber-yard.jpg','A timber yard from the air','1','','supplier for board, surface and edge, sourced direct']].map(([f,a,n,u,t])=>`<article class="scl-card"><div class="im"><img src="${RX.stock(f)}" alt="${a}" loading="lazy"></div><div class="tx"><b>${n}<small>${u}</small></b><span>${t}</span></div></article>`).join('')}
  </div></div>
</section>

<section class="white" id="rooms"><div class="wrap">
  <div class="head"><div><div class="eyebrow rv">Where our boards end up</div><h2 class="t h2 split">Not boards. Rooms people live in.</h2></div>
    <p class="lead rv">Kitchens cooked in every night, wardrobes opened every morning. This is what Shimlen materials become in the hands of Malaysia’s furniture makers.</p></div>
  <div class="rs">
    <div class="rs-pics">${[0,1,2,4].map((k,i)=>`<figure class="${i?'':'on'}"><img src="${RX.stock(RX.ROOMS[k].f)}" alt="${RX.ROOMS[k].room}" loading="lazy"></figure>`).join('')}<span class="rs-cnt" id="rsCnt">01 / 04</span></div>
    <div>${[0,1,2,4].map((k,i)=>{const r=RX.ROOMS[k];return `<article class="rs-step${i?'':' on'}" data-i="${i}"><figure class="rs-m"><img src="${RX.stock(r.f)}" alt="${r.room}" loading="lazy"></figure>
      <div class="k">0${i+1}</div><h3>${r.room}</h3><p>${r.line}</p><div class="chips">${r.p.map(p=>`<button class="chip" data-p="${p}">${P[p].n} ${ic('arrow')}</button>`).join('')}</div></article>`}).join('')}</div>
  </div>
</div></section>

<section id="products"><div class="wrap">
  <div class="head"><div><div class="eyebrow rv">${S.products.eyebrow}</div><h2 class="t h2 split">${S.products.h2}</h2></div><p class="lead rv">Every cabinet is three decisions: the board inside, the surface outside, and the edge between them. We stock all three, so they match.</p></div>
  <div class="acc" id="acc">${GROUPS.map(([h,p,img,list],g)=>`<article class="ap${g?'':' on'}" tabindex="0" aria-label="${h}"><img src="${RX.stock(img)}" alt="" loading="lazy">
    <div class="vt"><i>0${g+1}</i>${h}</div>
    <div class="bd"><div class="k">0${g+1} · ${list.length} ${list.length>1?'products':'product'}</div><h3>${h}</h3><p>${p}${g===2?' 500+ colours, matched to every decor.':''}</p>
      <div class="pl">${list.map(i=>`<button data-p="${i}"><b>${P[i].n}</b><span>${P[i].b}</span></button>`).join('')}</div></div></article>`).join('')}</div>
  <div class="brands" id="brands"><div class="bh"><span>Brands we carry</span><span>Drag to browse</span></div><div class="mq" id="mq"><div class="mq-track"></div></div></div>
</div></section>

<section class="health" id="low-formaldehyde"><div class="wrap"><div class="hbox">
  <div class="htop"><div><div class="eyebrow">${S.lf.eyebrow}</div><h2 class="t h2 split">${S.lf.h2}</h2><p class="lead">${S.lf.lead}</p>
      <div class="e0"><img src="${R}img/b-e0.png" alt="E0">${S.lf.e0}</div></div>
    <div class="rec"><img class="cert" src="${R}${S.lf.record.img}" alt="Malaysia Book of Records certificate" data-lb="rec" data-cap="The Malaysia Book of Records, 2025">
      <div><div class="big"><span data-count="${S.lf.record.n}">0</span><small>${S.lf.record.unit}</small></div><p>${S.lf.record.h}. ${S.lf.record.p}.</p></div></div></div>
  <div class="tl" id="steps">${S.lf.steps.map(([y,p])=>`<div class="step"><div class="y">${y}</div><p>${p}</p></div>`).join('')}</div>
</div></div></section>

<section id="eucalli"><div class="wrap euc">
  <figure class="pic"><img src="${RX.stock('mfp.jpg')}" alt="Wardrobe in melamine faced plywood" loading="lazy"><button class="lay" data-notag data-lb="layers" data-src="${R}img/eucalli-layers.png" data-cap="eucalli E0 · the layers"><img src="${R}img/eucalli-layers.png" alt="eucalli E0 board layers"></button></figure>
  <div><img class="euc-logo" src="${R}img/b-eucalli.png" alt="eucalli E0"><div class="eyebrow">${S.eucalli.eyebrow}</div>
    <h2 class="t h2">${S.eucalli.h2}</h2><p class="lead">${S.eucalli.lead}</p>
    <div class="corebox"><h4>${S.eucalli.core.h}</h4><div class="sub">${S.eucalli.core.sub}</div>
      <div class="bar" id="coreBar">${S.eucalli.core.split.map(([n])=>`<div><span data-pct="${n}">0</span>%</div>`).join('')}</div>
      <div class="legend">${S.eucalli.core.split.map(([,b,t])=>`<div><b>${b}</b>${t}</div>`).join('')}</div></div>
    <div class="feats">${S.eucalli.feats.map(([b,p])=>`<div><b>${b}</b><p>${p}</p></div>`).join('')}</div>
    <div class="proof">${S.eucalli.proof.map(([src,c])=>`<button data-lb="proof" data-src="${R}${src}" data-cap="${c}"><img src="${R}${src}" alt="${c}"></button>`).join('')}<small>${S.eucalli.proofNote}</small></div>
  </div>
</div></section>

<section id="new-home" style="background:var(--white)"><div class="wrap"><div class="next">
  <div class="tx"><div class="eyebrow">What comes next</div><h2 class="t h2 split">${RX.HOME.h}</h2><p class="lead">${RX.HOME.p}</p>
    <div class="ctas"><a href="#contact" class="btn btn-solid">Visit us ${ic('arrow')}</a></div></div>
  <div class="reel" id="nReel"></div>
</div></div></section>

<section id="story"><div class="wrap story">
  <div class="stick"><div class="eyebrow rv">${S.story.eyebrow}</div><h2 class="t h2 split">${S.story.h2}</h2><p class="lead rv">${S.story.lead}</p></div>
  <ol class="yl">${S.story.years.map(([y,h,p,img,k])=>`<li><div class="y">${y}</div><div><h3>${h}</h3><p>${p}</p></div><div class="th ${k||''}"><img src="${R}${img.replace('site-aerial','renders/new-corner')}" alt="" loading="lazy"></div></li>`).join('')}</ol>
</div></section>

<section class="white voices" id="recognition"><div class="wrap">
  <div class="eyebrow rv">${S.quotes.eyebrow}</div>
  <div class="q-stack">${S.quotes.list.map(([q,n,r])=>`<div class="q"><blockquote>“${q}”</blockquote><cite><b>${n}</b> · ${r}</cite></div>`).join('')}</div>
  <div class="q-dots">${S.quotes.list.map((_,i)=>`<button aria-label="Quote ${i+1}"></button>`).join('')}</div>
  <div class="cgrid">${S.certs.list.map(c=>`<button class="cert" data-lb="certs" data-src="${R}${c.src}" data-cap="${c.h} · ${c.yr}"><div class="fr"><img src="${R}${c.src}" alt="${c.h}" loading="lazy"></div><span class="yrp">${c.yr}</span><h3>${c.h}</h3><p>${c.p}</p></button>`).join('')}</div>
</div></section>

<section id="contact"><div class="wrap">
  <div class="ct">
    <div class="ct-info"><div class="eyebrow">${S.contact.eyebrow}</div><h2 class="t h2">${S.contact.h2}</h2>
      <div class="r">${ic('i-phone')}<div><b>Phone</b><div class="tels">${Core.tels()}</div></div></div>
      <div class="r">${ic('i-mail')}<div><b>Email</b>${Core.mail()}</div></div>
      <div class="r">${ic('i-pin')}<div><b>Address</b>${S.contact.address.join(' ')}<div class="links"><a href="${S.contact.gmaps}" target="_blank" rel="noopener">Google Maps</a><a href="${S.contact.waze}" target="_blank" rel="noopener">Waze</a></div></div></div>
      <div class="r">${ic('i-clock')}<div><b>Office hours</b>${S.contact.hours.join(' · ')}</div></div></div>
    <form id="form" novalidate>${RX.form()}
      <div class="full"><button class="btn btn-solid" type="submit">Send enquiry ${ic('arrow')}</button></div>
      <div class="sent" id="sent">${S.contact.sent}</div></form>
  </div>
  <div class="map">${RX.map()}</div>
</div></section>`;

$('#foot').innerHTML=`<div class="wrap">
  <div class="f-grid">
    <div>${SHIMLEN_LOGO}<p style="margin-top:16px;font-size:14px;opacity:.75;max-width:32ch">${S.footer.blurb}</p>
      <div class="social"><a href="#" aria-label="Facebook">${ic('fb','fill')}</a><a href="#" aria-label="Instagram">${ic('ig','fill')}</a><a href="#" aria-label="Xiaohongshu">${ic('xhs','fill')}</a></div></div>
    <div><h5>Products</h5><ul>${P.slice(0,6).map((p,i)=>`<li><a href="#products" data-open="${i}">${p.n}</a></li>`).join('')}</ul></div>
    <div><h5>Company</h5><ul>${NAV.slice(0,6).map(([t,id])=>`<li><a href="#${id}">${t}</a></li>`).join('')}</ul></div>
    <div><h5>Visit</h5><ul><li>Lot 30482, Jalan P4/8C</li><li>Bandar Teknologi Kajang</li><li>43500 Semenyih, Selangor</li><li style="margin-top:10px">${Core.tels('</li><li>')}</li><li>${Core.mail()}</li></ul></div>
  </div>
  <div class="f-bottom"><span>${S.footer.legal}</span><span>${S.footer.links}</span></div>
  <p class="rx-note">${RX.note}</p>
  <div class="f-wm">${SHIMLEN_WORDMARK}</div>
</div>`;

/* the statement fills in word by word as it is read */
(function(){const el=$('#fill');el.innerHTML=el.textContent.trim().split(/\s+/).map(x=>`<span class="fw">${x}</span>`).join(' ');
  const ws=[...el.querySelectorAll('.fw')];
  const upd=()=>{if(document.documentElement.classList.contains('shot')){ws.forEach(w=>w.classList.add('on'));return}
    const r=el.getBoundingClientRect(),h=innerHeight,p=Math.min(1,Math.max(0,(h*.8-r.top)/(r.height+h*.25)));const n=Math.round(p*ws.length);ws.forEach((w,i)=>w.classList.toggle('on',i<n))};
  document.addEventListener('pagescroll',upd);upd()})();

/* board, surface, edge: point at a panel (or tap it) to open it */
(function(){const ps=$$('.ap');const open=p=>ps.forEach(x=>x.classList.toggle('on',x===p));
  ps.forEach(p=>{p.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')open(p)});p.addEventListener('click',e=>{if(!e.target.closest('button'))open(p)});p.addEventListener('focus',()=>open(p))})})();
RX.reel('rReel','slow',['new-front-dawn.jpg','new-front-dusk.jpg']);
RX.reel('nReel','slow',['new-corner-tropical.jpg','new-night.jpg','new-corner.jpg']);
RX.tag();
Core.init();

/* ---- motion: Open is slow. Nothing snaps; things settle. ---- */
$$('.makers figure,.scl-card').forEach(e=>e.dataset.cursor='View');
$$('.cert,.rec .cert,.proof button,.euc .lay,.h-rec').forEach(e=>e.dataset.cursor='Zoom');
$$('.hbox,.ct-info,footer,.scl-frame,.ap').forEach(e=>e.setAttribute('data-cur-dark',''));
const heroBits=['.h-copy>*','.h-stats>div'];
if(Motion.ok){gsap.set(heroBits,{opacity:0,y:22});gsap.set('.h-pic',{clipPath:'inset(8% 8% 8% 8% round 28px)'});gsap.set('#rReel',{scale:1.12})}
RX.loader('dawn',{preload:['img/renders/new-front-dawn.jpg'],min:2600,done(){if(!Motion.ok)return;
  gsap.to('.h-pic',{clipPath:'inset(0% 0% 0% 0% round 28px)',duration:2.4,ease:'power3.inOut'});
  gsap.to('#rReel',{scale:1,duration:3.2,ease:'power2.out'});
  gsap.to('.h-copy>*',{opacity:1,y:0,duration:1.6,ease:'power2.out',stagger:.22,delay:.5});
  gsap.to('.h-stats>div',{opacity:1,y:0,duration:1.4,ease:'power2.out',stagger:.12,delay:1.2})}});
Motion.init({intro:'none'});
Motion.masks('.makers figure,.euc .pic,.scl-card .im,.next .reel,.map');
Motion.expand($('#sclFrame'),'inset(7% 6% 7% 6% round 28px)','inset(0% 0% 0% 0% round 0px)',{start:'top 95%',end:'top 15%'});
Motion.scrub($('.scl-pic img'),{scale:1.18},{scale:1},{trigger:'#sclFrame',start:'top bottom',end:'bottom top'});
Motion.cascade('.scl-tx>*');
Motion.cascade('.trio>div,.scl-card .tx,.ap,.brands,.rec,.tl .step,.feats>div,.corebox,.yl li,.cgrid .cert,.ct-info .r,.ct-info .h2,form,.nums>div,.next .tx>*');
Motion.parallax('.makers img',6);
Motion.chars('.split');
Motion.scrub($('.makers figure:nth-child(2)'),{y:40},{y:-40},{trigger:'.makers'});
Motion.scrub($('.hbox'),{scale:.96},{scale:1},{trigger:'.health',start:'top bottom',end:'top 40%'});
Motion.wordRise('.f-wm');
/* rooms: each picture rises over the last in step with the scroll, and the words in the middle of the screen are the ones in focus */
(function(){const st=$$('.rs-step'),fs=$$('.rs-pics figure'),n=$('#rsCnt');let c=-1;
  const mark=i=>{if(i===c)return;c=i;n.textContent=`0${i+1} / 0${st.length}`};
  if(Motion.ok&&innerWidth>900){
    fs.forEach((f,i)=>{if(!i)return;const st_={trigger:st[i],start:'top 78%',end:'top 14%',scrub:.9};
      gsap.fromTo(f,{clipPath:'inset(100% 0% 0% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',ease:'power1.inOut',scrollTrigger:st_});
      gsap.fromTo(f.querySelector('img'),{scale:1.14,yPercent:8},{scale:1,yPercent:0,ease:'power1.out',scrollTrigger:Object.assign({},st_)})});
    const focus=()=>{const mid=innerHeight*.5;let best=0,bd=1e9;
      st.forEach((s,i)=>{const r=s.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-mid);if(d<bd){bd=d;best=i}
        s.style.opacity=Math.max(.2,Math.min(1,1.25-d/(r.height*.75))).toFixed(3)});mark(best)};
    document.addEventListener('pagescroll',focus);addEventListener('scroll',focus,{passive:true});focus();
  }else{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const i=+e.target.dataset.i;
      fs.forEach((f,j)=>{f.classList.toggle('was',j<i);f.classList.toggle('on',j===i)});mark(i)}),{rootMargin:'-45% 0px -45% 0px'});
    st.forEach(s=>io.observe(s));mark(0)}})();
</script>
</body>
</html>
