<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shimlen · Gridline · Option 3</title>
<meta name="description" content="High-quality materials for custom-made furniture: plywood, MFC, HPL, edgeband, acoustic and lacquered panels. 10,000 sq m warehouse in Semenyih, Selangor.">
<link rel="icon" href="../img/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/motion.css">
<style>
/* Option 3 · Studio: editorial. Warm off-white and stone, one even 12-column grid, big tight type. */
:root{--bg:#ECE9E4;--fg:#1E1B1B;--fg2:#4D4746;--mut:#736A68;--line:rgba(30,27,27,.15);--acc:#867774;--stone:#A39996;--paper:#F7F5F2;--ink:#1E1B1B;
  --g:24px;--hh:64px;--wrap:min(1440px,calc(100vw - 48px));--pad:clamp(64px,7vw,110px);--drawer-bg:#F7F5F2;--drawer-line:rgba(30,27,27,.14)}
body{font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--g)}
.grid>*{min-width:0}
.big{font-weight:400;letter-spacing:-.045em;line-height:.96}
.h2{font-size:clamp(40px,5.2vw,84px)}
.lab{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--paper);color:var(--fg);padding:5px 9px}
.lead{font-size:clamp(16px,1.25vw,19px);line-height:1.5;color:var(--fg2);letter-spacing:-.01em}
section{position:relative;padding:var(--pad) 0 0}
.tel{border-bottom:1px solid currentColor;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:500;padding:13px 18px;border:1px solid var(--fg);transition:background .3s,color .3s}
.btn .ic{width:16px;height:16px;transition:transform .3s var(--ease)}
.btn:hover{background:var(--fg);color:var(--paper)}
.btn:hover .ic{transform:translateX(4px)}
.btn-solid{background:var(--fg);color:var(--paper)}
.btn-solid:hover{background:var(--acc);border-color:var(--acc)}
.btn-white{border-color:#fff;color:#fff}.btn-white:hover{background:#fff;color:var(--fg)}

/* header */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;background:rgba(236,233,228,.94);backdrop-filter:blur(10px);transition:transform .45s var(--ease)}
#hdr.hide{transform:translateY(-100%)}
#progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--fg);transform-origin:left;transform:scaleX(0)}
.nav{height:100%;display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--g);align-items:center}
.nav .brand{grid-column:1/3;color:var(--fg)}
.nav .brand .wm{width:120px}
.nav-links{grid-column:3/11;display:flex;justify-content:center;gap:26px;font-size:14.5px;font-weight:500}
.nav-links a{position:relative;padding:4px 0}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1)}
.nav-r{grid-column:11/13;justify-self:end;display:flex;gap:14px;align-items:center}
.nav-r .btn{padding:9px 14px;font-size:14px}
.burger{display:none;font-size:15px;font-weight:500}
.menu{position:fixed;inset:0;background:var(--bg);z-index:55;padding:calc(var(--hh) + 24px) 24px 40px;display:flex;flex-direction:column;transform:translateY(-100%);transition:transform .6s var(--ease)}
.menu a{font-size:40px;letter-spacing:-.04em;line-height:1.15;border-bottom:1px solid var(--line);padding:6px 0}
body.menu-open .menu{transform:none}

/* hero: the headline sits on the film */
.hero{padding-top:calc(var(--hh) + 14px)}
.hero .reel{height:calc(100svh - var(--hh) - 28px);min-height:520px}
.hero .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(20,17,17,.72),rgba(20,17,17,.15) 50%,rgba(20,17,17,0) 70%),linear-gradient(90deg,rgba(20,17,17,.35),rgba(20,17,17,0) 55%)}
.hero .tagl{position:absolute;left:18px;top:18px;z-index:2}
.h-over{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 clamp(18px,2.4vw,34px) clamp(22px,3vw,40px);color:#fff;align-items:end;row-gap:18px}
.h-over h1{grid-column:1/10;font-size:clamp(46px,6.6vw,112px)}
.h-over .ctas{grid-column:10/13;display:flex;flex-direction:column;gap:10px}
.h-under{margin-top:clamp(28px,3vw,44px);align-items:start;row-gap:24px}
.h-under .lab{grid-column:1/3;padding-top:.35em}
.h-under .lead{grid-column:3/7}
.stats{grid-column:7/13;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g)}
.stat{border-top:1px solid var(--fg);padding-top:10px}
.stat .n{font-size:clamp(30px,2.8vw,46px);letter-spacing:-.05em;line-height:1}
.stat .n small{font-size:.36em;letter-spacing:0;margin-left:4px;color:var(--acc)}
.stat .l{font-size:12.5px;color:var(--fg2);margin-top:6px}
.rec-line{grid-column:1/-1;display:flex;align-items:center;gap:18px;margin-top:26px;background:var(--fg);color:var(--paper);padding:14px 18px;text-align:left}
.rec-line img{width:62px}
.rec-line span{flex:1;font-size:14.5px}
.rec-line b{font-weight:600;margin-right:8px}
.rec-line em{font-style:normal;font-size:13px;line-height:1;padding:4px 0 3px;border-bottom:1px solid;align-self:center;white-space:nowrap}

/* about */
.ab .lab{grid-column:1/3;padding-top:.5em}
.ab h2{grid-column:3/10}
.pills{grid-column:3/13;display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.pills span{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;background:var(--paper);padding:5px 14px 5px 5px}
.pills i{width:34px;height:34px;background:var(--fg);display:grid;place-items:center}
.pills img{width:20px;height:20px;object-fit:contain}
.ab-row{margin-top:clamp(36px,4vw,56px);row-gap:var(--g)}
.ab-img{grid-column:1/7;position:relative;min-height:440px}
.ab-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ab-img .tag{position:absolute;left:12px;bottom:12px;z-index:2}
.ab-cols{grid-column:7/13;display:grid;gap:var(--g);align-content:start}
.ab-col{border-top:1px solid var(--fg);padding-top:12px;display:grid;grid-template-columns:44px 1fr;gap:8px 12px}
.ab-col .no{font-size:13px;font-weight:600;color:var(--acc);padding-top:4px}
.ab-col h3{font-size:22px;font-weight:500;letter-spacing:-.03em;line-height:1.15}
.ab-col p{grid-column:2;font-size:15px;color:var(--fg2)}

/* products */
.sec-top{align-items:end;row-gap:16px;margin-bottom:clamp(26px,3vw,40px)}
.sec-top .lab{grid-column:1/-1}
.sec-top h2{grid-column:1/8}
.sec-top .lead{grid-column:8/13}
.filters{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.filters button{font-size:14px;font-weight:500;padding:8px 14px;border:1px solid var(--line);transition:.3s}
.filters button.on{background:var(--fg);color:var(--paper);border-color:var(--fg)}
.filters button sup{font-size:10px;margin-left:3px;opacity:.6}
.pgrid{row-gap:clamp(26px,3vw,40px)}
.prod{grid-column:span 4;text-align:left;display:flex;flex-direction:column;gap:10px}
.prod.hid{display:none}
.prod .ph{aspect-ratio:4/3;overflow:hidden;background:#DCD7D1;position:relative}
.prod .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.prod:hover .ph img{transform:scale(1.04)}
.prod .ph .tag{position:absolute;left:10px;top:10px}
.prod .meta{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.prod h3{font-size:clamp(19px,1.5vw,23px);font-weight:500;letter-spacing:-.03em;line-height:1.1}
.prod .b{font-size:13px;color:var(--fg2);margin-top:3px}
.prod .plus{font-size:22px;line-height:1;transition:transform .4s var(--ease)}
.prod:hover .plus{transform:rotate(90deg)}
.bgrid{margin-top:clamp(44px,5vw,70px);align-items:start}
.bgrid .lab{grid-column:1/3;padding-top:4px}
.bgrid .logos{grid-column:3/13;display:grid;grid-template-columns:repeat(8,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.logo-cell{min-width:0;aspect-ratio:1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;background:var(--paper)}
.logo-cell img{height:44%;max-width:78%;object-fit:contain}
.logo-cell img.sm{height:30%}
.logo-cell span{font-size:11px;color:var(--mut);text-align:center}

/* low formaldehyde */
.stone{background:var(--stone);padding-bottom:var(--pad);margin-top:var(--pad);--fg2:#2E2929;--line:rgba(30,27,27,.22);--acc:#2E2929}
.lf-grid{align-items:start;row-gap:30px}
.lf-copy{grid-column:1/6}
.lf-copy h2{margin:12px 0 16px}
.lf-right{grid-column:7/13;display:flex;flex-direction:column;gap:30px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:26px var(--g);--fill:0}
.step{border-top:2px solid rgba(30,27,27,.25);padding-top:12px;cursor:pointer;position:relative}
.step::before{content:"";position:absolute;left:0;top:-2px;height:2px;width:0;background:var(--fg);transition:width 1.1s var(--ease)}
.step.on::before{width:100%}
.step .y{font-size:clamp(36px,3.4vw,54px);letter-spacing:-.05em;line-height:1}
.step p{font-size:14.5px;color:var(--fg2);margin-top:8px}
.record{margin-top:28px;display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center;background:var(--paper);padding:20px}
.record .cert{width:100%;cursor:zoom-in;box-shadow:0 12px 26px rgba(30,27,27,.2)}
.record .num{font-size:clamp(60px,6.4vw,104px);letter-spacing:-.06em;line-height:.85}
.record .num small{font-size:.16em;letter-spacing:0;margin-left:8px}
.record h4{font-size:16px;font-weight:500;letter-spacing:-.02em;line-height:1.3;margin-top:10px}
.record p{font-size:13.5px;color:var(--fg2);margin-top:4px}
.lf-right .e0{display:flex;gap:14px;align-items:center;font-size:14.5px;background:var(--paper);padding:14px 16px}
.lf-right .e0 img{width:52px;background:#fff;padding:4px}

/* eucalli */
.euc{row-gap:36px;align-items:start}
.euc .media{grid-column:1/7;position:sticky;top:calc(var(--hh) + 20px);height:min(calc(100svh - var(--hh) - 40px),760px)}
.euc .media img{width:100%;height:100%;object-fit:cover}
.euc .media .tag{position:absolute;left:12px;bottom:12px;z-index:2}
.euc .media .lay{position:absolute;right:12px;top:12px;width:36%;background:var(--paper);padding:8px;z-index:2;cursor:zoom-in}
.euc .copy{grid-column:8/13}
.euc .logo2{height:40px;width:auto;margin:14px 0 22px}
.euc h2{font-size:clamp(34px,3.4vw,54px);margin-bottom:18px}
.core{margin:28px 0;border-top:1px solid var(--fg);padding-top:12px}
.core h4{font-size:19px;font-weight:500;letter-spacing:-.02em}
.core .sub{font-size:13px;color:var(--mut);margin:2px 0 14px}
.bar{display:flex;height:58px;font-size:21px;letter-spacing:-.03em;color:#fff;background:rgba(30,27,27,.06)}
.bar>div{display:flex;align-items:flex-end;padding:0 0 8px 12px;width:0;transition:width 1s var(--ease)}
.bar>div:first-child{background:var(--fg)}.bar>div:last-child{background:var(--acc)}
.bar.in>div:first-child{width:60%}.bar.in>div:last-child{width:40%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px;font-size:14px;color:var(--fg2)}
.legend b{display:block;color:var(--fg);font-weight:500}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:20px var(--g)}
.feats>div{border-top:1px solid var(--line);padding-top:10px}
.feats b{font-weight:500;font-size:17px;letter-spacing:-.02em}
.feats p{font-size:14px;color:var(--fg2);margin-top:3px}
.proof{display:grid;grid-template-columns:repeat(3,72px) 1fr;gap:12px;margin-top:26px;align-items:center}
.proof button{aspect-ratio:3/4;overflow:hidden;background:#fff}
.proof img{width:100%;height:100%;object-fit:cover}
.proof small{font-size:13px;color:var(--fg2)}

/* warehouse */
.wh .film{grid-column:1/-1;aspect-ratio:21/9}
.wh .film .tag{position:absolute;left:12px;top:12px;z-index:2}
.wh-copy{margin-top:clamp(26px,3vw,40px);row-gap:24px;align-items:start}
.wh-copy .lab{grid-column:1/3;padding-top:.6em}
.wh-copy h2{grid-column:3/8}
.wh-copy .side{grid-column:8/13}
.wh-copy ul{list-style:none;margin:18px 0 22px;border-top:1px solid var(--line)}
.wh-copy li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.wh-copy li .ic{width:20px;height:20px;color:var(--acc)}
.gal{margin-top:var(--g)}
.gal button{grid-column:span 4;aspect-ratio:3/2;overflow:hidden;cursor:zoom-in;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.gal button:hover img{transform:scale(1.04)}
.gal .tag{position:absolute;left:10px;bottom:10px}

/* story: years on the left, the chosen year on the right (one screen tall) */
.story-box{border-top:1px solid var(--fg);align-items:stretch}
.yl{grid-column:1/5;display:grid;grid-template-columns:1fr 1fr;align-content:start;border-right:1px solid var(--line)}
.yl button{display:flex;gap:12px;align-items:baseline;text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);transition:background .3s,color .3s}
.yl button:nth-child(odd){padding-left:0}
.yl button:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.yl b{font-size:22px;font-weight:500;letter-spacing:-.04em;min-width:58px}
.yl span{font-size:13px;color:var(--fg2);line-height:1.3}
.yl button:hover{background:var(--paper)}
.yl button.on{background:var(--fg);color:var(--paper)}
.yl button.on span{color:rgba(247,245,242,.75)}
.yd{grid-column:5/13;display:grid;grid-template-columns:1.25fr 1fr;gap:var(--g);padding:var(--g) 0 0 var(--g)}
.yd .md{aspect-ratio:4/3;background:#DCD7D1;display:grid;place-items:center;overflow:hidden}
.yd .md img{width:100%;height:100%;object-fit:cover;animation:paneIn .6s var(--ease)}
.yd .md.logo img,.yd .md.doc img{object-fit:contain;padding:12%}
.yd .md.archive img{filter:grayscale(.5)}
.yd .tx{display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.yd .y{font-size:clamp(64px,7vw,120px);letter-spacing:-.06em;line-height:.85}
.yd h3{font-size:26px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px}
.yd p{font-size:16px;color:var(--fg2)}
.yd .ctl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.yd .ctl button{width:42px;height:42px;border:1px solid var(--fg);display:grid;place-items:center}
.yd .ctl button:hover{background:var(--fg);color:var(--paper)}
.yd .ctl .ic{width:16px;height:16px}

/* recognition + quotes */
.rq{row-gap:36px;align-items:start}
.rq .certs{grid-column:1/9}
.rq .certs h2{margin:10px 0 6px}
.rq .certs .lead{margin-bottom:20px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g)}
.cert{text-align:left;display:flex;flex-direction:column;gap:8px}
.cert .fr{overflow:hidden;min-height:0;height:200px;background:var(--paper);display:grid;place-items:center;padding:14px;transition:background .3s}
.cert:hover .fr{background:#fff}
.cert .fr{position:relative}.cert .fr img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;filter:drop-shadow(0 6px 14px rgba(30,25,24,.22))}
.cert .yr{font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--acc)}
.cert h3{font-size:16px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.cert p{font-size:13px;color:var(--fg2);line-height:1.4}
.qs{grid-column:9/13;background:var(--fg);color:var(--paper);padding:clamp(22px,2.4vw,32px);align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.qs .lab{color:#C9BDB8}
.q blockquote{font-size:clamp(22px,1.9vw,30px);letter-spacing:-.03em;line-height:1.15}
.q cite{display:block;font-style:normal;margin-top:14px;font-size:14px;opacity:.75}
.q-dots{display:flex;gap:8px}
.q-dots button{font-size:13px;font-weight:500;opacity:.5;border-bottom:1px solid transparent}
.q-dots button.on{opacity:1;border-color:currentColor}

/* contact: compact */
.ct{align-items:start;row-gap:28px}
.ct-l{grid-column:1/6}
.ct-l h2{margin:10px 0 20px}
.info{display:grid;border-top:1px solid var(--fg)}
.info .r{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.info b{font-weight:500;font-size:13px;color:var(--fg2)}
.info .tels{display:flex;flex-wrap:wrap;gap:4px 14px}
.links{display:flex;gap:14px;margin-top:4px;font-size:14px}
.links a{border-bottom:1px solid}
form{grid-column:7/13;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px var(--g);align-content:start;background:var(--paper);padding:clamp(20px,2.2vw,30px)}
.field label{font-size:12.5px;font-weight:500;color:var(--fg2)}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;outline:none;font-size:15.5px;border-radius:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--fg)}
.field textarea{min-height:64px;resize:vertical}
.full{grid-column:1/-1}
.sent{grid-column:1/-1;background:var(--bg);padding:12px;font-size:14px}
.map{grid-column:1/-1;position:relative;height:340px;background:#DCD7D1;overflow:hidden}
.map-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--fg2);font-size:14px}
.map-ph a{border-bottom:1px solid}
.map-card{position:absolute;left:14px;bottom:14px;z-index:2;background:var(--paper);padding:18px 20px;width:min(380px,calc(100% - 28px))}
.map-card h3{font-size:20px;font-weight:500;letter-spacing:-.03em;margin-bottom:4px}
.map-card p{font-size:13.5px;color:var(--fg2)}
.map-card .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.map-card .btn{padding:9px 14px;font-size:13.5px}

/* footer */
footer{background:var(--stone);margin-top:var(--pad);padding-top:clamp(50px,5vw,70px);overflow:hidden}
.f-cols{row-gap:26px}
.f-cols>div{grid-column:span 3;font-size:14.5px}
.f-cols h5{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.f-cols ul{list-style:none;display:grid;gap:4px}
.f-cols a:hover{color:var(--paper)}
.social{display:flex;gap:14px;margin-top:14px}
.social .ic{width:20px;height:20px}
.f-wm{color:var(--fg);margin:clamp(40px,5vw,70px) 0 0;line-height:0}
.f-bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;padding:14px 0 20px;border-top:1px solid rgba(30,27,27,.25);margin-top:clamp(12px,1.6vw,20px)}

@media (max-width:1180px){.bgrid .logos{grid-template-columns:repeat(4,1fr)}.logo-cell{aspect-ratio:3/2}}
@media (max-width:1080px){
  .nav-links{display:none}.burger{display:block}.nav-r .btn{display:none}
  .h-over h1{grid-column:1/-1}.h-over .ctas{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .h-under .lab{grid-column:1/-1}.h-under .lead{grid-column:1/7}.stats{grid-column:7/13;grid-template-columns:1fr 1fr;row-gap:16px}
  .prod{grid-column:span 6}
  .lf-copy,.lf-right{grid-column:1/-1}
  .euc .media{grid-column:1/-1;position:relative;top:0;height:auto;aspect-ratio:16/10}.euc .copy{grid-column:1/-1}
  .yl{grid-column:1/-1;border-right:0}.yd{grid-column:1/-1;padding-left:0}
  .rq .certs,.qs{grid-column:1/-1}
  .ct-l,form{grid-column:1/-1}
  .f-cols>div{grid-column:span 6}
}
@media (max-width:860px){
  :root{--g:16px}
  .ab .lab,.ab h2,.pills,.sec-top h2,.sec-top .lead,.wh-copy .lab,.wh-copy h2,.wh-copy .side,.bgrid .lab,.bgrid .logos{grid-column:1/-1}
  .h-under .lead,.stats{grid-column:1/-1}
  .ab-img{grid-column:1/-1;min-height:0;aspect-ratio:4/3}.ab-cols{grid-column:1/-1}
  .wh .film{aspect-ratio:4/3}
  .gal button{grid-column:span 6}.gal button:last-child{display:none}
  .yl{grid-template-columns:repeat(7,auto);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
  .yl::-webkit-scrollbar{display:none}
  .yl button,.yl button:nth-child(even),.yl button:nth-child(odd){padding:10px 14px;border-left:0;border-right:1px solid var(--line);border-bottom:0;flex-direction:column;gap:2px;min-width:110px}
  .yl{display:flex}
  .yd{grid-template-columns:1fr}
  .cgrid{grid-template-columns:1fr 1fr}
  form{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  :root{--wrap:calc(100vw - 32px);--hh:58px}
  .hero .reel{height:78svh;min-height:480px}
  .h-over h1{font-size:clamp(40px,11.4vw,54px)}
  .h-over .ctas .btn{flex:1 1 100%}
  .stats{grid-template-columns:1fr 1fr}
  .rec-line{flex-wrap:wrap}.rec-line em{margin-left:80px}
  .prod{grid-column:1/-1}
  .bgrid .logos{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:1fr}
  .record{grid-template-columns:84px 1fr;gap:16px;padding:16px}
  .feats,.legend{grid-template-columns:1fr}
  .proof{grid-template-columns:repeat(3,64px) 1fr}
  .cert .fr{height:150px}.cert h3{font-size:15px}
  form{grid-template-columns:1fr}
  .info .r{grid-template-columns:84px 1fr}
  .map{height:auto;display:flex;flex-direction:column}
  .map .frame-box{position:relative!important;height:280px}
  .map-card{position:relative;left:0;bottom:0;width:100%}
  .f-cols>div{grid-column:1/-1}
}

/* motion */
:root{--pre-bg:#ECE9E4;--pre-fg:#1E1B1B;--cur:#1E1B1B}
.hero .reel{will-change:clip-path}
.ab-img,.euc .media{overflow:hidden}
</style>
</head>
<body>
<header id="hdr"><div class="wrap nav">
  <a href="#top" class="brand" aria-label="Shimlen home" id="hLogo"></a>
  <nav class="nav-links" id="navLinks"></nav>
  <div class="nav-r"><a class="btn btn-solid" href="#contact">Enquire ${''}</a><button class="burger" id="burger" aria-expanded="false">Menu</button></div>
</div><div id="progress"></div></header>
<nav class="menu" id="menu" aria-label="Menu"></nav>
<main id="app"></main>
<footer id="foot"></footer>

<script>window.ROOT='../'</script>
<script src="../shared/data.js"></script>
<script src="../shared/brand.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/ScrollTrigger.min.js"></script>
<script src="../shared/vendor/lenis.min.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/motion.js"></script>
<script>
const {ic,R}=Core,S=SH,P=S.products.list,cat=['board','board','surface','surface','surface','edge','board','board','board'];
const pad=n=>String(n).padStart(2,'0'),Y=S.story.years;
const nav=S.nav.map(([t,id])=>`<a href="#${id}">${t}</a>`).join('');
document.getElementById('navLinks').innerHTML=nav;
document.getElementById('menu').innerHTML=nav+`<a href="#contact">Enquire</a>`;
document.getElementById('hLogo').innerHTML=SHIMLEN_WORDMARK;
document.querySelector('.nav-r .btn').innerHTML='Enquire '+ic('arrow');
const counts={all:P.length,board:cat.filter(c=>c==='board').length,surface:cat.filter(c=>c==='surface').length,edge:cat.filter(c=>c==='edge').length};
/* short labels for the year list */
const YS=['Founded','Jalan Cheras','MIECO','Importer','Lot 4530','New home','E1 MFC','Trēo Merino','OPAQ','ISO 9001','Super E0','Sin Chew','Record','Growing'];

document.getElementById('app').innerHTML=`
<section class="hero" id="top" style="padding-bottom:0"><div class="wrap">
  <div class="reel" id="heroReel"><div class="shade"></div><span class="tag tagl">Semenyih, Selangor</span>
    <div class="grid h-over"><h1 class="big split">${S.hero.h1}</h1>
      <div class="ctas rv"><a href="#products" class="btn btn-white">Explore products ${ic('arrow')}</a><a href="#warehouse" class="btn btn-white">Inside the warehouse ${ic('arrow')}</a></div></div></div>
  <div class="grid h-under">
    <div class="lab rv">Since 1980</div>
    <p class="lead rv">${S.hero.lead}</p>
    <div class="stats">${S.hero.stats.map(([n,u,l])=>`<div class="stat rv"><div class="n"><span data-count="${n}">0</span><small>${u}</small></div><div class="l">${l}</div></div>`).join('')}</div>
    <button class="rec-line rv" data-lb="mbr" data-src="${R}img/cert-mbor.jpg" data-cap="The Malaysia Book of Records, 2025"><img src="${R}img/mbr-logo-white.png" alt="The Malaysia Book of Records"><span><b>${S.hero.record[0]}</b>${S.hero.record[1]}</span><em>View certificate</em></button>
  </div>
</div></section>

<section id="about"><div class="wrap">
  <div class="grid ab"><div class="lab rv">${S.about.eyebrow}</div><h2 class="big h2 split">${S.about.h2}</h2>
    <div class="pills rv">${S.about.pillars.map(([i,t])=>`<span><i><img src="${R}img/${i}" alt=""></i>${t}</span>`).join('')}</div></div>
  <div class="grid ab-row">
    <figure class="ab-img wipe"><img src="${R}${S.about.img}" alt="Shimlen building"><figcaption class="tag">${S.about.caption}</figcaption></figure>
    <div class="ab-cols">${S.about.tabs.map(([h,p],i)=>`<div class="ab-col rv" style="transition-delay:${i*.08}s"><span class="no">${pad(i+1)}</span><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>
  </div>
</div></section>

<section id="products"><div class="wrap">
  <div class="grid sec-top"><div class="lab rv">${S.products.eyebrow}</div><h2 class="big h2 split">${S.products.h2}</h2><p class="lead rv">${S.products.lead}</p>
    <div class="filters rv" id="filters">${[['all','All'],['board','Board'],['surface','Surface'],['edge','Edge']].map(([c,t],i)=>`<button class="${i?'':'on'}" data-c="${c}">${t}<sup>${pad(counts[c])}</sup></button>`).join('')}</div></div>
  <div class="grid pgrid">${P.map((p,i)=>`<button class="prod rv" data-p="${i}" data-cat="${cat[i]}" style="transition-delay:${(i%3)*.08}s"><div class="ph"><img src="${R}${p.img.replace('.jpg','-card.jpg')}" alt="${p.n}" loading="lazy"><span class="tag">${cat[i]}</span></div>
    <div class="meta"><div><h3>${p.n}</h3><div class="b">${p.b}</div></div><span class="plus">+</span></div></button>`).join('')}</div>
  <div class="grid bgrid" id="brands"><div class="lab rv">Brands we carry</div><div class="logos rv">${S.brands.map(([img,n,c])=>`<div class="logo-cell"><img class="${c||''}" src="${R}img/${img}" alt="${n}"><span>${n}</span></div>`).join('')}</div></div>
</div></section>

<section class="stone" id="low-formaldehyde"><div class="wrap">
  <div class="grid lf-grid"><div class="lf-copy"><div class="lab rv">${S.lf.eyebrow}</div><h2 class="big h2 split">${S.lf.h2}</h2><p class="lead rv">${S.lf.lead}</p>
    <div class="record rv"><img class="cert" src="${R}${S.lf.record.img}" alt="Malaysia Book of Records certificate" data-lb="rec" data-cap="The Malaysia Book of Records, 2025">
      <div><div class="num"><span data-count="${S.lf.record.n}">0</span><small>${S.lf.record.unit}</small></div><h4>${S.lf.record.h}</h4><p>${S.lf.record.p}</p></div></div></div>
    <div class="lf-right"><div class="steps" id="steps">${S.lf.steps.map(([y,p])=>`<div class="step"><div class="y">${y}</div><p>${p}</p></div>`).join('')}</div>
      <div class="e0 rv"><img src="${R}img/b-e0.png" alt="E0">${S.lf.e0}</div></div></div>
</div></section>

<section id="eucalli"><div class="wrap grid euc">
  <div class="media wipe"><img src="${R}${S.eucalli.img}" alt="eucalli E0 melamine faced plywood"><span class="tag">${S.eucalli.tag}</span>
    <button class="lay" data-lb="layers" data-src="${R}img/eucalli-layers.png" data-cap="eucalli E0 · the layers"><img src="${R}img/eucalli-layers.png" alt="eucalli E0 board layers"></button></div>
  <div class="copy"><div class="lab rv">${S.eucalli.eyebrow}</div><img class="logo2 rv" src="${R}img/b-eucalli.png" alt="eucalli E0">
    <h2 class="big split">${S.eucalli.h2}</h2><p class="lead rv">${S.eucalli.lead}</p>
    <div class="core rv"><h4>${S.eucalli.core.h}</h4><div class="sub">${S.eucalli.core.sub}</div>
      <div class="bar" id="coreBar">${S.eucalli.core.split.map(([n])=>`<div><span data-pct="${n}">0</span>%</div>`).join('')}</div>
      <div class="legend">${S.eucalli.core.split.map(([,b,t])=>`<div><b>${b}</b>${t}</div>`).join('')}</div></div>
    <div class="feats rv">${S.eucalli.feats.map(([b,p])=>`<div><b>${b}</b><p>${p}</p></div>`).join('')}</div>
    <div class="proof rv">${S.eucalli.proof.map(([src,c])=>`<button data-lb="proof" data-src="${R}${src}" data-cap="${c}"><img src="${R}${src}" alt="${c}"></button>`).join('')}<small>${S.eucalli.proofNote}</small></div>
  </div>
</div></section>

<section class="wh" id="warehouse"><div class="wrap">
  <div class="grid"><div class="film" id="whFilm"><span class="tag">Warehouse · Semenyih</span></div></div>
  <div class="grid wh-copy"><div class="lab rv">${S.warehouse.eyebrow}</div><h2 class="big h2 split">${S.warehouse.h2}</h2>
    <div class="side rv"><p class="lead">${S.warehouse.lead}</p><ul>${S.warehouse.points.map(([i,t])=>`<li>${ic('i-'+i)}${t}</li>`).join('')}</ul><a href="#contact" class="btn btn-solid">Visit or enquire ${ic('arrow')}</a></div></div>
  <div class="grid gal">${S.warehouse.gallery.map(([src,c],i)=>`<button class="rv" style="transition-delay:${i*.08}s" data-lb="gal" data-src="${R}${src}" data-cap="${c}"><img src="${R}${src}" alt="${c}" loading="lazy"><span class="tag">${c}</span></button>`).join('')}</div>
</div></section>

<section id="story"><div class="wrap">
  <div class="grid sec-top"><div class="lab rv">${S.story.eyebrow}</div><h2 class="big h2 split">${S.story.h2}</h2><p class="lead rv">${S.story.lead}</p></div>
  <div class="grid story-box rv">
    <div class="yl" id="yl">${Y.map(([y],i)=>`<button data-i="${i}"><b>${y}</b><span>${YS[i]}</span></button>`).join('')}</div>
    <div class="yd" id="yd"></div>
  </div>
</div></section>

<section id="recognition"><div class="wrap grid rq">
  <div class="certs"><div class="lab rv">${S.certs.eyebrow}</div><h2 class="big h2 split">${S.certs.h2}</h2><p class="lead rv">${S.certs.lead}</p>
    <div class="cgrid">${S.certs.list.map((c,i)=>`<button class="cert rv" style="transition-delay:${i*.08}s" data-lb="certs" data-src="${R}${c.src}" data-cap="${c.h} · ${c.yr}"><div class="fr"><img src="${R}${c.src}" alt="${c.h}" loading="lazy"></div><span class="yr">${c.yr}</span><h3>${c.h}</h3><p>${c.p}</p></button>`).join('')}</div></div>
  <div class="qs rv"><div><div class="lab" style="margin-bottom:18px">${S.quotes.eyebrow}</div>
    <div class="q-stack">${S.quotes.list.map(([q,n,r])=>`<div class="q"><blockquote>“${q}”</blockquote><cite><b>${n}</b> · ${r}</cite></div>`).join('')}</div></div>
    <div class="q-dots">${S.quotes.list.map(([,n])=>`<button>${n}</button>`).join('')}</div></div>
</div></section>

<section id="contact"><div class="wrap grid ct">
  <div class="ct-l"><div class="lab rv">${S.contact.eyebrow}</div><h2 class="big h2 split">${S.contact.h2}</h2>
    <div class="info rv">
      <div class="r"><b>Phone</b><div class="tels">${Core.tels()}</div></div>
      <div class="r"><b>Email</b><div>${Core.mail()}</div></div>
      <div class="r"><b>Address</b><div>${S.contact.address.join(' ')}<div class="links"><a href="${S.contact.gmaps}" target="_blank" rel="noopener">Google Maps</a><a href="${S.contact.waze}" target="_blank" rel="noopener">Waze</a></div></div></div>
      <div class="r"><b>Office hours</b><div>${S.contact.hours.join(' · ')}</div></div>
    </div></div>
  <form id="form" class="rv" novalidate>
    <div class="field"><label>Name *</label><input name="name" required><div class="msg">Please enter your name</div></div>
    <div class="field"><label>Phone / WhatsApp *</label><input name="phone" type="tel" required><div class="msg">Please enter a contact number</div></div>
    <div class="field"><label>Email</label><input name="email" type="email"><div class="msg">Please check the email address</div></div>
    <div class="field"><label>Company</label><input name="company"></div>
    <div class="field"><label>I am a</label><select name="role">${S.contact.roles.map(r=>`<option>${r}</option>`).join('')}</select></div>
    <div class="field"><label>Product</label><select name="product" id="prodSelect"></select></div>
    <div class="field full"><label>Message</label><textarea name="msg" placeholder="Decors, sizes, quantities…"></textarea></div>
    <div class="full"><button class="btn btn-solid" type="submit">Send enquiry ${ic('arrow')}</button></div>
    <div class="sent" id="sent">${S.contact.sent}</div>
  </form>
  <div class="map" id="map"><div class="frame-box" style="position:absolute;inset:0"><div class="map-ph">${ic('i-pin')}<span>Loading map…</span><a href="${S.contact.gmaps}" target="_blank" rel="noopener">Open in Google Maps</a></div>
    <iframe class="map-frame" id="mapFrame" title="Shimlen Sdn. Bhd. on Google Maps" referrerpolicy="no-referrer-when-downgrade" data-src="${S.contact.embed}"></iframe></div>
    <div class="map-card"><h3>Shimlen Sdn. Bhd.</h3><p>${S.contact.address[0]} 43500 Semenyih, Selangor<br>Mon – Fri 8am – 5pm · Sat 8am – 1pm</p>
      <div class="acts"><a class="btn btn-solid" href="${S.contact.directions}" target="_blank" rel="noopener">Get directions ${ic('arrow')}</a><a class="btn" href="${S.contact.wazeGo}" target="_blank" rel="noopener">Waze</a></div></div></div>
</div></section>`;

document.getElementById('foot').innerHTML=`<div class="wrap">
  <div class="grid f-cols">
    <div><h5>Shimlen</h5><p>${S.footer.blurb}</p><div class="social"><a href="#" aria-label="Facebook">${ic('fb','fill')}</a><a href="#" aria-label="Instagram">${ic('ig','fill')}</a><a href="#" aria-label="Xiaohongshu">${ic('xhs','fill')}</a></div></div>
    <div><h5>Products</h5><ul>${P.slice(0,6).map((p,i)=>`<li><a href="#products" data-open="${i}">${p.n}</a></li>`).join('')}</ul></div>
    <div><h5>Company</h5><ul><li><a href="#about">About us</a></li><li><a href="#brands">Brands</a></li><li><a href="#low-formaldehyde">Low formaldehyde</a></li><li><a href="#warehouse">Warehouse</a></li><li><a href="#story">Our story</a></li><li><a href="#recognition">Recognition</a></li></ul></div>
    <div><h5>Visit</h5><ul><li>Lot 30482, Jalan P4/8C</li><li>Bandar Teknologi Kajang</li><li>43500 Semenyih, Selangor</li><li style="margin-top:10px">${Core.tels('</li><li>')}</li><li>${Core.mail()}</li></ul></div>
  </div>
  <div class="f-wm">${SHIMLEN_WORDMARK}</div>
  <div class="f-bot"><span>${S.footer.legal}</span><span>${S.footer.links}</span></div>
</div>`;

document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.prod').forEach(p=>p.classList.toggle('hid',b.dataset.c!=='all'&&p.dataset.cat!==b.dataset.c))});

/* story: pick a year */
(function(){const yd=document.getElementById('yd'),bs=[...document.querySelectorAll('#yl button')];let cur=-1;
  const show=i=>{i=(i+Y.length)%Y.length;if(i===cur)return;cur=i;const [y,h,p,img,k]=Y[i];
    bs.forEach((b,j)=>b.classList.toggle('on',j===i));
    if(innerWidth<=860)bs[i].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    yd.innerHTML=`<div class="md ${k||''}"><img src="${R}${img}" alt=""></div><div class="tx"><div class="y">${y}</div><div><h3>${h}</h3><p>${p}</p></div>
      <div class="ctl"><button id="yP" aria-label="Previous year">${ic('back')}</button><button id="yN" aria-label="Next year">${ic('arrow')}</button><span>${pad(i+1)} of ${Y.length}</span></div></div>`;
    document.getElementById('yP').onclick=()=>show(cur-1);document.getElementById('yN').onclick=()=>show(cur+1)};
  bs.forEach(b=>b.onclick=()=>show(+b.dataset.i));show(0)})();

Core.init();

/* ---- motion ---- */
document.querySelectorAll('.prod').forEach(e=>e.dataset.cursor='View');
document.querySelectorAll('.gal button,.cgrid .cert,.record .cert,.proof button,.lay').forEach(e=>e.dataset.cursor='Zoom');
document.querySelectorAll('.qs,.rec-line,.h-over').forEach(e=>e.setAttribute('data-cur-dark',''));
Motion.init({intro:'type',onReady(){if(!Motion.ok)return;
  gsap.fromTo('#heroReel',{clipPath:'inset(12% 10% 12% 10%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:1.6,ease:'expo.out',clearProps:'clipPath',onComplete:heroScrub})}});
/* hero: the film recedes into a frame while the headline lifts away */
function heroScrub(){Motion.scrub(document.getElementById('heroReel'),{clipPath:'inset(0% 0% 0% 0%)'},{clipPath:'inset(8% 6% 8% 6%)'},{trigger:'.hero',start:'top top',end:'bottom top'})}
if(!Motion.ok)heroScrub();
Motion.scrub(document.querySelector('.h-over h1'),{y:0},{y:-160},{trigger:'.hero',start:'top top',end:'bottom top'});
/* big headings drift a little sideways, editorial style */
document.querySelectorAll('.sec-top h2,.ab h2,.wh-copy h2').forEach((h,i)=>Motion.scrub(h,{xPercent:i%2?-3:3},{xPercent:i%2?3:-3},{}));
Motion.masks('.ab-img,.euc .media,.yd,.map,.rec-line');
Motion.cascade('.stat,.ab-col,.pills span,.prod,.logo-cell,.step,.feats>div,.cgrid .cert,.info .r,.yl button');
Motion.tilt('.prod .ph,.cgrid .cert .fr',5);
Motion.scramble('.lab');
Motion.expand(document.querySelector('.wh .film'),'inset(10% 12% 10% 12%)','inset(0% 0% 0% 0%)');
Motion.scrub(document.querySelector('.record .num'),{scale:.8,transformOrigin:'0% 100%'},{scale:1},{start:'top bottom',end:'center center'});
Motion.parallax('.ab-img img,.gal img,.euc .media>img',8);
Motion.chars('section:not(.hero) .split');
Motion.cascade('section:not(.hero) .rv, .h-under .rv:not(.rec-line)');
Motion.wordRise('.f-wm');
</script>
</body>
</html>
