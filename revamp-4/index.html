<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shimlen · Moodboard · Revamp 4</title>
<meta name="description" content="Every room starts with a board. Plywood, MFC, HPL, lacquered and acoustic panels, edgeband: 500+ decors, in stock in Semenyih, Selangor.">
<link rel="icon" href="../img/logo-mark.svg">
<script>if(!matchMedia('(prefers-reduced-motion:reduce)').matches&&location.search.indexOf('shot')<0)document.documentElement.classList.add('rx-loading')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/motion.css">
<link rel="stylesheet" href="../shared/rx.css">
<style>
/* Revamp 4 · Quiet, made younger — pictures first, few words, things that move when you scroll.
   The rooms slide past sideways, the decors sit in a wall you can play with, the range is a rail of big cards,
   the warehouse is one number that lands, the new building stacks up in cards, and 45 years flip like a photo album. */
:root{--bg:#fff;--fg:#1F1B19;--fg2:#5B5451;--mut:#6E6663;--line:#E7E1DB;--acc:#7A6865;--soft:#F5F1EC;--oak:#D9B98F;--sage:#5F6B58;--walnut:#3B2F28;
  --ser:"Instrument Serif",Georgia,serif;--hh:76px;--r:22px;--wrap:min(1320px,calc(100vw - 64px));--pad:clamp(90px,10vw,160px);
  --drawer-bg:#fff;--drawer-line:#E7E1DB;--rxl-bg:#fff;--pre-bg:#1F1B19;--pre-fg:#fff;--cur:#1F1B19}
::selection{background:#E9DFD7}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:15.5px;line-height:1.65;color:var(--fg)}
em.i{font-family:var(--ser);font-style:italic;font-weight:400;letter-spacing:-.005em}
.big{font-weight:500;font-size:clamp(44px,6.4vw,104px);line-height:.96;letter-spacing:-.05em}
.mid{font-weight:500;font-size:clamp(32px,3.8vw,58px);line-height:1;letter-spacing:-.04em}
.lab{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--fg)}
.lab::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--oak)}
.lab.dk{background:rgba(20,16,15,.48);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.p{font-size:16.5px;color:var(--fg2);max-width:44ch}
section{position:relative;padding:var(--pad) 0}
.tel{border-bottom:1px solid currentColor;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 24px;border-radius:999px;font-size:15px;font-weight:500;transition:background .3s,color .3s,transform .3s var(--ease)}
.btn .ic{width:16px;height:16px;transition:transform .35s var(--ease)}
.btn:hover .ic{transform:translateX(4px)}
.btn-ink{background:var(--fg);color:#fff}.btn-ink:hover{background:var(--walnut)}
.btn-oak{background:var(--oak);color:var(--fg)}.btn-oak:hover{background:#E6CBA6}
.btn-w{background:#fff;color:var(--fg)}.btn-w:hover{background:var(--oak)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;background:#fff;color:var(--fg);transition:background .25s,color .25s}
.pill:hover{background:var(--oak)}
.rnd-b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:background .3s,color .3s,border-color .3s}
.rnd-b:hover:not(:disabled){background:var(--fg);color:#fff;border-color:var(--fg)}
.rnd-b:disabled{opacity:.3;cursor:default}

/* header */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;color:#fff;--logo-a:#fff;--logo-b:#E7DED7;transition:background .4s,color .4s,transform .5s var(--ease),box-shadow .4s}
#hdr.scrolled{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--fg);--logo-a:#1F1B19;--logo-b:#7A6865;box-shadow:0 1px 0 var(--line)}
#hdr.hide{transform:translateY(-100%)}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between}
.nav .logo{width:136px}
.nav-r{display:flex;gap:8px;align-items:center}
.nav-r .btn{padding:11px 18px;font-size:14px}
#hdr:not(.scrolled) .nav-r .btn-ink{background:#fff;color:var(--fg)}
.mbtn{display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid currentColor}
.mbtn i{display:grid;gap:4px}.mbtn i b{display:block;width:16px;height:1.5px;background:currentColor;transition:transform .3s}
body.menu-open .mbtn i b:first-child{transform:translateY(2.75px) rotate(45deg)}body.menu-open .mbtn i b:last-child{transform:translateY(-2.75px) rotate(-45deg)}
.nav-links{display:none}
.menu{position:fixed;inset:0;z-index:55;background:var(--fg);color:#fff;display:grid;grid-template-columns:1.1fr .9fr;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
body.menu-open .menu{opacity:1;visibility:visible}
body.menu-open #hdr{background:transparent;box-shadow:none;color:#fff;--logo-a:#fff;--logo-b:#E7DED7}
.menu .ml{padding:calc(var(--hh) + 30px) clamp(24px,5vw,80px) 40px;display:flex;flex-direction:column;justify-content:center}
.menu a.m{display:flex;align-items:baseline;gap:18px;font-size:clamp(34px,4.6vw,68px);font-weight:500;letter-spacing:-.045em;line-height:1.12;color:rgba(255,255,255,.45);transition:color .3s}
.menu a.m span{font-size:13px;letter-spacing:0;font-weight:500;color:var(--oak)}
.menu a.m:hover{color:#fff}
.menu .mp{position:relative;overflow:hidden}
.menu .mp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s,transform 1.2s var(--ease);transform:scale(1.06)}
.menu .mp img.on{opacity:1;transform:none}
.menu .mf{display:flex;gap:18px;margin-top:40px;font-size:14px;color:rgba(255,255,255,.7);flex-wrap:wrap}

/* 1 · hero */
.hero{height:100svh;min-height:620px;padding:0;color:#fff;overflow:hidden;background:var(--fg)}
.hero .reel{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(18,14,12,.78) 0%,rgba(18,14,12,.38) 34%,rgba(18,14,12,0) 62%),linear-gradient(180deg,rgba(18,14,12,.4),rgba(18,14,12,0) 22%)}
.h-c{position:absolute;left:0;right:0;bottom:clamp(86px,12vh,130px);z-index:2}
.h-c .row{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.hero h1{font-weight:500;font-size:clamp(52px,8.6vw,150px);line-height:.92;letter-spacing:-.055em;max-width:9.5ch;margin-top:20px;text-shadow:0 2px 30px rgba(0,0,0,.18)}
.hero h1 em.i{letter-spacing:-.02em}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em;margin-bottom:-.06em}
.hero h1 .w>span{display:inline-block}
.h-side{max-width:330px;display:flex;flex-direction:column;gap:18px;padding-bottom:10px}
.h-side p{font-size:15.5px;color:rgba(255,255,255,.9);text-shadow:0 1px 12px rgba(0,0,0,.3)}
.ticker{position:absolute;left:0;right:0;bottom:0;z-index:2;height:54px;border-top:1px solid rgba(255,255,255,.18);background:rgba(18,14,12,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden;display:flex;align-items:center}
.ticker .tt{display:flex;gap:0;white-space:nowrap;animation:tick 48s linear infinite;font-size:14px}
.ticker .tt span{display:inline-flex;align-items:center;gap:22px;padding-right:22px}
.ticker .tt span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--oak)}
.ticker .tt em{font-family:var(--ser);font-style:italic;font-size:18px}
@keyframes tick{to{transform:translateX(-50%)}}

/* 2 · rooms, sideways */
.hz{padding:0;background:var(--fg);color:#fff;overflow:hidden}
.hz-in{height:100svh;display:flex;align-items:center}
.hz-track{display:flex;gap:18px;padding:0 clamp(24px,4vw,64px);align-items:center;will-change:transform}
.hz-intro{flex:none;width:min(420px,80vw);padding-right:clamp(20px,3vw,60px)}
.hz-intro .big{margin:20px 0 22px;font-size:clamp(46px,5.6vw,92px)}
.hz-intro .p{color:rgba(255,255,255,.75)}
.hz-intro .hint{display:inline-flex;gap:10px;align-items:center;margin-top:28px;font-size:13.5px;color:rgba(255,255,255,.7)}
.hz-intro .hint i{width:44px;height:1px;background:currentColor;position:relative;overflow:hidden}
.panel{position:relative;flex:none;width:clamp(320px,52vw,820px);height:min(76svh,720px);border-radius:var(--r);overflow:hidden;background:#2a2421}
.panel:nth-child(odd){height:min(64svh,620px)}
.panel>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(15,12,10,.82),rgba(15,12,10,.2) 45%,rgba(15,12,10,0) 70%)}
.panel .tx{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:clamp(20px,2.4vw,34px)}
.panel .n{position:absolute;left:clamp(20px,2.4vw,34px);top:clamp(18px,2vw,28px);z-index:2;font-size:13px;font-weight:500;padding:6px 11px;border-radius:999px;background:rgba(20,16,15,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.panel h3{font-family:var(--ser);font-style:italic;font-weight:400;font-size:clamp(44px,5vw,84px);line-height:.95;letter-spacing:-.01em}
.panel p{font-size:15.5px;color:rgba(255,255,255,.88);max-width:40ch;margin:10px 0 16px}
.panel .chips{display:flex;flex-wrap:wrap;gap:6px}
.hint .hm{display:none}
.hz.native .hint .hd{display:none}.hz.native .hint .hm{display:inline}
.hz-end{flex:none;width:min(360px,70vw);padding-left:clamp(10px,2vw,40px)}
.hz-end .mid{margin-bottom:22px}
html:not(.motion) .hz-in,.hz.native .hz-in{height:auto;padding:var(--pad) 0}
html:not(.motion) .hz-track,.hz.native .hz-track{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hz.native .hz-track>*{scroll-snap-align:start}

/* 3 · decor wall */
.wall{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(120px,11vw,170px);gap:12px}
.wall>*{border-radius:var(--r);overflow:hidden;position:relative}
.wall .num{grid-column:span 2;grid-row:span 2;background:var(--fg);color:#fff;padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;justify-content:space-between}
.wall .num b{font-weight:500;font-size:clamp(64px,7.4vw,124px);letter-spacing:-.06em;line-height:.85}
.wall .num p{font-size:15px;color:rgba(255,255,255,.78);max-width:24ch}
.wall .ph{grid-column:span 2;grid-row:span 2}
.wall .ph img{width:100%;height:100%;object-fit:cover}
.wall .ph2{grid-column:span 2;grid-row:span 2}
.sw{cursor:pointer;transition:transform .5s var(--ease),box-shadow .5s;display:flex;align-items:flex-end;padding:12px}
.sw:hover{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 18px 40px rgba(31,27,25,.18);z-index:2}
.sw span{font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.88);color:var(--fg);transform:translateY(8px);opacity:0;transition:transform .4s var(--ease),opacity .4s}
.sw:hover span,.sw.on span{transform:none;opacity:1}
.wood{background-blend-mode:multiply}
.wnote{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--mut)}
.whead{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:clamp(36px,4vw,60px)}
.whead .big{margin-top:18px;max-width:11ch}

/* 4 · the range, a rail of big cards */
.range{background:var(--soft)}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:clamp(30px,3.6vw,54px)}
.rhead .big{margin-top:18px}
.ctl{display:flex;gap:10px}
.prail{gap:16px;padding:0 calc((100vw - var(--wrap))/2);scroll-padding:0 calc((100vw - var(--wrap))/2)}
.pc{width:clamp(270px,26vw,380px);text-align:left;display:flex;flex-direction:column;gap:14px}
.pc .im{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:#E6DED6}
.pc .im>img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.pc:hover .im>img{transform:scale(1.05)}
.pc .shot{position:absolute;left:14px;bottom:14px;width:30%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid #fff;z-index:3;transition:transform .5s var(--ease)}
.pc:hover .shot{transform:scale(1.1) rotate(-6deg)}
.pc .shot img{width:100%;height:100%;object-fit:cover}
.pc .no{position:absolute;right:14px;bottom:14px;z-index:3;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:background .3s,color .3s}
.pc:hover .no{background:var(--fg);color:#fff}
.pc .no .ic{width:16px;height:16px}
.pc h3{font-weight:500;font-size:clamp(22px,1.9vw,28px);letter-spacing:-.03em;line-height:1.08}
.pc .b{font-size:13.5px;color:var(--mut);margin-top:4px}
.ptrack{height:3px;border-radius:3px;background:#E3DBD3;margin-top:28px;overflow:hidden}
.ptrack i{display:block;height:100%;background:var(--fg);transform-origin:left;transform:scaleX(.1);transition:transform .3s}
.brands{margin-top:clamp(40px,4vw,60px)}
.mq-item{width:170px;height:84px;margin-right:10px;background:#fff;border-radius:16px;padding:12px}
.mq-item img{height:38px;width:auto;max-width:120px;object-fit:contain}
.mq-item img.sm{height:28px}
.mq-item span{display:none}

/* 5 · scale: one number lands */
.sc{padding:0;background:var(--fg);color:#fff}
html.motion .sc{height:220svh}
.sc-st{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}
.sc-st>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.75) sepia(.08) brightness(.55)}
.sc-st .smp{position:absolute;inset:0}
.sc-c{position:relative;z-index:2;text-align:center;padding:0 20px}
.sc-n{font-weight:500;font-size:clamp(76px,15vw,250px);line-height:.85;letter-spacing:-.065em;white-space:nowrap}
.sc-n small{font-family:var(--ser);font-style:italic;font-weight:400;font-size:.36em;letter-spacing:0;margin-left:.1em}
.sc-c p{font-size:clamp(17px,1.5vw,21px);margin-top:14px;color:rgba(255,255,255,.92)}
.sc-c p.sq{font-family:var(--ser);font-style:italic;font-size:clamp(22px,2.2vw,32px);margin-top:18px;color:#fff}
.sc-st>img.im2{opacity:0}
.sc-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.sc-pills span{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:14px;font-weight:500}

/* 6 · health */
.hl{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,5vw,90px);align-items:center}
.e0big{display:inline-block;font-family:var(--ser);font-style:italic;font-size:clamp(180px,24vw,400px);line-height:1;letter-spacing:-.03em;color:var(--sage);padding:.1em .22em .14em .16em;margin:-.225em -.22em -.265em -.16em;will-change:transform;backface-visibility:hidden}
.e0big+p{display:block}
.e0big+p{font-size:15px;color:var(--fg2);max-width:30ch;margin-top:18px}
.hl .mid{margin:18px 0 16px}
.yp{display:grid;gap:10px;margin-top:28px}
.yp .step{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:12px 18px 12px 12px;border-radius:999px;background:var(--soft);cursor:pointer;transition:background .5s,color .5s}
.yp .step b{font-weight:500;font-size:14px;padding:7px 12px;border-radius:999px;background:#fff;transition:background .5s,color .5s}
.yp .step p{font-size:14.5px;line-height:1.4}
.yp .step.on{background:var(--sage);color:#fff}
.yp .step.on b{background:rgba(255,255,255,.18);color:#fff}
.reccard{display:flex;gap:18px;align-items:center;margin-top:20px;padding:18px;border-radius:var(--r);border:1px solid var(--line)}
.reccard img{width:70px;border-radius:6px;cursor:zoom-in;box-shadow:0 8px 20px rgba(31,27,25,.15)}
.reccard b{font-weight:500;font-size:clamp(34px,3.4vw,50px);letter-spacing:-.05em;line-height:1}
.reccard div>span{display:block;font-size:13.5px;color:var(--fg2);margin-top:6px}
.euc{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r);overflow:hidden;background:var(--soft);margin-top:clamp(70px,8vw,120px)}
.euc .im{position:relative;min-height:460px}
.euc .im>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.euc .tx{padding:clamp(28px,4vw,60px);display:flex;flex-direction:column;justify-content:center}
.euc .tx img.lg{height:36px;width:auto;margin-bottom:18px;align-self:flex-start}
.euc .mid{font-size:clamp(28px,2.8vw,42px);margin-bottom:14px}
.bar{display:flex;height:46px;border-radius:999px;overflow:hidden;font-weight:500;font-size:15px;color:#fff;background:#E6DED6;margin-top:22px}
.bar>div{display:flex;align-items:center;padding-left:16px;width:0;transition:width 1s var(--ease)}
.bar>div:first-child{background:var(--fg)}.bar>div:last-child{background:var(--sage)}
.bar.in>div:first-child{width:60%}.bar.in>div:last-child{width:40%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;font-size:13.5px;color:var(--fg2)}
.legend b{display:block;font-weight:500;color:var(--fg)}
.euc .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;align-items:center}
.euc .proof{display:flex;gap:8px}
.euc .proof button{width:44px;height:58px;border-radius:8px;overflow:hidden;background:#fff}
.euc .proof img{width:100%;height:100%;object-fit:cover}

/* 7 · the new building, in a stack */
.nx{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,5vw,90px);align-items:start}
.nx .l{position:sticky;top:calc(var(--hh) + 40px)}
.nx .mid{margin:18px 0 16px}
.stack{display:grid;gap:0}
.card{position:sticky;top:calc(var(--hh) + 30px);height:min(66svh,620px);border-radius:var(--r);overflow:hidden;margin-bottom:40px;transform-origin:center top;box-shadow:0 -10px 40px rgba(31,27,25,.12)}
.card img{width:100%;height:100%;object-fit:cover}
.card figcaption{position:absolute;left:16px;bottom:16px;z-index:3;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.92)}
.card.rnd::after{top:16px;right:16px}

/* 8 · 45 years, like flipping an album */
.yrs{display:grid;grid-template-columns:6fr 6fr;gap:clamp(24px,4vw,70px);align-items:stretch}
.yshow{position:relative;border-radius:var(--r);overflow:hidden;background:var(--fg);color:#fff;min-height:540px;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(22px,3vw,40px)}
.yshow .yi{position:absolute;inset:0}
.yshow .yi img{width:100%;height:100%;object-fit:cover;opacity:.55;transition:opacity .5s}
.yshow .yi.fit{display:grid;place-items:center;background:var(--walnut)}
.yshow .yi.fit img{width:46%;height:46%;object-fit:contain;opacity:.95;background:#fff;padding:22px;border-radius:16px}
.yshow::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(18,14,12,.85),rgba(18,14,12,.1) 60%)}
.yshow>div:not(.yi){position:relative;z-index:2}
.yshow .yy{font-weight:500;font-size:clamp(80px,10vw,160px);line-height:.8;letter-spacing:-.06em}
.yshow h3{font-family:var(--ser);font-style:italic;font-weight:400;font-size:clamp(28px,2.6vw,40px);margin:16px 0 6px;line-height:1.05}
.yshow p{font-size:15.5px;color:rgba(255,255,255,.88);max-width:40ch}
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
.ygrid button{aspect-ratio:1;border-radius:16px;background:var(--soft);font-weight:500;font-size:clamp(18px,1.6vw,24px);letter-spacing:-.03em;display:grid;place-items:center;transition:background .3s,color .3s,transform .4s var(--ease)}
.ygrid button:hover{transform:translateY(-3px);background:#ECE4DC}
.ygrid button.on{background:var(--fg);color:#fff}
.yhead{margin-bottom:clamp(30px,3.6vw,54px)}
.yhead .big{margin-top:18px;max-width:12ch}
.yprog{grid-column:1/-1;height:3px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:6px}
.yprog i{display:block;height:100%;background:var(--oak);transform-origin:left;transform:scaleX(0)}

/* 9 · people say, and the frames on the wall */
.say{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.say blockquote{border-radius:var(--r);padding:clamp(22px,2.6vw,34px);font-size:clamp(19px,1.6vw,23px);line-height:1.38;letter-spacing:-.02em;display:flex;flex-direction:column;justify-content:space-between;gap:30px;min-height:300px}
.say blockquote:nth-child(1){background:var(--oak)}
.say blockquote:nth-child(2){background:var(--sage);color:#fff}
.say blockquote:nth-child(3){background:var(--soft)}
.say cite{font-style:normal;font-size:14px;font-weight:500}
.say cite span{font-weight:400;opacity:.8}
.fhead{text-align:center;margin-top:clamp(80px,9vw,140px)}
.fhead .mid{margin-top:16px}
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,190px));justify-content:center;gap:clamp(26px,4vw,64px);margin-top:clamp(36px,4vw,56px);align-items:start}
.fr{display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.fr .pic{width:100%;background:#fff;padding:10px;margin-bottom:8px;border-radius:6px;box-shadow:0 14px 34px rgba(31,27,25,.14);aspect-ratio:4/5;display:grid;place-items:center;transition:transform .6s var(--ease)}
.fr:nth-child(1) .pic{transform:rotate(-3deg)}.fr:nth-child(2) .pic{transform:rotate(2deg)}.fr:nth-child(3) .pic{transform:rotate(-1.5deg)}.fr:nth-child(4) .pic{transform:rotate(3deg)}
.fr:hover .pic{transform:none scale(1.03)}
.fr .pic img{max-width:100%;max-height:100%;object-fit:contain}
.fr .y{font-size:12.5px;font-weight:500;color:var(--acc);margin-top:8px}
.fr b{font-weight:500;font-size:14px;line-height:1.3}
.fr span{font-size:12.5px;color:var(--fg2);line-height:1.4}

/* 10 · contact */
.ct{background:var(--fg);color:#fff}
.ct .big{max-width:12ch}
.ct .big em.i{color:var(--oak)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:clamp(40px,5vw,70px)}
.tile{border-radius:var(--r);padding:clamp(20px,2.4vw,30px);background:rgba(255,255,255,.07);display:flex;flex-direction:column;gap:30px;justify-content:space-between;min-height:200px;transition:background .3s}
.tile:hover{background:rgba(255,255,255,.12)}
.tile .ic{width:26px;height:26px;color:var(--oak)}
.tile .ic.fill{fill:var(--oak)}
.tile b{display:block;font-weight:500;font-size:clamp(20px,1.7vw,26px);letter-spacing:-.03em;line-height:1.15}
.tile span{font-size:13.5px;color:rgba(255,255,255,.7)}
.tile .tels{display:flex;flex-direction:column;gap:2px;font-size:16px}
.cform{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,5vw,80px);margin-top:clamp(60px,7vw,100px);align-items:start}
.cform .mid{font-size:clamp(26px,2.4vw,36px)}
.cform .p{color:rgba(255,255,255,.72);margin-top:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 16px}
.field label{font-size:12px;color:rgba(255,255,255,.7)}
.field input,.field select,.field textarea{border:0;background:none;outline:none;color:#fff;font-size:16px;padding:4px 0;width:100%}
.field select option{color:var(--fg)}
.field textarea{min-height:80px;resize:vertical}
.field:focus-within{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px var(--oak)}
.field .msg{color:#F2A58E}
.full{grid-column:1/-1}
.sent{grid-column:1/-1;background:rgba(255,255,255,.1);padding:12px 16px;border-radius:14px;font-size:14px}
.map{position:relative;height:400px;border-radius:var(--r);overflow:hidden;background:#2a2421;margin-top:clamp(50px,6vw,90px)}
.map-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:rgba(255,255,255,.75);font-size:14px}
.map-ph a{border-bottom:1px solid}

/* footer */
footer{background:var(--fg);color:#fff;padding:0 0 0;overflow:hidden;--logo-a:#fff;--logo-b:#D9B98F}
.f-in{border-top:1px solid rgba(255,255,255,.12);padding-top:clamp(40px,5vw,70px)}
.f-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
footer .logo{width:150px}
footer p{font-size:14px;color:rgba(255,255,255,.65);max-width:30ch;margin-top:14px}
footer h5{font-size:13px;font-weight:500;color:var(--oak);margin-bottom:12px}
footer ul{list-style:none;display:grid;gap:7px;font-size:14px;color:rgba(255,255,255,.78)}
.social{display:flex;gap:8px;margin-top:20px}
.social a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
.social .ic{width:17px;height:17px}
.f-wm{color:#fff;margin-top:clamp(40px,6vw,80px)}
.f-bot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12.5px;color:rgba(255,255,255,.55);padding:16px 0 4px}

@media (max-width:1080px){
  .wall{grid-template-columns:repeat(4,1fr)}
  .nx,.yrs{grid-template-columns:1fr}.nx .l{position:relative;top:0}
  .ygrid{grid-template-columns:repeat(7,1fr)}.ygrid button{aspect-ratio:auto;padding:14px 0;font-size:16px}
  .yshow{min-height:440px}
  .frames{grid-template-columns:repeat(2,minmax(0,190px));row-gap:44px}
}
@media (max-width:900px){
  :root{--pad:clamp(70px,12vw,100px);--wrap:calc(100vw - 40px)}
  .nav-r .btn{display:none}
  .menu{grid-template-columns:1fr}.menu .mp{display:none}
  .hz-in{height:auto;padding:var(--pad) 0}
  .hz-track{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}
  .hz-track::-webkit-scrollbar{display:none}
  .hz-track>*{scroll-snap-align:center}
  .panel,.panel:nth-child(odd){width:82vw;height:auto;aspect-ratio:3/4}
  .hl,.euc,.cform{grid-template-columns:1fr}
  .euc .im{min-height:0;aspect-ratio:4/3}
  .say{grid-template-columns:1fr}.say blockquote{min-height:0}
  .tiles{grid-template-columns:1fr}
  .f-g{grid-template-columns:1fr 1fr}
  .card{height:auto;aspect-ratio:4/3}
}
@media (max-width:560px){
  :root{--hh:68px;--wrap:calc(100vw - 32px)}
  .nav .logo{width:118px}
  .hero h1{font-size:clamp(46px,13.6vw,64px)}
  .h-side{max-width:none}
  .wall{grid-template-columns:repeat(2,1fr);grid-auto-rows:110px}
  .ygrid{grid-template-columns:repeat(5,1fr)}
  .yshow{min-height:380px}
  .legend{grid-template-columns:1fr}
  .e0big{font-size:150px}
  form{grid-template-columns:1fr}
  .f-g{grid-template-columns:1fr}
  .frames{gap:36px 22px}
  .map{height:320px}
}
</style>
</head>
<body>
<header id="hdr"><div class="wrap nav">
  <a href="#top" aria-label="Shimlen home" id="hLogo"></a>
  <nav class="nav-links" id="navLinks"></nav>
  <div class="nav-r"><a href="#contact" class="btn btn-ink">Enquire</a><button class="mbtn" id="burger" aria-label="Menu" aria-expanded="false"><i><b></b><b></b></i>Menu</button></div>
</div></header>
<nav class="menu" id="menu" aria-label="Menu"></nav>
<main id="app"></main>
<footer id="foot"></footer>

<script>window.ROOT='../'</script>
<script src="../shared/data.js"></script>
<script src="../shared/brand.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/ScrollTrigger.min.js"></script>
<script src="../shared/vendor/lenis.min.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/motion.js"></script>
<script src="../shared/rx.js"></script>
<script>
const {ic,R}=Core, S=SH, P=S.products.list, Y=S.story.years, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NAV=[['Rooms','rooms','tvwall.jpg'],['Decors','decors','swatches.jpg'],['Products','products','plywood.jpg'],['Warehouse','warehouse','wh-aerial.jpg'],['Low formaldehyde','low-formaldehyde','mfp.jpg'],['What’s next','new-home','R:new-front-dusk.jpg'],['Our story','story','carpenter.jpg'],['Contact','contact','kitchen-dark.jpg']];
const nimg=f=>f.startsWith('R:')?RX.render(f.slice(2)):RX.stock(f);
$('#menu').innerHTML=`<div class="ml">${NAV.map(([t,id],i)=>`<a class="m" href="#${id}" data-i="${i}"><span>0${i+1}</span>${t}</a>`).join('')}
  <div class="mf"><a href="${S.contact.whatsapp}" target="_blank" rel="noopener">WhatsApp</a><a href="mailto:${S.contact.email}">${S.contact.email}</a><span>${S.contact.hours[0]}</span></div></div>
  <div class="mp" data-notag>${NAV.map(([,,f],i)=>`<img src="${nimg(f)}" alt="" loading="lazy" class="${i?'':'on'}">`).join('')}</div>`;
$('#hLogo').innerHTML=SHIMLEN_LOGO;
/* illustrative decor families: woodgrains are drawn with layered gradients, stones and solids are flat */
const grain=(a,b)=>`background:repeating-linear-gradient(92deg,${a} 0 7px,${b} 7px 9px,${a} 9px 19px,${b} 19px 20px),linear-gradient(90deg,${a},${b})`;
const DEC=[['Natural oak',grain('#CDA77B','#BF9668')],['Smoked walnut',grain('#5A4234','#4B372B')],['Linen white','background:#EFE9E1'],['Concrete','background:radial-gradient(circle at 30% 30%,#B3AEA7,#9C978F)'],
  ['Sage','background:#7F8A76'],['Midnight','background:#2B2725'],['Light ash',grain('#E3D3BC','#D6C3A8')],['Terrazzo','background:radial-gradient(circle at 20% 30%,#B9A99A 0 3px,transparent 4px),radial-gradient(circle at 70% 60%,#8E7F72 0 4px,transparent 5px),radial-gradient(circle at 40% 80%,#C9BBAE 0 2px,transparent 3px),#E7E0D7;background-size:38px 38px'],
  ['Teak',grain('#9A6B45','#8A5E3B')],['Clay','background:#B9826A'],['Marble','background:linear-gradient(125deg,transparent 40%,rgba(160,150,145,.45) 41%,transparent 44%),linear-gradient(160deg,transparent 60%,rgba(160,150,145,.35) 61%,transparent 63%),#F1EEEA'],['Graphite','background:#55514E']];

$('#app').innerHTML=`
<section class="hero" id="top">
  <div class="reel" id="rReel"></div><div class="shade"></div>
  <div class="h-c"><div class="wrap row">
    <div><span class="lab dk">Since 1980 · Semenyih, Selangor</span><h1 id="h1">Every room starts with a <em class="i">board.</em></h1></div>
    <div class="h-side"><p>${S.hero.lead}</p><div><a href="#rooms" class="btn btn-w">See the rooms ${ic('arrow')}</a></div></div>
  </div></div>
  <div class="ticker" aria-hidden="true"><div class="tt">${[0,1].map(()=>P.map((p,i)=>`<span>${i%3===1?`<em>${p.n}</em>`:p.n}</span>`).join('')).join('')}</div></div>
</section>

<section class="hz" id="rooms"><div class="hz-in"><div class="hz-track" id="hzTrack">
  <div class="hz-intro"><span class="lab dk">Where our boards end up</span><h2 class="big">Rooms <em class="i">first.</em></h2><p class="p">Before the specs and the stock numbers: this is what our materials turn into, in the hands of Malaysia’s furniture makers.</p><div class="hint"><i></i><span class="hd">Keep scrolling</span><span class="hm">Swipe through</span></div></div>
  ${RX.ROOMS.map((r,i)=>`<article class="panel"><img src="${RX.stock(r.f)}" alt="${r.room}" loading="lazy"><span class="n">0${i+1} / 0${RX.ROOMS.length}</span>
    <div class="tx"><h3>${r.room}</h3><p>${r.line}</p><div class="chips">${r.p.map(p=>`<button class="pill" data-p="${p}">${P[p].n}</button>`).join('')}</div></div></article>`).join('')}
  <div class="hz-end"><h3 class="mid" style="color:#fff">Your room <em class="i">next?</em></h3><a href="#contact" class="btn btn-oak">Tell us about it ${ic('arrow')}</a></div>
</div></div></section>

<section id="decors"><div class="wrap">
  <div class="whead"><div><span class="lab">Decors</span><h2 class="big">Pick a look. We’ll match the <em class="i">edge.</em></h2></div><p class="p">Woodgrains, stones and solids across MFC, HPL and lacquered panels, with an edgeband to match every one. Tap a few to see the families.</p></div>

    <div class="num"><b><span data-count="500">0</span>+</b><p>HPL decors in stock, 400+ MFC decors and 500+ edgeband colours to match them.</p></div>
    ${DEC.slice(0,4).map(([n,st])=>`<button class="sw" style="${st}" aria-label="${n}"><span>${n}</span></button>`).join('')}
    <figure class="ph" style="margin:0"><img src="${RX.stock('swatches.jpg')}" alt="Choosing between decor samples" loading="lazy"></figure>
    ${DEC.slice(4,8).map(([n,st])=>`<button class="sw" style="${st}" aria-label="${n}"><span>${n}</span></button>`).join('')}
    <figure class="ph2" style="margin:0"><img src="${RX.stock('samples.jpg')}" alt="Decor samples on a desk" loading="lazy" style="width:100%;height:100%;object-fit:cover"></figure>
    ${DEC.slice(8).map(([n,st])=>`<button class="sw" style="${st}" aria-label="${n}"><span>${n}</span></button>`).join('')}
  </div>
  <div class="wnote"><span>Colours above are illustrations of decor families, not exact product decors.</span><a href="#contact" style="border-bottom:1px solid">Ask for physical samples</a></div>
</div></section>

<section class="range" id="products">
  <div class="wrap rhead"><div><span class="lab">${S.products.eyebrow}</span><h2 class="big">${S.products.h2.replace('needs.','<em class="i">needs.</em>')}</h2></div>
    <div class="ctl"><button class="rnd-b" id="pPrev" aria-label="Previous">${ic('back')}</button><button class="rnd-b" id="pNext" aria-label="Next">${ic('arrow')}</button></div></div>
  <div class="rail prail" id="prail">${P.map((p,i)=>`<button class="pc" data-p="${i}"><div class="im"><img src="${RX.use(i)}" alt="${p.n} in use" loading="lazy"><span class="shot" data-notag><img src="${R}${p.img.replace('.jpg','-card.jpg')}" alt=""></span><span class="no">${ic('arrow')}</span></div>
    <div><h3>${p.n}</h3><div class="b">${p.b}</div></div></button>`).join('')}</div>
  <div class="wrap"><div class="ptrack"><i id="pbar"></i></div>
    <div class="brands" id="brands"><div class="mq" id="mq"><div class="mq-track"></div></div></div></div>
</section>

<section class="sc" id="warehouse"><div class="sc-st"><img src="${RX.stock('wh-aerial.jpg')}" alt="A large warehouse seen from the air" loading="lazy"><img class="im2" src="${RX.stock('fleet.jpg')}" alt="Forklifts lined up inside a large warehouse hall" loading="lazy">
  <div class="sc-c"><div class="lab dk">${S.warehouse.eyebrow}</div><div class="sc-n" id="scN">10,000<small>m²</small></div><p class="sq">${RX.SCALE.sqft} · ${RX.SCALE.pitch}</p><p>${S.warehouse.h2}</p>
    <div class="sc-pills">${S.warehouse.points.slice(1).map(([,t])=>`<span>${t}</span>`).join('')}</div></div></div></section>

<section id="low-formaldehyde"><div class="wrap">

    <div><div class="e0big" aria-hidden="true">E0</div><p>${S.lf.e0}</p></div>
    <div><span class="lab">${S.lf.eyebrow}</span><h2 class="mid">${S.lf.h2.replace('to all.','to <em class="i">all.</em>')}</h2><p class="p">${S.lf.lead}</p>
      <div class="yp" id="steps">${S.lf.steps.map(([y,p])=>`<div class="step"><b>${y}</b><p>${p}</p></div>`).join('')}</div>
      <div class="reccard"><img src="${R}${S.lf.record.img}" alt="Malaysia Book of Records certificate" data-lb="rec" data-cap="The Malaysia Book of Records, 2025"><div><b><span data-count="${S.lf.record.n}">0</span> ${S.lf.record.unit}</b><span>${S.lf.record.h}</span></div></div></div>
  </div>
  <div class="euc" id="eucalli"><div class="im"><img src="${RX.stock('mfp.jpg')}" alt="Wardrobe in melamine faced plywood" loading="lazy"></div>
    <div class="tx"><img class="lg" src="${R}img/b-eucalli.png" alt="eucalli E0"><h3 class="mid">${S.eucalli.h2}</h3><p class="p">${S.eucalli.lead}</p>
      <div class="bar" id="coreBar">${S.eucalli.core.split.map(([n])=>`<div><span data-pct="${n}">0</span>%</div>`).join('')}</div>
      <div class="legend">${S.eucalli.core.split.map(([,b,t])=>`<div><b>${b}</b>${t}</div>`).join('')}</div>

</div></section>

<section style="background:var(--soft)" id="new-home"><div class="wrap nx">
  <div class="l"><span class="lab">What comes next</span><h2 class="mid">${RX.HOME.h.replace('rising.','<em class="i">rising.</em>')}</h2><p class="p">${RX.HOME.p}</p></div>
  <div class="stack">${[['new-front-dusk.jpg','The front, at dusk'],['new-corner-tropical.jpg','From the car park'],['new-front-mist.jpg','Morning mist'],['new-night.jpg','Lit at night']].map(([f,c])=>`<figure class="card" style="margin-top:0"><img src="${RX.render(f)}" alt="${c} (artist's impression)" loading="lazy"><figcaption>${c}</figcaption></figure>`).join('')}</div>
</div></section>

<section id="story"><div class="wrap">
  <div class="yhead"><span class="lab">${S.story.eyebrow}</span><h2 class="big">45 years in <em class="i">fourteen</em> frames.</h2></div>
  <div class="yrs">
    <div class="yshow" id="yshow"><div class="yi" id="yi"><img alt=""></div><div><div class="yy" id="yy"></div><h3 id="yh"></h3><p id="yp"></p></div></div>
    <div class="ygrid" id="ygrid">${Y.map(([y],i)=>`<button data-y="${i}">${y}</button>`).join('')}<div class="yprog"><i id="yprog"></i></div></div>

  <div class="frames">${S.certs.list.map(c=>`<button class="fr" data-lb="certs" data-src="${R}${c.src}" data-cap="${c.h} · ${c.yr}"><div class="pic"><img src="${R}${c.src}" alt="${c.h}" loading="lazy"></div><div class="y">${c.yr}</div><b>${c.h}</b><span>${c.p}</span></button>`).join('')}</div>

<section class="ct" id="contact"><div class="wrap">

    <a class="tile" href="${S.contact.directions}" target="_blank" rel="noopener">${ic('i-pin')}<div><b>Visit the warehouse</b><span>${S.contact.address.join(' ')}</span></div></a>

  <div class="cform"><div><h3 class="mid">${S.contact.h2}</h3><p class="p">Or email ${Core.mail()}. We reply within one working day.</p></div>
    <form id="form" novalidate>${RX.form()}<div class="full"><button class="btn btn-oak" type="submit">Send enquiry ${ic('arrow')}</button></div><div class="sent" id="sent">${S.contact.sent}</div></form></div>
  <div class="map">${RX.map()}</div>
</div></section>`;

$('#foot').innerHTML=`<div class="wrap"><div class="f-in">
  <div class="f-g">
    <div>${SHIMLEN_LOGO}<p>${S.footer.blurb}</p><div class="social"><a href="#" aria-label="Facebook">${ic('fb','fill')}</a><a href="#" aria-label="Instagram">${ic('ig','fill')}</a><a href="#" aria-label="Xiaohongshu">${ic('xhs','fill')}</a></div></div>
    <div><h5>Explore</h5><ul>${NAV.slice(0,5).map(([t,id])=>`<li><a href="#${id}">${t}</a></li>`).join('')}</ul></div>
    <div><h5>Products</h5><ul>${P.slice(0,5).map((p,i)=>`<li><a href="#products" data-open="${i}">${p.n}</a></li>`).join('')}</ul></div>
    <div><h5>Visit</h5><ul><li>Lot 30482, Jalan P4/8C</li><li>Bandar Teknologi Kajang</li><li>43500 Semenyih, Selangor</li><li style="margin-top:8px">${Core.mail()}</li></ul></div>
  </div>
  <div class="f-wm">${SHIMLEN_WORDMARK}</div>
  <div class="f-bot"><span>${S.footer.legal}</span><span>${S.footer.links}</span></div>
  <p class="rx-note">${RX.note}</p>
</div></div>`;

RX.reel('rReel','blinds',['new-front-dusk.jpg','new-corner-tropical.jpg','new-front-mist.jpg','new-night.jpg']);
RX.tag();
Core.init();
Core.rail($('#prail'),$('#pPrev'),$('#pNext'));
$('#prail').addEventListener('railmove',e=>$('#pbar').style.transform=`scaleX(${.1+.9*e.detail})`);

/* menu pictures follow the hovered link */
$$('.menu a.m').forEach(a=>a.addEventListener('pointerenter',()=>$$('.menu .mp img').forEach((im,i)=>im.classList.toggle('on',i===+a.dataset.i))));
/* decor chips stay picked */
$$('.sw').forEach(b=>b.onclick=()=>b.classList.toggle('on'));

/* 45 years: plays through on its own until you pick a year */
(function(){const yi=$('#yi'),im=yi.querySelector('img'),bs=$$('#ygrid button');let k=0,T=null,auto=true;
  const show=i=>{k=i;const [y,h,p,img,kind]=Y[i];bs.forEach((b,j)=>b.classList.toggle('on',j===i));
    $('#yy').textContent=y;$('#yh').textContent=h;$('#yp').textContent=p;
    yi.classList.toggle('fit',kind==='logo'||kind==='doc');im.src=R+(img.indexOf('site-aerial')>-1?'img/renders/new-corner.jpg':img);
    im.style.filter=kind==='archive'?'sepia(.4)':'';$('#yprog').style.transform=`scaleX(${(i+1)/Y.length})`;
    if(window.gsap&&Motion.ok)gsap.fromTo(['#yy','#yh','#yp'],{y:24,opacity:0},{y:0,opacity:1,duration:.7,stagger:.06,ease:'expo.out'})};
  bs.forEach((b,i)=>b.onclick=()=>{auto=false;clearInterval(T);show(i)});
  show(0);
  new IntersectionObserver(([e])=>{clearInterval(T);if(e.isIntersecting&&auto&&!Core.reduceMotion)T=setInterval(()=>show((k+1)%Y.length),2600)},{threshold:.4}).observe($('#yshow'))})();

/* ---- motion: Quiet, made younger. Quick, bold, lots of movement driven by the scroll ---- */
$$('.panel,.pc').forEach(e=>e.dataset.cursor='View');$$('.fr,.reccard img,.euc .proof button').forEach(e=>e.dataset.cursor='Zoom');$('#prail').dataset.cursor='Drag';
$$('.hero,.hz,.sc,.ct,footer,.menu').forEach(e=>e.setAttribute('data-cur-dark',''));
/* hero words split for the entrance */
(function(){const h=$('#h1');h.innerHTML=h.innerHTML.replace(/(<em[^>]*>)(.*?)(<\/em>)/,(m,a,b,c)=>`§${b}§`).split(/\s+/).map(w=>w.startsWith('§')?`<span class="w"><span><em class="i">${w.replace(/§/g,'')}</em></span></span>`:`<span class="w"><span>${w}</span></span>`).join(' ')})();
if(Motion.ok){gsap.set('#h1 .w>span',{yPercent:110});gsap.set('.hero .lab,.h-side>*',{opacity:0,y:20});gsap.set('.ticker',{yPercent:100});gsap.set('#rReel',{scale:1.18})}
RX.loader('stack',{preload:['img/renders/new-front-dusk.jpg'],min:2000,done(){if(!Motion.ok)return;
  gsap.to('#rReel',{scale:1,duration:2,ease:'expo.out'});
  gsap.to('#h1 .w>span',{yPercent:0,duration:1.1,ease:'expo.out',stagger:.07,delay:.15});
  gsap.to('.hero .lab,.h-side>*',{opacity:1,y:0,duration:.9,ease:'expo.out',stagger:.08,delay:.5});
  gsap.to('.ticker',{yPercent:0,duration:1,ease:'expo.out',delay:.7})}});
Motion.init({intro:'none'});
if(Motion.ok){
  /* hero: the picture sinks, the words lift away */
  Motion.scrub($('#rReel'),{yPercent:0},{yPercent:14},{trigger:'.hero',start:'top top',end:'bottom top'});
  Motion.scrub($('.h-c'),{y:0,opacity:1},{y:-120,opacity:0},{trigger:'.hero',start:'top top',end:'60% top'});
  /* rooms: the track slides sideways while the section is pinned (wide screens) */
  const hz=$('.hz'),tr=$('#hzTrack');
  ScrollTrigger.matchMedia({'(min-width:901px)':()=>{
    const dist=()=>tr.scrollWidth-innerWidth;
    const tw=gsap.to(tr,{x:()=>-dist(),ease:'none',scrollTrigger:{trigger:hz,start:'top top',end:()=>'+='+dist(),pin:true,scrub:.8,invalidateOnRefresh:true,anticipatePin:1}});
    $$('.panel>img').forEach(im=>gsap.fromTo(im,{scale:1.25,xPercent:-6},{scale:1.05,xPercent:6,ease:'none',scrollTrigger:{trigger:im.parentElement,containerAnimation:tw,start:'left right',end:'right left',scrub:true}}));
    return ()=>{}},
    '(max-width:900px)':()=>{hz.classList.add('native')}});
  /* scale: the number lands from huge */
  gsap.fromTo('#scN',{scale:2.6,opacity:.15},{scale:1,opacity:1,ease:'none',scrollTrigger:{trigger:'.sc',start:'top top',end:'45% top',scrub:true}});
  gsap.fromTo('.sc-st>img',{scale:1.25},{scale:1,ease:'none',scrollTrigger:{trigger:'.sc',start:'top bottom',end:'bottom bottom',scrub:true}});
  gsap.fromTo('.sc-st>img.im2',{opacity:0},{opacity:1,ease:'none',scrollTrigger:{trigger:'.sc',start:'45% top',end:'75% top',scrub:true}});
  gsap.fromTo('.sc-c p,.sc-pills,.sc-c .lab',{opacity:0,y:30},{opacity:1,y:0,ease:'none',stagger:.1,scrollTrigger:{trigger:'.sc',start:'30% top',end:'55% top',scrub:true}});
  /* the E0 drifts */
  Motion.scrub($('.e0big'),{xPercent:0},{xPercent:innerWidth>900?10:4},{trigger:'.hl'});
  /* the new-building cards shrink back as the next one lands on them */
  const cards=$$('.card');cards.forEach((c,i)=>{if(i<cards.length-1)gsap.to(c,{scale:.9,opacity:.55,ease:'none',scrollTrigger:{trigger:cards[i+1],start:'top bottom',end:'top '+(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh'))+30)+'px',scrub:true}})});
}
Motion.cascade('.whead>*,.wall>*,.pc,.yp .step,.reccard,.euc .tx>*,.nx .l>*,.yhead>*,.ygrid button,.say blockquote,.fr,.tile,.cform>div>*,.field,.rhead>*');
Motion.masks('.yshow,.map');
Motion.wordRise('.f-wm');
</script>
</body>
</html>
