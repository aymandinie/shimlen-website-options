<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shimlen · Chronicle · Revamp 2</title>
<meta name="description" content="Since 1980: the boards behind Malaysia's custom-made furniture. Plywood, MFC, HPL, edgeband, acoustic and lacquered panels from Semenyih, Selangor.">
<link rel="icon" href="../img/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/motion.css">
<link rel="stylesheet" href="../shared/rx.css">
<style>
/* Revamp 2 · Heartwood — the company told as a book in five chapters. Walnut and cream, serif type, arches.
   Roots → Range → Health → Scale → Next, each chapter opened by its numeral, with the years it covers. */
:root{--bg:#231D1B;--fg:#F1EAE3;--fg2:rgba(241,234,227,.76);--mut:rgba(241,234,227,.56);--line:rgba(241,234,227,.14);--acc:#C4B0A5;
  --cream:#EFE7DF;--ink:#231F20;--wal:#2E2624;--wal2:#3A302D;--r:10px;--hh:76px;--pad:clamp(84px,9vw,150px);
  --drawer-bg:#EFE7DF;--drawer-fg:#231F20;--drawer-line:#D9CCC3;--rxl-bg:#231D1B;--rxl-fg:#F1EAE3;--rxl-acc:#C4B0A5;--pre-bg:#231D1B;--pre-fg:#EFE7DF;--cur:#fff;--cur-fg:#231F20}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.serif{font-family:"Fraunces",Georgia,serif;font-weight:300;letter-spacing:-.015em;line-height:1.04;font-variation-settings:"opsz" 120}
.label{font-family:Saira,sans-serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:10px}
.label::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.h2{font-size:clamp(36px,4.4vw,64px)}
.lead{font-size:17px;color:var(--fg2);max-width:50ch}
section{position:relative;padding:var(--pad) 0}
.cream{background:var(--cream);color:var(--ink);--fg2:#51494A;--mut:#6B6262;--line:rgba(35,31,32,.14);--acc:#867774}
.wal{background:var(--wal)}
.tel{border-bottom:1px solid currentColor;white-space:nowrap}
.arch{border-radius:999px 999px var(--r) var(--r);overflow:hidden;position:relative}
.btn{display:inline-flex;align-items:center;gap:14px;font-size:15px}
.btn .ring{width:46px;height:46px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;transition:background .35s,color .35s,transform .35s var(--ease)}
.btn .ring .ic{width:17px;height:17px}
.btn:hover .ring{background:var(--fg);color:var(--bg);transform:rotate(-45deg)}
.cream .btn:hover .ring{background:var(--ink);color:var(--cream)}
.btn-solid{background:var(--cream);color:var(--ink);padding:13px 22px;border-radius:999px}
.btn-solid:hover{background:var(--acc)}
.cream .btn-solid{background:var(--ink);color:#fff}

/* header: chapters either side, the SHIMLEN wordmark shrinks into the middle; it never hides */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;transition:background .4s,border-color .4s;border-bottom:1px solid transparent;color:var(--fg)}
#hdr.hide{transform:none}
#hdr.solid{background:rgba(35,29,27,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-color:var(--line)}
.nav{height:100%;display:grid;grid-template-columns:1fr 180px 1fr;align-items:center;gap:20px}
.nav-l,.nav-r{display:flex;gap:2px;font-size:14px}
.nav-r{justify-content:flex-end}
.nav-l a,.nav-r a{padding:8px 13px;border-radius:99px;transition:background .3s;color:var(--fg2)}
.nav-l a i,.nav-r a i{font-family:Fraunces,serif;font-style:italic;font-size:13px;color:var(--acc);margin-right:6px}
.nav-l a:hover,.nav-r a:hover,.nav a.active{background:rgba(241,234,227,.1);color:var(--fg)}
.burger{display:none;justify-self:end;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);place-items:center}
.burger span{display:block;width:18px;height:1.5px;background:currentColor;margin:3px auto;transition:transform .3s}
#wm{position:fixed;left:50%;top:0;z-index:61;color:var(--cream);transform-origin:50% 0;will-change:transform,width;pointer-events:none}
#wm a{pointer-events:auto;display:block}
.menu{position:fixed;inset:0;background:var(--bg);z-index:55;padding:calc(var(--hh) + 30px) 24px 40px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.menu a{font-family:Fraunces,serif;font-weight:300;font-size:32px;padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline}
.menu a i{font-size:16px;color:var(--acc);min-width:2.2em}
body.menu-open .menu{opacity:1;visibility:visible}
body.menu-open #hdr{background:var(--bg)}
body.menu-open .burger span:nth-child(1){transform:translateY(4.5px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){transform:translateY(-4.5px) rotate(-45deg)}

/* the running chapter, fixed at the left edge on wide screens */
.runner{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:40;display:none;flex-direction:column;align-items:center;gap:14px;pointer-events:none;opacity:0;transition:opacity .5s}
.runner.on{opacity:1}
.runner .n{font-family:Fraunces,serif;font-size:22px;font-style:italic;color:var(--acc)}
.runner .t{writing-mode:vertical-rl;transform:rotate(180deg);font-family:Saira;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg2)}
.runner .p{width:1px;height:80px;background:var(--line);position:relative;overflow:hidden}
.runner .p b{position:absolute;inset:0;background:var(--acc);transform-origin:top;transform:scaleY(var(--p,0))}
.runner.lt .t{color:#51494A}.runner.lt .p{background:rgba(35,31,32,.14)}.runner.lt .n{color:#867774}.runner.lt .p b{background:#867774}
@media (min-width:1400px){.runner{display:flex}}

/* hero: tree rings draw in, the wordmark shrinks into the navbar, the arch opens onto the new building at night */
.hero{height:250vh;padding:0}
.h-stick{position:sticky;top:0;height:100svh;overflow:hidden}
.h-arch{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:var(--aw,64vw);height:var(--ah,60vh);border-radius:var(--ar,32vw 32vw 0 0);overflow:hidden;z-index:2}
.h-arch .reel{position:absolute;inset:0}
.h-arch .shade{position:absolute;inset:0;z-index:3;background:linear-gradient(0deg,rgba(28,22,20,.94),rgba(28,22,20,.72) 32%,rgba(28,22,20,.08) 68%),linear-gradient(90deg,rgba(28,22,20,.45),rgba(28,22,20,0) 60%);opacity:var(--sh,0);pointer-events:none}
.h-arch .rnd::after{top:auto;bottom:12px;right:16px;left:auto;transform:none}
.rings{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:120vw;height:auto;z-index:1;pointer-events:none;opacity:var(--ro,1)}
.rings path{fill:none;stroke:rgba(196,176,165,.28);stroke-width:1;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.6s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
html.is-loading .rings path{animation-play-state:paused}
.h-intro{position:absolute;left:0;right:0;top:var(--it,40vh);z-index:3;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--fg2);opacity:var(--io,1)}
.h-intro b{font-weight:400;color:var(--fg)}
.scroll-cue{display:flex;gap:10px;align-items:center}
.scroll-cue i{width:1px;height:30px;background:var(--line);position:relative;overflow:hidden}
.scroll-cue i::after{content:"";position:absolute;left:0;top:-30px;width:1px;height:30px;background:var(--fg);animation:cue 2s var(--ease) infinite}
@keyframes cue{to{top:30px}}
.h-copy{position:absolute;left:0;right:0;bottom:clamp(40px,7vh,80px);z-index:4;pointer-events:var(--pe,none)}
.h-copy .mk{overflow:hidden;padding:.06em 0 .16em;margin:-.06em 0 -.16em}
.h-copy .mk>*{transform:translate3d(0,calc((1 - var(--m,0))*112%),0)}
.h-copy .mk+.mk{margin-top:calc(22px - .22em)}
.h-copy .row{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end}
.h-copy h1{font-size:clamp(40px,5.2vw,82px);max-width:14ch;color:#fff}
.h-copy h1 em{font-style:italic;color:var(--acc)}
.h-copy .lead{color:rgba(255,255,255,.88);margin-bottom:22px}
.h-copy .btns{display:flex;gap:26px;flex-wrap:wrap;color:#fff}
.cbar{border-bottom:1px solid var(--line)}
.cbar .contents{margin-top:0;border-top:0}
.contents{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);margin-top:clamp(40px,5vw,70px)}
.contents a{padding:20px 18px 26px 0;display:flex;flex-direction:column;gap:4px;transition:color .3s}
.contents a+a{padding-left:18px;border-left:1px solid var(--line)}
.contents i{font-family:Fraunces,serif;font-size:15px;color:var(--acc)}
.contents b{font-family:Fraunces,serif;font-weight:300;font-size:22px}
.contents span{font-size:13px;color:var(--mut)}
.contents a:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* chapter openers */
.op{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,3vw,48px);align-items:end;padding-bottom:clamp(26px,3vw,40px);border-bottom:1px solid var(--line);margin-bottom:clamp(48px,6vw,96px)}
.op .n{font-family:Fraunces,serif;font-weight:300;font-size:clamp(110px,15vw,230px);line-height:.74;color:transparent;-webkit-text-stroke:1px var(--acc);letter-spacing:-.02em}
.op .label{margin-bottom:14px}
.op h2{font-size:clamp(44px,6vw,96px)}
.op h2 em{font-style:italic}
.chron{list-style:none;border-top:1px solid var(--line)}
.chron li{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.chron .y{font-family:Fraunces,serif;font-size:22px;color:var(--acc);line-height:1.1}
.chron b{display:block;font-weight:500;font-size:15px}
.chron p{font-size:14px;color:var(--fg2)}

/* I · roots */
.roots{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,6vw,110px);align-items:start}
.roots .pic{aspect-ratio:3/4}
.roots .pic img{width:100%;height:100%;object-fit:cover;filter:sepia(.35) saturate(.75) contrast(1.02)}
.rfig{position:relative;margin:0}
.print{position:absolute;right:-26px;bottom:44px;z-index:3;background:#F6F0EA;padding:8px 8px 10px;transform:rotate(3deg);box-shadow:0 18px 40px rgba(0,0,0,.4);width:172px}
.print img{width:100%;aspect-ratio:163/97;object-fit:cover;filter:sepia(.4) saturate(.8)}
.print span{display:block;font-family:Fraunces,serif;font-style:italic;font-size:12.5px;color:#51494A;margin-top:6px;text-align:center}
@media (max-width:900px){.print{right:-6px}}
.roots figcaption{font-size:13px;color:var(--mut);margin-top:14px;font-style:italic;font-family:Fraunces,serif}
.roots .big{font-family:Fraunces,serif;font-weight:300;font-size:clamp(28px,2.8vw,42px);line-height:1.2;letter-spacing:-.01em;margin-bottom:26px}
.roots .lead{margin-bottom:36px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.pillars div{display:flex;align-items:center;gap:12px;font-family:Fraunces,serif;font-size:18px}
.pillars i{width:46px;height:46px;border-radius:999px 999px 6px 6px;background:var(--wal2);display:grid;place-items:center;flex:none}
.pillars img{width:22px;height:22px;object-fit:contain}

/* II · range: a list of names; the picture follows the pointer */
.rtop{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,5vw,90px);align-items:start;margin-bottom:clamp(44px,5vw,80px)}
.rtop .lead{margin-top:16px}
.range{display:grid;grid-template-columns:8fr 4fr;gap:clamp(30px,4vw,70px);align-items:start}
.rpv{position:sticky;top:calc(var(--hh) + 30px)}
.rpic{aspect-ratio:3/4;background:var(--wal2)}
.rpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .6s,transform 1.2s var(--ease)}
.rpic img.on{opacity:1;transform:none}
.rcap{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:16px;align-items:baseline}
.rcap i{font-family:Fraunces,serif;font-size:15px;color:var(--acc);grid-row:span 2}
.rcap b{font-family:Fraunces,serif;font-weight:300;font-size:22px;line-height:1.15}
.rcap span{font-size:13px;color:var(--mut)}
.pidx{list-style:none;border-top:1px solid var(--line)}
.pidx button{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:18px;align-items:center;text-align:left;padding:22px 4px;border-bottom:1px solid var(--line);transition:padding .5s var(--ease),color .3s}
.pidx .no{font-family:Fraunces,serif;font-style:italic;font-size:15px;color:var(--acc)}
.pidx .nm{font-family:Fraunces,serif;font-weight:300;font-size:clamp(26px,2.7vw,42px);line-height:1.05;letter-spacing:-.015em}
.pidx .br{display:block;font-family:"Helvetica Neue",sans-serif;font-size:13px;color:var(--mut);letter-spacing:0;margin-top:6px}
.pidx .ring{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .35s,color .35s,transform .35s var(--ease)}
.pidx .th{display:none}
.pidx button:hover,.pidx button.on{padding-left:16px}
.pidx button.on .nm{color:var(--fg)}
.pidx button:hover .ring{background:var(--fg);color:var(--bg);transform:rotate(-45deg);border-color:var(--fg)}
.logos{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-top:clamp(48px,5vw,80px)}
.logos div{background:var(--cream);border-radius:var(--r);height:84px;display:grid;place-items:center;padding:12px}
.logos img{max-height:38px;max-width:100%;width:auto;object-fit:contain}
.logos img.sm{max-height:28px}

/* III · health (cream) */
.arches{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,28px)}
.ah{border:1px solid var(--line);border-radius:999px 999px var(--r) var(--r);padding:clamp(70px,8vw,120px) clamp(20px,2.4vw,34px) 34px;text-align:center;background:#F6F0EA}
.ah .y{font-family:Fraunces,serif;font-weight:300;font-size:clamp(46px,5vw,76px);line-height:1}
.ah .k{font-family:Saira;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin:14px 0 12px}
.ah p{font-size:15px;color:var(--fg2);max-width:28ch;margin:0 auto}
.lfh{display:grid;grid-template-columns:7fr 5fr;gap:clamp(30px,5vw,90px);align-items:end;margin-bottom:clamp(40px,5vw,70px)}
.lf-note{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:28px;font-size:14.5px;color:var(--fg2);text-align:center}
.lf-note img{width:48px;border-radius:8px;background:#fff;padding:4px}
.euc{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,6vw,110px);align-items:center;margin-top:clamp(80px,9vw,150px)}
.euc .pic{aspect-ratio:3/4}
.euc .pic>img{width:100%;height:100%;object-fit:cover}
.euc .lay{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:46%;background:rgba(255,255,255,.95);border-radius:var(--r);padding:8px;z-index:3;cursor:zoom-in}
.euc-logo{height:38px;width:auto;margin-bottom:20px}
.euc .h2{font-size:clamp(32px,3.4vw,50px);margin:12px 0 16px}
.bar{display:flex;height:50px;border-radius:999px;overflow:hidden;font-family:Fraunces,serif;font-size:18px;color:#fff;background:#E2D7CD;margin-top:26px}
.bar>div{display:flex;align-items:center;padding-left:18px;width:0;transition:width 1.1s var(--ease)}
.bar>div:first-child{background:var(--ink)}.bar>div:last-child{background:#867774}
.bar.in>div:first-child{width:60%}.bar.in>div:last-child{width:40%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;font-size:13.5px;color:var(--fg2)}
.legend b{display:block;color:var(--ink);font-weight:500}
.feats{list-style:none;counter-reset:f;margin-top:26px;border-top:1px solid var(--line)}
.feats li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--fg2)}
.feats li::before{counter-increment:f;content:counter(f,lower-roman);font-family:Fraunces,serif;font-style:italic;color:var(--acc)}
.feats b{color:var(--ink);font-weight:500}
.proof{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
.proof button{width:60px;aspect-ratio:3/4;border-radius:999px 999px 4px 4px;overflow:hidden;background:#fff;transition:transform .3s}
.proof button:hover{transform:translateY(-3px)}
.proof img{width:100%;height:100%;object-fit:cover}
.proof small{flex:1;min-width:160px;font-size:13px;color:var(--mut)}

/* IV · scale: Shimlen's own warehouse, in its own photographs */
.grand{position:relative;width:100vw;margin-left:calc(50% - 50vw);height:clamp(560px,100svh,1000px);overflow:hidden;margin-bottom:clamp(18px,2vw,30px);background:#1c1614}
.grand>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;will-change:transform}
.grand::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(28,22,20,.94),rgba(28,22,20,.62) 42%,rgba(28,22,20,.14) 74%,rgba(28,22,20,.4));pointer-events:none}
.g-copy{position:absolute;left:0;right:0;bottom:clamp(30px,5vw,72px);z-index:2;color:#fff}
.g-copy .label{color:#E2D3C8}
.g-n{font-family:Fraunces,serif;font-weight:300;font-size:clamp(96px,19vw,320px);line-height:.82;letter-spacing:-.045em;margin:20px 0 14px;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.g-n small{font-size:.24em;font-style:italic;letter-spacing:0;color:#E2D3C8;margin-left:.1em}
.g-copy p{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:clamp(19px,2vw,30px);max-width:34ch;line-height:1.25;color:rgba(255,255,255,.92)}
.g-row{display:grid;grid-template-columns:6fr 3fr 3fr;gap:clamp(14px,2vw,28px);align-items:end;margin-bottom:clamp(90px,10vw,160px)}
.g-row figure{margin:0}
.g-row .im{height:clamp(240px,26vw,420px);border-radius:var(--r);overflow:hidden}
.g-row .arch{height:clamp(300px,32vw,520px)}
.g-row img{width:100%;height:100%;object-fit:cover}
.g-row figcaption{font-size:13.5px;color:var(--mut);margin-top:12px;line-height:1.45;max-width:40ch}
.g-row figcaption b{display:block;font-family:Fraunces,serif;font-weight:400;font-style:italic;font-size:18px;color:var(--fg);margin-bottom:2px}
.g-facts{margin:0;border-top:1px solid var(--line)}
.g-facts div{padding:16px 0;border-bottom:1px solid var(--line)}
.g-facts dt{font-family:Fraunces,serif;font-weight:300;font-size:clamp(26px,2.4vw,38px);line-height:1;letter-spacing:-.02em}
.g-facts dd{font-size:13px;color:var(--mut);margin:6px 0 0}
@media (max-width:900px){.g-row{grid-template-columns:1fr 1fr}.g-row figure:first-child{grid-column:1/-1}.g-facts{grid-column:1/-1}.g-facts{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}}
@media (max-width:560px){.g-n{font-size:clamp(64px,21vw,96px)}.g-row{grid-template-columns:1fr}.g-row .arch{height:380px}.g-facts{grid-template-columns:1fr 1fr}}

/* IV · scale and record */
.record{text-align:center;padding-bottom:clamp(60px,7vw,110px)}
.record .big{font-family:Fraunces,serif;font-weight:300;font-size:clamp(90px,17vw,260px);line-height:.85;letter-spacing:-.04em}
.record .u{font-family:Fraunces,serif;font-style:italic;font-size:clamp(22px,2.4vw,34px);color:var(--acc);margin-top:14px}
.record p{max-width:46ch;margin:18px auto 0;color:var(--fg2)}
.record .crt{display:inline-flex;align-items:center;gap:12px;margin-top:26px;font-size:14px;color:var(--fg2)}
.record .crt img{width:52px;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.record .crt:hover span{color:var(--fg);text-decoration:underline}
.wh{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,5vw,90px);align-items:end}
.wh .h2{margin:14px 0 16px}
.wh .sq{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:clamp(20px,1.8vw,26px);line-height:1.3;color:var(--acc);margin-bottom:14px;max-width:26ch}
.wh ul{list-style:none;margin-top:26px;border-top:1px solid var(--line)}
.wh li{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.wh li .ic{color:var(--acc);width:22px;height:22px}
.trip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end}
.trip figure{margin:0}
.trip .arch{height:clamp(260px,30vw,460px)}
.trip figure:nth-child(2) .arch{height:clamp(320px,38vw,560px)}
.trip img{width:100%;height:100%;object-fit:cover;filter:saturate(.7) sepia(.12)}
.trip figcaption{font-family:Fraunces,serif;font-style:italic;font-size:14px;color:var(--mut);margin-top:10px;text-align:center}
.recog{display:grid;grid-template-columns:4fr 8fr;gap:clamp(30px,5vw,80px);align-items:center;margin-top:clamp(80px,9vw,140px)}
.wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,2vw,30px);max-width:760px;justify-self:end;width:100%}
.frm{display:flex;flex-direction:column;gap:6px;text-align:center}
.frm .mat{background:var(--cream);padding:12px;border-radius:2px;box-shadow:0 0 0 6px var(--wal2),0 0 0 7px rgba(196,176,165,.35);margin-bottom:8px;aspect-ratio:4/5;display:grid;place-items:center;transition:transform .5s var(--ease)}
.frm:hover .mat{transform:translateY(-4px)}
.frm .mat img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.frm .yr{font-family:Fraunces,serif;font-style:italic;font-size:14px;color:var(--acc)}
.frm b{font-weight:500;font-size:13.5px;line-height:1.3}
.frm span{font-size:12px;color:var(--mut);line-height:1.4}

/* V · next */
.nx{padding-bottom:0}
.nx-pic{position:relative;margin:0 auto;height:clamp(460px,86svh,860px);overflow:hidden;border-radius:999px 999px 0 0;width:min(820px,100%)}
.nx-pic .reel{position:absolute;inset:0}
.nx-copy{display:grid;grid-template-columns:7fr 5fr;gap:clamp(30px,5vw,90px);align-items:end;margin-top:clamp(40px,5vw,70px)}
.nx-copy .h2{margin-top:14px}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:clamp(40px,5vw,70px)}
.views figure{margin:0}
.views .im{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;position:relative}
.views img{width:100%;height:100%;object-fit:cover}
.views figcaption{font-family:Fraunces,serif;font-style:italic;font-size:14px;color:var(--mut);margin-top:10px}

/* epilogue */
.epi-q{text-align:center;max-width:1000px;margin:0 auto}
.q blockquote{font-family:Fraunces,serif;font-weight:300;font-size:clamp(28px,3.2vw,48px);line-height:1.2;letter-spacing:-.01em}
.q cite{display:block;font-style:normal;margin-top:20px;font-size:14px;color:var(--mut)}
.q-dots{display:flex;gap:8px;justify-content:center;margin-top:24px}
.q-dots button{width:8px;height:8px;border-radius:50%;background:rgba(35,31,32,.2)}
.q-dots button.on{background:var(--ink)}
.ct{display:grid;grid-template-columns:5fr 7fr;gap:clamp(30px,5vw,90px);margin-top:clamp(80px,9vw,140px);padding-top:clamp(40px,5vw,70px);border-top:1px solid var(--line)}
.ct .h2{margin:14px 0 26px}
.ct dl{display:grid;gap:18px;font-size:15px}
.ct dt{font-family:Saira;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.ct .tels{display:flex;flex-wrap:wrap;gap:4px 14px}
.links{display:flex;gap:16px;margin-top:6px;font-size:14px}
.links a{border-bottom:1px solid currentColor}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;align-content:start}
.field label{font-size:12.5px;color:var(--mut)}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid rgba(35,31,32,.25);background:none;padding:9px 0;border-radius:0;outline:none;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:76px;resize:vertical}
.full{grid-column:1/-1}
.sent{grid-column:1/-1;background:#E2D7CD;padding:12px 14px;border-radius:var(--r);font-size:14px}
.map{position:relative;height:380px;border-radius:var(--r);overflow:hidden;background:#E2D7CD;margin-top:clamp(40px,5vw,70px)}
.map-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;color:#51494A;font-size:14px}
.map-ph a{border-bottom:1px solid}

/* footer */
footer{background:var(--wal);padding:clamp(60px,7vw,100px) 0 0;overflow:hidden;--logo-a:#F1EAE3;--logo-b:#C4B0A5}
.f-top{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:30px}
.f-top .logo{width:160px}
.f-top p{font-family:Fraunces,serif;font-weight:300;font-size:22px;line-height:1.3;margin-top:20px;max-width:22ch}
footer h5{font-family:Saira;font-weight:400;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
footer ul{list-style:none;display:grid;gap:8px;font-size:14px;color:var(--fg2)}
footer ul a:hover{color:var(--fg)}
.social{display:flex;gap:10px;margin-top:22px}
.social a{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.social .ic{width:17px;height:17px}
.f-wm{color:var(--fg);opacity:.92;margin-top:clamp(44px,6vw,80px)}
.f-bot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mut);padding:22px 0 6px;border-top:1px solid var(--line);margin-top:18px}

@media (max-width:1180px){.nav-l a,.nav-r a{padding:8px 8px;font-size:13px}}
@media (max-width:1080px){.nav-l,.nav-r{display:none}.nav{grid-template-columns:44px 1fr 44px}.burger{display:grid;grid-column:3}}
@media (max-width:1000px){.logos{grid-template-columns:repeat(4,1fr)}.recog{grid-template-columns:1fr}.wall{justify-self:start}}
@media (max-width:900px){
  :root{--pad:clamp(70px,11vw,100px)}
  .nav-r .btn-solid{display:none}
  .roots,.range,.euc,.wh,.nx-copy,.ct,.lfh{grid-template-columns:1fr}
  .contents{grid-template-columns:1fr 1fr}
  .contents a:nth-child(odd){padding-left:0;border-left:0}
  .contents a:nth-child(n+3){border-top:1px solid var(--line)}
  .contents a:last-child{grid-column:1/-1}
  .rtop{grid-template-columns:1fr}
  .roots .pic{max-width:420px}
  .arches{grid-template-columns:1fr}
  .ah{padding-top:clamp(60px,14vw,90px)}
  .euc .pic{max-width:440px}
  .trip{grid-template-columns:1fr 1fr}.trip figure:nth-child(3){display:none}
  .views{grid-template-columns:1fr 1fr}.views figure:nth-child(3){display:none}
  .f-top{grid-template-columns:1fr 1fr}
}
@media (hover:none),(max-width:900px){.pidx button{grid-template-columns:64px 1fr auto}.pidx .no{display:none}.pidx .th{display:block;width:64px;height:80px;border-radius:999px 999px 4px 4px;overflow:hidden;position:relative}.pidx .th img{width:100%;height:100%;object-fit:cover}.rpv{display:none}.range{grid-template-columns:1fr}}
@media (max-width:860px){
  .hero{height:auto}
  .h-stick{position:relative;height:auto;overflow:hidden;padding-top:var(--wmspace,170px)}
  .h-intro{position:relative;top:auto;padding:0 16px 14px;opacity:1}
  .h-arch{position:relative;left:0;transform:none;width:calc(100vw - 32px);height:60svh;min-height:400px;margin:0 auto;border-radius:46vw 46vw var(--r) var(--r)}
  .h-arch .shade{opacity:0}
  .h-copy{position:relative;bottom:auto;pointer-events:auto;padding:28px 0 40px}.h-copy .mk>*{transform:none}
  .h-copy .row{grid-template-columns:1fr;gap:16px}
  .h-copy h1{color:var(--fg)}.h-copy .lead{color:var(--fg2)}.h-copy .btns{color:var(--fg)}
  .rings{width:200vw;bottom:auto;top:22vh}
}
@media (max-width:560px){
  .print{right:-6px;width:140px}
  :root{--hh:68px;--wrap:calc(100vw - 32px)}
  .nav .logo{width:122px}
  .h-copy h1{font-size:clamp(36px,10.4vw,46px)}
  .h-intro span:last-child{display:none}
  .op{grid-template-columns:1fr;gap:10px}
  .op .n{font-size:110px}
  .pillars{grid-template-columns:1fr}
  .logos{grid-template-columns:repeat(2,1fr)}
  .legend{grid-template-columns:1fr}
  .trip{grid-template-columns:1fr}.trip figure:nth-child(1){display:none}.trip .arch,.trip figure:nth-child(2) .arch{height:auto;aspect-ratio:4/5}
  .views{grid-template-columns:1fr}.views figure:nth-child(2){display:none}
  .wall{grid-template-columns:1fr 1fr;gap:28px 22px}
  form{grid-template-columns:1fr}
  .f-top{grid-template-columns:1fr}
  .map{height:320px}
}
</style>
</head>
<body>
<header id="hdr"><div class="wrap nav">
  <nav class="nav-l nav-links" id="navL" aria-label="Chapters"></nav><span></span>
  <nav class="nav-r nav-links" id="navR" aria-label="More chapters"></nav>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
</div></header>
<div id="wm"><a href="#top" aria-label="Shimlen home"></a></div>
<nav class="menu" id="menu" aria-label="Menu"></nav>
<aside class="runner" id="runner" aria-hidden="true"><span class="n">I</span><span class="p"><b></b></span><span class="t">Roots</span></aside>
<main id="app"></main>
<footer id="foot"></footer>

<script>window.ROOT='../'</script>
<script src="../shared/data.js"></script>
<script src="../shared/brand.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/ScrollTrigger.min.js"></script>
<script src="../shared/vendor/lenis.min.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/motion.js"></script>
<script src="../shared/rx.js"></script>
<script>
const {ic,R}=Core, S=SH, P=S.products.list, Y=S.story.years, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const CH=[['I','Roots','1980 – 1990','about'],['II','Range','2012 – 2020','products'],['III','Health','2017 – 2023','low-formaldehyde'],['IV','Scale','2021 – 2025','warehouse'],['V','Next','Today','new-home']];
const navHtml=CH.map(([n,t,,id])=>`<a href="#${id}"><i>${n}</i>${t}</a>`).join('')+`<a href="#contact"><i>·</i>Contact</a>`;
const navA=[...CH.map(([n,t,,id])=>`<a href="#${id}"><i>${n}</i>${t}</a>`),`<a href="#contact"><i>·</i>Contact</a>`];
$('#navL').innerHTML=navA.slice(0,3).join(''); $('#navR').innerHTML=navA.slice(3).join(''); $('#menu').innerHTML=navHtml; $('#wm a').innerHTML=SHIMLEN_WORDMARK;
/* tree-ring line art: wobbly concentric half-rings, seeded so it draws the same every time */
function rings(n=13,w=1600,h=800,seed=7){let s=seed;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  let out='';for(let k=1;k<=n;k++){const r=k*(h/n)*.98,pts=[];const ph=rnd()*6,amp=2+k*.9;
    for(let a=0;a<=180;a+=4){const t=a*Math.PI/180,rr=r+Math.sin(t*5+ph)*amp+Math.sin(t*11+ph*2)*amp*.4;pts.push([w/2+Math.cos(Math.PI-t)*rr,h-Math.sin(t)*rr])}
    out+=`<path d="M${pts.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L')}" style="--len:${Math.round(Math.PI*r*1.15)};animation-delay:${(k*.07).toFixed(2)}s"/>`}
  return `<svg class="rings" viewBox="0 0 ${w} ${h}" aria-hidden="true">${out}</svg>`}
const chron=ix=>`<ol class="chron">${ix.map(i=>`<li><span class="y">${Y[i][0]}</span><div><b>${Y[i][1]}</b><p>${Y[i][2]}</p></div></li>`).join('')}</ol>`;
const op=(k,title)=>`<header class="op"><span class="n">${CH[k][0]}</span><div><div class="label">Chapter ${['one','two','three','four','five'][k]} · ${CH[k][2]}</div><h2 class="serif">${title}</h2></div></header>`;

$('#app').innerHTML=`
<section class="hero" id="top"><div class="h-stick" id="hStick">
  ${rings()}
  <div class="wrap h-intro" id="hIntro"><span><b>${S.hero.eyebrow}</b></span><span class="scroll-cue">Scroll to enter <i></i></span></div>
  <div class="h-arch" id="hArch"><div class="reel" id="rReel"></div><div class="shade"></div></div>
  <div class="h-copy"><div class="wrap row">
    <div class="mk"><h1 class="serif">Forty-five years of the boards behind <em>Malaysia’s</em> furniture.</h1></div>
    <div><div class="mk"><p class="lead" style="margin-bottom:0">${S.hero.h1.replace('.','')}: ${S.hero.lead.charAt(0).toLowerCase()+S.hero.lead.slice(1)}</p></div>
      <div class="mk"><div class="btns"><a href="#about" class="btn"><span class="ring">${ic('arrow')}</span>Begin with chapter one</a><a href="#contact" class="btn"><span class="ring">${ic('arrow')}</span>Enquire</a></div></div></div>
  </div></div>
</div></section>
<div class="cbar"><nav class="wrap contents" aria-label="Contents">${CH.map(([n,t,y,id])=>`<a href="#${id}"><i>${n}</i><b>${t}</b><span>${y}</span></a>`).join('')}</nav></div>

<section class="ch" id="about" data-ch="0"><div class="wrap">
  ${op(0,'Roots')}
  <div class="roots" id="story">
    <figure class="rfig"><div class="pic arch"><img src="${RX.stock('carpenter.jpg')}" alt="A furniture maker in his workshop" loading="lazy"></div>
      <div class="print" data-notag><img src="${R}img/ms-1989-shop.jpg" alt="Shimlen's shop on Jalan Cheras, 1989"><span>Jalan Cheras, 1989</span></div><figcaption>Since 1980, the furniture makers of the Klang Valley have been our people.</figcaption></figure>
    <div><p class="big">${S.about.h2} It began in 1980, supplying materials to the furniture makers of the Klang Valley, and it still does.</p>
      <p class="lead">${S.about.tabs[0][1]}</p>
      ${chron([0,1,2])}
      <div class="pillars">${S.about.pillars.map(([i,t])=>`<div><i><img src="${R}img/${i}" alt=""></i>${t}</div>`).join('')}</div></div>
  </div>
</div></section>

<section class="ch wal" id="products" data-ch="1"><div class="wrap">
  ${op(1,'The <em>range</em>')}
  <div class="rtop"><div><h3 class="serif h2" style="font-size:clamp(30px,2.8vw,44px)">${S.products.h2}</h3><p class="lead">${S.about.tabs[1][1].split('. ').slice(0,1).join('')}.</p></div>${chron([3,4,5,7,8])}</div>
  <div class="range">
    <ol class="pidx" id="pidx">${P.map((p,i)=>`<li><button data-p="${i}" data-i="${i}"><span class="no">${String(i+1).padStart(2,'0')}</span><span class="th" data-notag><img src="${RX.use(i)}" alt="" loading="lazy"></span><span class="nm">${p.n}<span class="br">${p.b}</span></span><span class="ring">${ic('arrow')}</span></button></li>`).join('')}</ol>
    <aside class="rpv" aria-hidden="true"><div class="rpic arch">${P.map((p,i)=>`<img src="${RX.use(i)}" alt="" loading="lazy" class="${i?'':'on'}">`).join('')}</div>
      <div class="rcap"><i id="rpvNo">01</i><b id="rpvN">${P[0].n}</b><span id="rpvB">${P[0].b}</span></div></aside>
  </div>
  <div class="logos" id="brands">${S.brands.map(([img,n,c])=>`<div><img class="${c||''}" src="${R}img/${img}" alt="${n}" loading="lazy"></div>`).join('')}</div>
</div></section>

<section class="ch cream" id="low-formaldehyde" data-ch="2"><div class="wrap">
  ${op(2,'Health')}
  <div class="lfh"><h3 class="serif h2 split">${S.lf.h2}</h3><p class="lead">${S.lf.lead}</p></div>
  <div class="arches">${S.lf.steps.slice(0,3).map(([y,p],i)=>`<div class="ah"><div class="y">${y}</div><div class="k">${['E1 grade','Full E1 range','Super E0'][i]}</div><p>${p}</p></div>`).join('')}</div>
  <div class="lf-note"><img src="${R}img/b-e0.png" alt="E0">${S.lf.e0}</div>
  <div class="euc" id="eucalli">
    <figure class="pic arch" style="margin:0"><img src="${RX.stock('mfp.jpg')}" alt="Wardrobe in melamine faced plywood" loading="lazy"><button class="lay" data-notag data-lb="layers" data-src="${R}img/eucalli-layers.png" data-cap="eucalli E0 · the layers"><img src="${R}img/eucalli-layers.png" alt="eucalli E0 board layers"></button></figure>
    <div><img class="euc-logo" src="${R}img/b-eucalli.png" alt="eucalli E0"><div class="label">${S.eucalli.eyebrow}</div><h3 class="serif h2">${S.eucalli.h2}</h3><p class="lead">${S.eucalli.lead}</p>
      <div class="bar" id="coreBar">${S.eucalli.core.split.map(([n])=>`<div><span data-pct="${n}">0</span>%</div>`).join('')}</div>
      <div class="legend">${S.eucalli.core.split.map(([,b,t])=>`<div><b>${b}</b>${t}</div>`).join('')}</div>
      <ol class="feats">${S.eucalli.feats.map(([b,p])=>`<li><span><b>${b}.</b> ${p}</span></li>`).join('')}</ol>
      <div class="proof">${S.eucalli.proof.map(([src,c])=>`<button data-lb="proof" data-src="${R}${src}" data-cap="${c}"><img src="${R}${src}" alt="${c}"></button>`).join('')}<small>${S.eucalli.proofNote}</small></div></div>
  </div>
</div></section>

<section class="ch" id="warehouse" data-ch="3"><div class="wrap">
  ${op(3,'Scale')}
  <div class="grand" id="grand"><img src="${R}img/site-warehouse.jpg" alt="Inside the Shimlen warehouse in Bandar Teknologi Kajang: racks of boards under a high steel roof" loading="lazy">
    <div class="g-copy"><div class="wrap"><div class="label">Our warehouse today · Bandar Teknologi Kajang</div>
      <div class="g-n"><span data-count="10000">10,000</span><small>m²</small></div>
      <p>${RX.SCALE.sqft}, ${RX.SCALE.pitch}: racked from the floor to the roof.</p></div></div></div>
  <div class="g-row">
    <figure><div class="im"><img src="${R}img/site-aerial.jpg" alt="Aerial view of the Shimlen warehouse and its yard in Bandar Teknologi Kajang" loading="lazy"></div><figcaption><b>From above</b>The whole site in Bandar Teknologi Kajang.</figcaption></figure>
    <figure><div class="arch"><img src="${R}img/site-building.jpg" alt="The Shimlen building and its signage" loading="lazy"></div><figcaption><b>Since 2017</b>Our building, and the start of every order.</figcaption></figure>
    <dl class="g-facts"><div><dt>10,000 m²</dt><dd>of warehouse floor</dd></div><div><dt>≈108,000 sq ft</dt><dd>bigger than a football pitch</dd></div><div><dt>Since 2017</dt><dd>at this address, our third move</dd></div><div><dt>24 h*</dt><dd>delivery across the Klang Valley</dd></div></dl>
  </div>
  <div class="record"><div class="label" style="justify-content:center">${S.lf.steps[3][0]} · The Malaysia Book of Records</div>
    <div class="big serif" style="margin-top:26px"><span data-count="${S.lf.record.n}">0</span></div><div class="u">${S.lf.record.unit}, in one stockpile</div>
    <p>${S.lf.record.h}.</p>
    <button class="crt" data-lb="rec" data-src="${R}${S.lf.record.img}" data-cap="The Malaysia Book of Records, 2025"><img src="${R}${S.lf.record.img}" alt="Certificate"><span>See the certificate</span></button></div>
  <div class="wh">
    <div><div class="label">${S.warehouse.eyebrow}</div><h3 class="serif h2 split">${S.warehouse.h2}</h3><p class="sq">10,000 m² under one roof: ${RX.SCALE.sqft}, ${RX.SCALE.pitch}.</p><p class="lead">${S.warehouse.lead}</p>
      <ul>${S.warehouse.points.map(([i,t])=>`<li>${ic('i-'+i)}${t}</li>`).join('')}</ul></div>
    <div class="trip"><figure><div class="arch"><img src="${RX.stock('board-stack.jpg')}" alt="Boards stacked high in a warehouse" loading="lazy"></div><figcaption>Stacked to the roof</figcaption></figure>
      <figure><div class="arch"><img src="${RX.stock('aisle.jpg')}" alt="Wrapped panels in a long warehouse aisle" loading="lazy"></div><figcaption>Aisle after aisle of ready stock</figcaption></figure>
      <figure><div class="arch"><img src="${RX.stock('forklift.jpg')}" alt="A forklift driver moving timber" loading="lazy"></div><figcaption>Moved by people who know boards</figcaption></figure></div>
  </div>
  <div class="recog" id="recognition"><div><div class="label">${S.certs.eyebrow}</div><h3 class="serif h2 split" style="margin-top:14px">${S.certs.h2}</h3><p class="lead" style="color:var(--mut);margin-top:14px">${S.certs.lead}</p></div>
    <div class="wall">${S.certs.list.slice().reverse().map(c=>`<button class="frm" data-lb="certs" data-src="${R}${c.src}" data-cap="${c.h} · ${c.yr}"><div class="mat"><img src="${R}${c.src}" alt="${c.h}" loading="lazy"></div><div class="yr">${c.yr}</div><b>${c.h}</b><span>${c.p}</span></button>`).join('')}</div></div>
</div></section>

<section class="ch wal nx" id="new-home" data-ch="4"><div class="wrap">
  ${op(4,'<em>Next</em>')}
  <div class="nx-pic" id="nxPic"><div class="reel" id="nReel"></div></div>
  <div class="nx-copy"><div><div class="label">What comes next</div><h3 class="serif h2 split">${RX.HOME.h}</h3></div><p class="lead">${RX.HOME.p}</p></div>
  <div class="views">${[['new-front-dawn.jpg','The front, at dawn'],['new-front-mist.jpg','In the morning mist'],['new-corner.jpg','The corner, in daylight']].map(([f,c])=>`<figure><div class="im"><img src="${RX.render(f)}" alt="${c} (artist's impression)" loading="lazy"></div><figcaption>${c}</figcaption></figure>`).join('')}</div>
  <div style="height:var(--pad)"></div>
</div></section>

<section class="cream" id="contact"><div class="wrap">
  <div class="epi-q"><div class="label" style="justify-content:center;margin-bottom:26px">Epilogue · ${S.quotes.eyebrow}</div>
    <div class="q-stack">${S.quotes.list.map(([q,n,r])=>`<div class="q"><blockquote>“${q}”</blockquote><cite><b>${n}</b> · ${r}</cite></div>`).join('')}</div>
    <div class="q-dots">${S.quotes.list.map((_,i)=>`<button aria-label="Quote ${i+1}"></button>`).join('')}</div></div>
  <div class="ct">
    <div><div class="label">${S.contact.eyebrow}</div><h2 class="serif h2 split">The next chapter is yours. ${S.contact.h2}</h2>
      <dl><div><dt>Phone</dt><dd class="tels">${Core.tels()}</dd></div><div><dt>Email</dt><dd>${Core.mail()}</dd></div>
        <div><dt>Visit</dt><dd>${S.contact.address.join(' ')}<div class="links"><a href="${S.contact.gmaps}" target="_blank" rel="noopener">Google Maps</a><a href="${S.contact.waze}" target="_blank" rel="noopener">Waze</a></div></dd></div>
        <div><dt>Hours</dt><dd>${S.contact.hours.join(' · ')}</dd></div></dl></div>
    <form id="form" novalidate>${RX.form()}<div class="full"><button class="btn btn-solid" type="submit">Send enquiry</button></div><div class="sent" id="sent">${S.contact.sent}</div></form>
  </div>
  <div class="map">${RX.map()}</div>
</div></section>`;

$('#foot').innerHTML=`<div class="wrap">
  <div class="f-top">
    <div>${SHIMLEN_LOGO}<p>${S.footer.blurb}</p><div class="social"><a href="#" aria-label="Facebook">${ic('fb','fill')}</a><a href="#" aria-label="Instagram">${ic('ig','fill')}</a><a href="#" aria-label="Xiaohongshu">${ic('xhs','fill')}</a></div></div>
    <div><h5>Chapters</h5><ul>${CH.map(([n,t,,id])=>`<li><a href="#${id}">${n}. ${t}</a></li>`).join('')}</ul></div>
    <div><h5>Products</h5><ul>${P.slice(0,6).map((p,i)=>`<li><a href="#products" data-open="${i}">${p.n}</a></li>`).join('')}</ul></div>
    <div><h5>Visit</h5><ul><li>Lot 30482, Jalan P4/8C</li><li>Bandar Teknologi Kajang</li><li>43500 Semenyih, Selangor</li><li style="margin-top:10px">${Core.tels('</li><li>')}</li><li>${Core.mail()}</li></ul></div>
  </div>
  <div class="f-wm">${SHIMLEN_WORDMARK}</div>
  <div class="f-bot"><span>${S.footer.legal}</span><span>${S.footer.links}</span></div>
  <p class="rx-note">${RX.note}</p>
</div>`;

RX.reel('rReel','night',['new-night.jpg']);
RX.reel('nReel','slow',['new-corner-tropical.jpg','new-front-dusk.jpg']);
RX.tag();
Core.init();

/* the preview in the right third follows the name under the pointer */
(function(){const ims=$$('.rpic img'),bs=$$('#pidx button');
  bs.forEach(b=>b.addEventListener('pointerenter',()=>{const i=+b.dataset.i;bs.forEach(x=>x.classList.toggle('on',x===b));ims.forEach((im,k)=>im.classList.toggle('on',k===i));
    $('#rpvNo').textContent=String(i+1).padStart(2,'0');$('#rpvN').textContent=P[i].n;$('#rpvB').textContent=P[i].b}))})();

/* hero choreography: the wordmark shrinks from full width into the middle of the navbar while the arch opens.
   The scene follows the scroll through a soft spring, so a flick of the wheel never makes it jump. */
(function(){const st=$('#hStick'),hero=$('#top'),wm=$('#wm'),hdr=$('#hdr'),intro=$('#hIntro'),mk=$$('.h-copy .mk');
  const RATIO=36.4/310;let L={};
  const lay=()=>{const W=innerWidth,H=innerHeight,hh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh'))||72,mob=W<=860;
    const w0=Math.min(W*(mob?.92:.94),1500),h0=w0*RATIO,top0=hh+(mob?6:10),w1=mob?118:150,h1=w1*RATIO,top1=(hh-h1)/2;
    const introTop=top0+h0+16,archTop=introTop+(mob?0:intro.offsetHeight)+22;
    L={W,H,hh,mob,w0,h0,top0,w1,top1,ah0:Math.max(H*.42,H-archTop)};
    if(mob){st.style.setProperty('--wmspace',(top0+h0+14)+'px')}else{st.style.setProperty('--it',introTop+'px')}};
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, cl=v=>Math.min(1,Math.max(0,v)), out=t=>1-Math.pow(1-t,3);
  const set=y=>{let q,e=0;
    if(L.mob){q=cl(y/(L.top0+L.h0))}
    else{const p=cl(y/(hero.offsetHeight-L.H));e=ease(p);q=Math.min(1,e*1.25);
      const aw=.64*L.W+(L.W-.64*L.W)*e,ah=L.ah0+(L.H-L.ah0)*e,rr=(1-e)*aw/2;
      st.style.setProperty('--aw',aw+'px');st.style.setProperty('--ah',ah+'px');st.style.setProperty('--ar',`${rr}px ${rr}px 0 0`);
      st.style.setProperty('--sh',cl(e*1.7));st.style.setProperty('--pe',e>.8?'auto':'none');
      st.style.setProperty('--io',cl(1-e*3));st.style.setProperty('--ro',cl(1-e*1.6));
      mk.forEach((m,i)=>m.style.setProperty('--m',out(cl((e-.6-i*.07)/.26)).toFixed(4)))}
    const qq=ease(q),w=L.w0+(L.w1-L.w0)*qq,t=L.top0+(L.top1-L.top0)*qq;
    wm.style.width=w+'px';wm.style.transform=`translate3d(-50%,${t}px,0)`;
    hdr.classList.toggle('solid',q>=.98||y>hero.offsetHeight-L.H-10)};
  let cur=scrollY,raf=0;
  const tick=()=>{const tgt=scrollY;cur+=(tgt-cur)*.16;if(Math.abs(tgt-cur)<.4)cur=tgt;set(cur);raf=cur===tgt?0:requestAnimationFrame(tick)};
  const go=()=>{if(!Motion.ok||L.mob){cur=scrollY;set(cur);return}if(!raf)raf=requestAnimationFrame(tick)};
  lay();set(cur);addEventListener('resize',()=>{lay();set(cur=scrollY)});document.addEventListener('pagescroll',go);addEventListener('scroll',go,{passive:true})})();

/* the running chapter at the edge of the page */
(function(){const run=$('#runner'),n=run.querySelector('.n'),t=run.querySelector('.t'),chs=$$('[data-ch]');
  const upd=()=>{let cur=-1;chs.forEach((c,i)=>{if(c.getBoundingClientRect().top<innerHeight*.5)cur=i});
    run.classList.toggle('on',cur>-1&&$('#contact').getBoundingClientRect().top>innerHeight*.5);
    if(cur<0)return;const c=chs[cur],r=c.getBoundingClientRect();n.textContent=CH[cur][0];t.textContent=CH[cur][1];
    run.classList.toggle('lt',c.classList.contains('cream'));
    run.style.setProperty('--p',Math.min(1,Math.max(0,(innerHeight*.5-r.top)/r.height)))};
  document.addEventListener('pagescroll',upd);upd()})();

/* ---- motion: Heartwood turns its pages ---- */
$$('#pidx button').forEach(e=>e.dataset.cursor='Open');
$$('.rings').forEach(r=>Motion.scrub(r,{rotate:0},{rotate:6},{trigger:'.hero',start:'top top',end:'bottom top'}));
$$('.frm,.proof button,.euc .lay,.record .crt').forEach(e=>e.dataset.cursor='Zoom');
$$('.hero,.ch:not(.cream),footer').forEach(e=>e.setAttribute('data-cur-dark',''));
Motion.init({intro:'rings'});
/* chapter numerals draw on and the titles rise */
if(Motion.ok)$$('.op').forEach(o=>{gsap.fromTo(o.querySelector('.n'),{yPercent:30,opacity:0},{yPercent:0,opacity:1,ease:'none',scrollTrigger:{trigger:o,start:'top 95%',end:'top 55%',scrub:.4}});});
Motion.chars('.split');
Motion.masks('.g-row .im,.g-row .arch,.roots .pic,.ah,.euc .pic,.trip .arch,.frm .mat,.views .im,.map');
Motion.cascade('.contents a,.rcap,.op h2,.op .label,.chron li,.pidx li,.logos div,.pillars div,.big,.lf-note,.feats li,.legend,.proof,.wh li,.record .u,.record p,.record .crt,.frm b,.frm span,.frm .yr,.ct dl>div,.g-facts div,.g-row figcaption,form,.nx-copy .lead,.lfh .lead,.roots .lead');
Motion.parallax('.roots .pic img,.trip img',6);
/* our warehouse: an arch opens onto the hall and the photograph settles */
if(Motion.ok){const g=$('#grand'),gi=$('#grand>img'),r=()=>innerWidth>900?'50vw 50vw 0px 0px':'40vw 40vw 0px 0px';
  gsap.fromTo(g,{clipPath:()=>`inset(5% ${innerWidth>900?16:6}% 0% ${innerWidth>900?16:6}% round ${r()})`},{clipPath:'inset(0% 0% 0% 0% round 0px 0px 0px 0px)',ease:'power1.inOut',
    scrollTrigger:{trigger:g,start:'top 95%',end:'top 5%',scrub:.8,invalidateOnRefresh:true}});
  gsap.fromTo(gi,{scale:1.22},{scale:1,ease:'none',scrollTrigger:{trigger:g,start:'top bottom',end:'bottom top',scrub:.8}});
  gsap.fromTo('.g-copy .wrap>*',{y:70,clipPath:'inset(0% 0% 100% 0%)'},{y:0,clipPath:'inset(0% 0% -40% 0%)',ease:'power2.out',stagger:.1,scrollTrigger:{trigger:g,start:'top 50%',end:'top 5%',scrub:.8}})}
/* the next home grows out of its arch as you scroll */
if(Motion.ok&&innerWidth>900)gsap.fromTo('#nxPic',{width:'min(820px,100%)',borderRadius:'999px 999px 0px 0px'},{width:'100%',borderRadius:'24px 24px 0px 0px',ease:'none',scrollTrigger:{trigger:'#nxPic',start:'top 80%',end:'top 10%',scrub:true}});
Motion.wordRise('.f-wm');
</script>
</body>
</html>
