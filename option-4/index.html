<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shimlen · Option 4 · Quiet</title>
<meta name="description" content="High-quality materials for custom-made furniture: plywood, MFC, HPL, edgeband, acoustic and lacquered panels. 10,000 sq m warehouse in Semenyih, Selangor.">
<link rel="icon" href="../img/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/motion.css">
<style>
/* Option 4 · Quiet (after Finsa): white space, one refined typeface, small careful type, a single accent line,
   materials shown in place, calm motion. */
:root{--bg:#fff;--fg:#1D1B1B;--fg2:#5E5958;--mut:#8F8988;--line:#E6E2E0;--acc:#867774;--soft:#F5F3F1;--hh:72px;
  --wrap:min(1280px,calc(100vw - 64px));--pad:clamp(72px,8vw,128px);--drawer-bg:#fff;--drawer-line:#E6E2E0}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.65;color:var(--fg)}
h1,h2,h3,h4{font-weight:500;letter-spacing:.01em;line-height:1.18}
.h2{font-size:clamp(26px,2.4vw,36px)}
.lab{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.lead{font-size:16px;color:var(--fg2);max-width:52ch}
section{padding:var(--pad) 0}
.tel{border-bottom:1px solid currentColor;white-space:nowrap}
/* the one link style: a short line that extends on hover */
.more{display:inline-flex;align-items:center;gap:14px;font-size:14px;font-weight:500;color:var(--fg)}
.more::before{content:"";width:34px;height:1px;background:var(--acc);transition:width .45s var(--ease)}
.more:hover::before{width:58px}
.more.light{color:#fff}.more.light::before{background:#fff}
.btn-o{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;border:1px solid currentColor;font-size:14px;font-weight:500;transition:background .3s,color .3s}
.btn-o.light{color:#fff}.btn-o.light:hover{background:#fff;color:var(--fg)}
.btn-f{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;background:var(--fg);color:#fff;font-size:14px;font-weight:500;transition:background .3s}
.btn-f:hover{background:var(--acc)}

/* header */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s,transform .45s var(--ease)}
#hdr.scrolled{border-color:var(--line)}
#hdr.hide{transform:translateY(-100%)}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
.nav .logo{width:138px}
.nav-links{display:flex;gap:34px;font-size:13px;font-weight:500;letter-spacing:.06em}
.nav-links a{position:relative;padding:6px 0}
.nav-links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--acc);transition:width .4s var(--ease)}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-r{display:flex;align-items:center;gap:18px}
.burger{display:none;font-size:13px;font-weight:500;letter-spacing:.06em}
.menu{position:fixed;inset:0;background:#fff;z-index:55;padding:calc(var(--hh) + 24px) 24px 40px;display:flex;flex-direction:column;transform:translateY(-100%);transition:transform .6s var(--ease)}
.menu a{font-size:26px;font-weight:500;padding:12px 0;border-bottom:1px solid var(--line)}
body.menu-open .menu{transform:none}
main{padding-top:var(--hh)}

/* hero: a calm film, one centred line */
.hero{position:relative;height:calc(100svh - var(--hh));min-height:540px;padding:0;color:#fff}
.hero .reel{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,15,15,.15),rgba(18,15,15,.45))}
.h-c{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:0 24px}
.h-c .lab{color:rgba(255,255,255,.85)}
.hero h1{font-size:clamp(32px,3.8vw,56px);max-width:20ch}
.hero .lead{color:rgba(255,255,255,.88);max-width:46ch;text-align:center}
.h-scroll{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;text-transform:uppercase;display:grid;justify-items:center;gap:10px;opacity:.85}
.h-scroll i{width:1px;height:34px;background:rgba(255,255,255,.5);position:relative;overflow:hidden}
.h-scroll i::after{content:"";position:absolute;left:0;top:-34px;width:1px;height:34px;background:#fff;animation:cue 2.2s var(--ease) infinite}
@keyframes cue{to{top:34px}}

/* key figures: a quiet row */
.figs{border-bottom:1px solid var(--line);padding:0}
.figs .wrap{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr}
.fig{padding:30px 0}
.fig .n{font-size:30px;font-weight:500;letter-spacing:.01em}
.fig .n small{font-size:13px;color:var(--mut);margin-left:4px;font-weight:400}
.fig .l{font-size:13px;color:var(--mut)}
.rec{display:flex;gap:14px;align-items:center;text-align:left;border-left:1px solid var(--line);padding-left:28px}
.rec i{width:54px;height:54px;background:var(--fg);display:grid;place-items:center;flex:none}
.rec img{width:40px}
.rec span{font-size:13px;color:var(--fg2);line-height:1.5}
.rec b{display:block;color:var(--fg);font-weight:500}

/* about: one short statement, then two rooms */
.intro{display:grid;grid-template-columns:1fr 2fr;gap:40px}
.intro .txt{max-width:640px}
.intro p{color:var(--fg2);margin:18px 0 26px;font-size:16px}
.pillars{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:26px}
.pillar{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.pillar i{width:30px;height:30px;background:var(--fg);display:grid;place-items:center}
.pillar img{width:17px;height:17px;object-fit:contain}
.feature{display:grid;grid-template-columns:5fr 7fr;align-items:center;margin-top:clamp(56px,6vw,96px)}
.feature .card{background:var(--soft);padding:clamp(28px,3.4vw,52px);margin-right:-80px;position:relative;z-index:2;align-self:center}
.feature .card h3{font-size:22px;margin:12px 0 12px}
.feature .card p{color:var(--fg2);font-size:15px;margin-bottom:22px}
.feature .pic{aspect-ratio:4/3;overflow:hidden}
.feature .pic img{width:100%;height:100%;object-fit:cover}
.feature.flip{grid-template-columns:7fr 5fr}
.feature.flip .card{order:2;margin-right:0;margin-left:-80px}
.feature.flip .pic{order:1}
.cap{font-size:12px;color:var(--mut);margin-top:10px}

/* products: a slider with a thin progress line */
.s-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:30px;flex-wrap:wrap}
.s-head .lead{margin-top:12px}
.chips{display:flex;gap:22px;font-size:13px;font-weight:500;margin-bottom:22px;flex-wrap:wrap}
.chips button{color:var(--mut);padding-bottom:4px;border-bottom:1px solid transparent}
.chips button.on{color:var(--fg);border-color:var(--acc)}
.p-rail{gap:22px;padding:0 calc((100vw - var(--wrap))/2);scroll-padding:0 calc((100vw - var(--wrap))/2)}
.prod{width:clamp(250px,22vw,310px);text-align:left;display:flex;flex-direction:column;gap:14px}
.prod.hid{display:none}
.prod .ph{aspect-ratio:4/5;background:var(--soft);overflow:hidden}
.prod .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.prod:hover .ph img{transform:scale(1.04)}
.prod .ph{position:relative}
.prod .ph .cut{position:absolute;left:12px;bottom:12px;width:31%;height:auto;aspect-ratio:1;object-fit:contain;background:#fff;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.12);transform:none!important}
.uses{display:grid;grid-template-columns:6fr 3fr 3fr;grid-template-rows:1fr 1fr;gap:16px;margin-top:clamp(36px,4vw,56px);height:clamp(520px,52vw,760px)}
.uses figure{position:relative;overflow:hidden;margin:0}
.uses figure:first-child{grid-row:1/3}.uses figure:nth-child(2){grid-column:2/4}
.uses img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.uses figure:hover img{transform:scale(1.04)}
.uses figcaption{position:absolute;left:0;bottom:0;background:#fff;padding:10px 14px;font-size:13px}
.uses figcaption b{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
@media (max-width:860px){.uses{grid-template-columns:1fr 1fr;grid-template-rows:auto;height:auto}.uses figure{aspect-ratio:4/5}.uses figure:first-child,.uses figure:nth-child(2){grid-row:auto;grid-column:1/3;aspect-ratio:4/3}}
.prod .b{font-size:12px;color:var(--mut);letter-spacing:.04em}
.prod h3{font-size:16px}
.ctl{display:flex;align-items:center;gap:18px;margin-top:30px}
.ctl button{width:34px;height:34px;display:grid;place-items:center}
.ctl button:disabled{opacity:.25}
.ctl .ic{width:18px;height:18px}
.ctl .track{flex:1;height:1px;background:var(--line);position:relative}
.ctl .track i{position:absolute;left:0;top:-1px;height:2px;width:100%;background:var(--acc);transform-origin:left;transform:scaleX(.12);transition:transform .3s}
.logos{display:grid;grid-template-columns:repeat(8,1fr);gap:0;margin-top:clamp(56px,6vw,90px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.logos div{height:96px;display:grid;place-items:center;padding:14px}
.logos img{max-height:42px;max-width:110px;object-fit:contain;filter:grayscale(1);opacity:.7;transition:filter .4s,opacity .4s}
.logos img.sm{max-height:30px}
.logos div:hover img{filter:none;opacity:1}

/* low formaldehyde */
.soft{background:var(--soft)}
.lf{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,100px)}
.lf p.lead{margin:16px 0 30px}
.record{display:flex;gap:20px;align-items:center;background:#fff;padding:20px}
.record img.cert{width:84px;cursor:zoom-in;box-shadow:0 8px 20px rgba(29,27,27,.12)}
.record .num{font-size:44px;font-weight:500;line-height:1}
.record .num small{font-size:13px;color:var(--mut);font-weight:400;margin-left:6px}
.record h4{font-size:14px;margin:8px 0 2px}
.record p{font-size:12.5px;color:var(--mut)}
.e0{display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--fg2);margin-top:16px}
.e0 img{width:40px}
.years{list-style:none;border-top:1px solid var(--line)}
.years li{display:grid;grid-template-columns:90px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.years b{font-size:22px;font-weight:500}
.years span{color:var(--fg2)}

/* eucalli */
.euc{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,100px);align-items:start}
.euc .pic{position:sticky;top:calc(var(--hh) + 30px);height:min(calc(100svh - var(--hh) - 60px),720px);overflow:hidden;background:var(--soft)}
.euc .pic img{width:100%;height:100%;object-fit:cover}
.euc .pic .lay{position:absolute;right:16px;bottom:16px;width:36%;background:#fff;padding:8px;cursor:zoom-in}
.euc .logo2{height:36px;width:auto;margin-bottom:22px}
.euc h2{margin:12px 0 14px}
.core{margin:30px 0;padding-top:20px;border-top:1px solid var(--line)}
.core h4{font-size:15px}
.core .sub{font-size:12.5px;color:var(--mut);margin-bottom:14px}
.bar{display:flex;height:40px;font-size:14px;color:#fff;background:var(--soft)}
.bar>div{display:flex;align-items:center;padding-left:14px;width:0;transition:width 1s var(--ease)}
.bar>div:first-child{background:var(--fg)}.bar>div:last-child{background:var(--acc)}
.bar.in>div:first-child{width:60%}.bar.in>div:last-child{width:40%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px;font-size:13px;color:var(--fg2)}
.legend b{display:block;color:var(--fg);font-weight:500}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
.feats>div{border-top:1px solid var(--line);padding-top:12px}
.feats b{font-size:14px;font-weight:500}
.feats p{font-size:13px;color:var(--fg2)}
.proof{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
.proof button{width:62px;aspect-ratio:3/4;overflow:hidden;background:var(--soft)}
.proof img{width:100%;height:100%;object-fit:cover}
.proof small{flex:1;min-width:160px;font-size:12.5px;color:var(--mut)}

/* warehouse */
.wh{position:relative;padding:0;color:#fff}
.wh .film{height:min(84svh,820px)}
.wh .shade{position:absolute;inset:0;background:rgba(18,15,15,.38)}
.wh .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:0 24px}
.wh h2{font-size:clamp(28px,3.2vw,46px);max-width:18ch}
.wh .c p{max-width:52ch;color:rgba(255,255,255,.88)}
.points{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.points div{display:flex;gap:12px;align-items:center;padding:26px 20px 26px 0;font-size:14px}
.points .ic{width:22px;height:22px;color:var(--acc)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px}
.gal button{aspect-ratio:3/2;overflow:hidden;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.gal button:hover img{transform:scale(1.04)}

/* story: a year line, the chosen year below */
.ys-line{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:34px}
.ys-line::-webkit-scrollbar{display:none}
.ys-line button{flex:none;padding:12px 22px 14px 0;margin-right:10px;font-size:15px;font-weight:500;color:var(--mut);position:relative}
.ys-line button::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--acc);transition:width .4s var(--ease)}
.ys-line button.on{color:var(--fg)}
.ys-line button.on::after{width:calc(100% - 22px)}
.ys-detail{display:grid;grid-template-columns:7fr 5fr;gap:clamp(30px,4vw,64px);margin-top:36px;align-items:center}
.ys-detail .md{aspect-ratio:16/10;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.ys-detail .md img{width:100%;height:100%;object-fit:cover;animation:paneIn .6s var(--ease)}
.ys-detail .md.logo img,.ys-detail .md.doc img{object-fit:contain;padding:10%}
.ys-detail .y{font-size:48px;font-weight:500;line-height:1}
.ys-detail h3{font-size:20px;margin:14px 0 8px}
.ys-detail p{color:var(--fg2)}
.ys-detail .arrows{display:flex;gap:10px;margin-top:24px;align-items:center;font-size:12.5px;color:var(--mut)}
.ys-detail .arrows button{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line)}
.ys-detail .arrows .ic{width:16px;height:16px}

/* recognition + quote */
.certs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:30px}
.cert{text-align:left;display:flex;flex-direction:column;gap:8px}
.cert .fr{position:relative;height:200px;background:var(--soft);overflow:hidden}
.cert .fr img{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain}
.cert .yr{font-size:12px;color:var(--mut);letter-spacing:.04em}
.cert h3{font-size:15px}
.cert p{font-size:13px;color:var(--fg2)}
.quote{text-align:center;max-width:820px;margin:0 auto}
.quote blockquote{font-size:clamp(20px,2vw,28px);font-weight:400;line-height:1.4}
.quote cite{display:block;font-style:normal;margin-top:18px;font-size:13px;color:var(--mut)}
.q-dots{display:flex;gap:10px;justify-content:center;margin-top:26px}
.q-dots button{width:26px;height:2px;background:var(--line)}
.q-dots button.on{background:var(--acc)}

/* contact */
.ct{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(40px,6vw,100px)}
.info{list-style:none;margin-top:26px;border-top:1px solid var(--line)}
.info li{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.info b{font-weight:500;color:var(--mut);font-size:12.5px}
.info .tels{display:flex;flex-wrap:wrap;gap:4px 14px}
.links{display:flex;gap:14px;margin-top:4px}
.links a{border-bottom:1px solid}
form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px 22px;align-content:start}
.field label{font-size:12px;color:var(--mut);font-weight:500}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;outline:none;font-size:15px;border-radius:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--fg)}
.field textarea{min-height:64px;resize:vertical}
.full{grid-column:1/-1}
.sent{grid-column:1/-1;background:var(--soft);padding:12px;font-size:13.5px}
.map{position:relative;height:380px;background:var(--soft);margin-top:clamp(50px,5vw,80px);overflow:hidden}
.map-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--mut);font-size:13px}
.map-ph a{border-bottom:1px solid}
.map-card{position:absolute;left:20px;top:20px;z-index:2;background:#fff;padding:22px 24px;width:min(340px,calc(100% - 40px))}
.map-card h3{font-size:17px;margin:8px 0 6px}
.map-card p{font-size:13px;color:var(--fg2)}
.map-card .acts{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}

/* footer */
footer{background:var(--soft);padding:clamp(56px,6vw,80px) 0 24px}
.f-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr;gap:30px}
footer .logo{width:150px}
footer h5{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
footer ul{list-style:none;display:grid;gap:7px;font-size:13.5px;color:var(--fg2)}
footer a:hover{color:var(--fg)}
.social{display:flex;gap:16px;margin-top:20px}
.social .ic{width:19px;height:19px}
.f-bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);margin-top:50px;padding-top:20px}

@media (max-width:1080px){
  .nav-links,.nav-r .btn-f{display:none}.burger{display:block}
  .figs .wrap{grid-template-columns:repeat(4,1fr)}.rec{grid-column:1/-1;border-left:0;padding:0 0 24px}
  .lf,.euc,.ct{grid-template-columns:1fr}
  .euc .pic{position:relative;top:0;height:auto;aspect-ratio:4/3}
  .logos{grid-template-columns:repeat(4,1fr)}
  .certs{grid-template-columns:1fr 1fr}
  .points{grid-template-columns:1fr 1fr}
  .f-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  :root{--wrap:calc(100vw - 40px)}
  .intro{grid-template-columns:1fr;gap:14px}
  .feature,.feature.flip{grid-template-columns:1fr}
  .feature .card,.feature.flip .card{order:2;margin:-50px 18px 0;padding:26px}
  .feature .pic,.feature.flip .pic{order:1}
  .figs .wrap{grid-template-columns:1fr 1fr}
  .ys-detail{grid-template-columns:1fr}
  .gal{grid-template-columns:1fr 1fr}.gal button:last-child{display:none}
  form{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  :root{--wrap:calc(100vw - 32px);--hh:62px}
  .nav .logo{width:120px}
  .logos{grid-template-columns:repeat(2,1fr)}
  .points{grid-template-columns:1fr}
  .feats,.legend{grid-template-columns:1fr}
  .certs{grid-template-columns:1fr 1fr;gap:14px}.cert .fr{height:150px}
  .years li{grid-template-columns:70px 1fr}
  form{grid-template-columns:1fr}
  .info li{grid-template-columns:90px 1fr}
  .map{height:auto;display:flex;flex-direction:column}
  .map .frame-box{position:relative!important;height:280px}
  .map-card{position:relative;left:0;top:0;width:100%}
  .f-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header id="hdr"><div class="wrap nav">
  <a href="#top" aria-label="Shimlen home" id="hLogo"></a>
  <nav class="nav-links" id="navLinks"></nav>
  <div class="nav-r"><a class="btn-f" href="#contact" style="padding:10px 18px;font-size:13px">Enquire</a><button class="burger" id="burger" aria-expanded="false">Menu</button></div>
</div></header>
<nav class="menu" id="menu" aria-label="Menu"></nav>
<main id="app"></main>
<footer id="foot"></footer>

<script>window.ROOT='../'</script>
<script src="../shared/data.js"></script>
<script src="../shared/brand.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/ScrollTrigger.min.js"></script>
<script src="../shared/vendor/lenis.min.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/motion.js"></script>
<script>
const {ic,R}=Core,S=SH,P=S.products.list,Y=S.story.years,cat=['board','board','surface','surface','surface','edge','board','board','board'],
  USE=['use-plywood.jpg','use-mfc.jpg','use-hpl.jpg','use-opaq.jpg','use-sleek.jpg','use-edgeband.jpg','use-envplas.jpg','use-flexi.jpg','use-mfp.jpg'];
const pad=n=>String(n).padStart(2,'0');
const nav=S.nav.map(([t,id])=>`<a href="#${id}">${t}</a>`).join('');
document.getElementById('navLinks').innerHTML=nav;
document.getElementById('menu').innerHTML=nav+`<a href="#contact">Enquire</a>`;
document.getElementById('hLogo').innerHTML=SHIMLEN_LOGO;

document.getElementById('app').innerHTML=`
<section class="hero" id="top"><div class="reel" id="heroReel"></div><div class="shade"></div>
  <div class="h-c"><div class="lab rv">${S.hero.eyebrow}</div><h1 class="rv">${S.hero.h1}</h1><p class="lead rv">${S.hero.lead}</p>
    <a href="#products" class="btn-o light rv">Explore products</a></div>
  <div class="h-scroll">Scroll<i></i></div></section>

<section class="figs"><div class="wrap">${S.hero.stats.map(([n,u,l])=>`<div class="fig"><div class="n"><span data-count="${n}">0</span><small>${u}</small></div><div class="l">${l}</div></div>`).join('')}
  <button class="rec" data-lb="mbr" data-src="${R}img/cert-mbor.jpg" data-cap="The Malaysia Book of Records, 2025"><i><img src="${R}img/mbr-logo-white.png" alt="The Malaysia Book of Records"></i><span><b>${S.hero.record[0]}</b>${S.hero.record[1]}</span></button></div></section>

<section id="about"><div class="wrap">
  <div class="intro"><div class="lab">${S.about.eyebrow}</div>
    <div class="txt"><h2 class="h2 rv">${S.about.h2}</h2><p class="rv">${S.about.tabs[0][1]}</p>
      <div class="pillars rv">${S.about.pillars.map(([i,t])=>`<span class="pillar"><i><img src="${R}img/${i}" alt=""></i>${t}</span>`).join('')}</div>
      <a class="more" href="#products">Our products</a></div></div>
  <div class="feature"><div class="card"><div class="lab">01 · ${S.about.tabs[0][0]}</div><h3>${S.about.tabs[1][0]}</h3><p>${S.about.tabs[1][1]}</p><a class="more" href="#products">See the range</a></div>
    <figure><div class="pic m"><img src="${R}img/render-office.jpg" alt="Shimlen materials in an office interior"></div></figure></div>
  <div class="feature flip"><div class="card"><div class="lab">02</div><h3>${S.about.tabs[2][0]}</h3><p>${S.about.tabs[2][1]}</p><a class="more" href="#low-formaldehyde">Low formaldehyde</a></div>
    <figure><div class="pic m"><img src="${R}img/use-office.jpg" alt="Timber-look wall panelling in an office"></div><figcaption class="cap">Panels and laminates, finished in a working office.</figcaption></figure></div>
</div></section>

<section id="products" style="padding-top:0">
  <div class="wrap"><div class="s-head"><div><div class="lab">${S.products.eyebrow}</div><h2 class="h2" style="margin-top:12px">${S.products.h2}</h2><p class="lead">${S.products.lead}</p></div></div>
    <div class="chips" id="chips"><button class="on" data-c="all">All</button><button data-c="board">Board</button><button data-c="surface">Surface</button><button data-c="edge">Edge</button></div></div>
  <div class="rail p-rail" id="prail">${P.map((p,i)=>`<button class="prod" data-p="${i}" data-cat="${cat[i]}"><div class="ph"><img src="${R}img/${USE[i]}" alt="${p.n} in use" loading="lazy"><img class="cut" src="${R}${p.img.replace('.jpg','-card.jpg')}" alt="" loading="lazy"></div><div><div class="b">${p.b}</div><h3>${p.n}</h3></div></button>`).join('')}</div>
  <div class="wrap"><div class="ctl"><button id="pPrev" aria-label="Previous">${ic('back')}</button><button id="pNext" aria-label="Next">${ic('arrow')}</button><div class="track"><i id="pBar"></i></div></div>
    <div class="logos" id="brands">${S.brands.map(([img,n,c])=>`<div title="${n}"><img class="${c||''}" src="${R}img/${img}" alt="${n}"></div>`).join('')}</div></div>
</section>

<section id="in-use" style="padding-top:0"><div class="wrap">
  <div class="s-head"><div><div class="lab">Materials in use</div><h2 class="h2" style="margin-top:12px">Where our boards end up.</h2><p class="lead">Kitchens, wardrobes, feature walls and offices. Shimlen supplies the boards, surfaces and edging that furniture makers turn into finished rooms.</p></div></div>
  <div class="uses">
    <figure class="pic m"><img src="${R}img/use-kitchen.jpg" alt="Kitchen in wood-decor cabinets" loading="lazy"><figcaption><b>Kitchen</b>Melamine faced chipboard · edgeband</figcaption></figure>
    <figure class="pic m"><img src="${R}img/use-tvwall.jpg" alt="Fluted feature wall" loading="lazy"><figcaption><b>Living</b>Sleek acoustic fluted panel</figcaption></figure>
    <figure class="pic m"><img src="${R}img/use-hall.jpg" alt="Wardrobe and hallway joinery" loading="lazy"><figcaption><b>Wardrobe</b>High pressure laminates</figcaption></figure>
    <figure class="pic m"><img src="${R}img/use-island.jpg" alt="Kitchen island in dark and wood finishes" loading="lazy"><figcaption><b>Island</b>OPAQ ultra-matt panel</figcaption></figure>
  </div>
  <p class="cap">Concept placeholder photos (Unsplash), to be replaced with Shimlen customer projects.</p>
</div></section>

<section class="soft" id="low-formaldehyde"><div class="wrap lf">
  <div><div class="lab">${S.lf.eyebrow}</div><h2 class="h2" style="margin-top:12px">${S.lf.h2}</h2><p class="lead">${S.lf.lead}</p>
    <div class="record"><img class="cert" src="${R}${S.lf.record.img}" alt="Malaysia Book of Records certificate" data-lb="rec" data-cap="The Malaysia Book of Records, 2025">
      <div><div class="num"><span data-count="${S.lf.record.n}">0</span><small>${S.lf.record.unit}</small></div><h4>${S.lf.record.h}</h4><p>${S.lf.record.p}</p></div></div>
    <div class="e0"><img src="${R}img/b-e0.png" alt="E0">${S.lf.e0}</div></div>
  <ul class="years">${S.lf.steps.map(([y,p])=>`<li><b>${y}</b><span>${p}</span></li>`).join('')}</ul>
</div></section>

<section id="eucalli"><div class="wrap euc">
  <div class="pic m"><img src="${R}img/use-bedroom.jpg" alt="Bedroom joinery in E0 melamine faced plywood"><button class="lay" data-lb="layers" data-src="${R}img/eucalli-layers.png" data-cap="eucalli E0 · the layers"><img src="${R}img/eucalli-layers.png" alt="eucalli E0 board layers"></button></div>
  <div><img class="logo2" src="${R}img/b-eucalli.png" alt="eucalli E0"><div class="lab">${S.eucalli.eyebrow}</div><h2 class="h2">${S.eucalli.h2}</h2><p class="lead">${S.eucalli.lead}</p>
    <div class="core"><h4>${S.eucalli.core.h}</h4><div class="sub">${S.eucalli.core.sub}</div>
      <div class="bar" id="coreBar">${S.eucalli.core.split.map(([n])=>`<div><span data-pct="${n}">0</span>%</div>`).join('')}</div>
      <div class="legend">${S.eucalli.core.split.map(([,b,t])=>`<div><b>${b}</b>${t}</div>`).join('')}</div></div>
    <div class="feats">${S.eucalli.feats.map(([b,p])=>`<div><b>${b}</b><p>${p}</p></div>`).join('')}</div>
    <div class="proof">${S.eucalli.proof.map(([src,c])=>`<button data-lb="proof" data-src="${R}${src}" data-cap="${c}"><img src="${R}${src}" alt="${c}"></button>`).join('')}<small>${S.eucalli.proofNote}</small></div></div>
</div></section>

<section class="wh" id="warehouse"><div class="film" id="whFilm"></div><div class="shade"></div>
  <div class="c"><div class="lab" style="color:rgba(255,255,255,.85)">${S.warehouse.eyebrow}</div><h2>${S.warehouse.h2}</h2><p>${S.warehouse.lead}</p><a class="more light" href="#contact">Visit or enquire</a></div></section>
<div class="wrap"><div class="points">${S.warehouse.points.map(([i,t])=>`<div>${ic('i-'+i)}${t}</div>`).join('')}</div>
  <div class="gal">${S.warehouse.gallery.map(([src,c])=>`<button data-lb="gal" data-src="${R}${src}" data-cap="${c}"><img src="${R}${src}" alt="${c}" loading="lazy"></button>`).join('')}</div></div>

<section id="story"><div class="wrap">
  <div class="lab">${S.story.eyebrow}</div><h2 class="h2" style="margin-top:12px">${S.story.h2}</h2><p class="lead" style="margin-top:12px">${S.story.lead}</p>
  <div class="ys-line" id="ysLine">${Y.map(([y],i)=>`<button data-i="${i}">${y}</button>`).join('')}</div>
  <div class="ys-detail" id="ysDetail"></div>
</div></section>

<section id="recognition" class="soft"><div class="wrap">
  <div class="lab">${S.certs.eyebrow}</div><h2 class="h2" style="margin-top:12px">${S.certs.h2}</h2><p class="lead" style="margin-top:10px">${S.certs.lead}</p>
  <div class="certs">${S.certs.list.map(c=>`<button class="cert" data-lb="certs" data-src="${R}${c.src}" data-cap="${c.h} · ${c.yr}"><div class="fr"><img src="${R}${c.src}" alt="${c.h}" loading="lazy"></div><span class="yr">${c.yr}</span><h3>${c.h}</h3><p>${c.p}</p></button>`).join('')}</div>
</div></section>

<section><div class="wrap quote">
  <div class="lab" style="margin-bottom:22px">${S.quotes.eyebrow}</div>
  <div class="q-stack">${S.quotes.list.map(([q,n,r])=>`<div class="q"><blockquote>“${q}”</blockquote><cite><b>${n}</b> · ${r}</cite></div>`).join('')}</div>
  <div class="q-dots">${S.quotes.list.map((_,i)=>`<button aria-label="Quote ${i+1}"></button>`).join('')}</div>
</div></section>

<section id="contact" style="padding-top:0"><div class="wrap">
  <div class="ct"><div><div class="lab">${S.contact.eyebrow}</div><h2 class="h2" style="margin-top:12px">${S.contact.h2}</h2>
    <ul class="info"><li><b>Phone</b><div class="tels">${Core.tels()}</div></li><li><b>Email</b><div>${Core.mail()}</div></li>
      <li><b>Address</b><div>${S.contact.address.join(' ')}<div class="links"><a href="${S.contact.gmaps}" target="_blank" rel="noopener">Google Maps</a><a href="${S.contact.waze}" target="_blank" rel="noopener">Waze</a></div></div></li>
      <li><b>Office hours</b><div>${S.contact.hours.join(' · ')}</div></li></ul></div>
    <form id="form" novalidate>
      <div class="field"><label>Name *</label><input name="name" required><div class="msg">Please enter your name</div></div>
      <div class="field"><label>Phone / WhatsApp *</label><input name="phone" type="tel" required><div class="msg">Please enter a contact number</div></div>
      <div class="field"><label>Email</label><input name="email" type="email"><div class="msg">Please check the email address</div></div>
      <div class="field"><label>Company</label><input name="company"></div>
      <div class="field"><label>I am a</label><select name="role">${S.contact.roles.map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div class="field"><label>Product</label><select name="product" id="prodSelect"></select></div>
      <div class="field full"><label>Message</label><textarea name="msg" placeholder="Decors, sizes, quantities…"></textarea></div>
      <div class="full"><button class="btn-f" type="submit">Send enquiry</button></div>
      <div class="sent" id="sent">${S.contact.sent}</div>
    </form></div>
  <div class="map" id="map"><div class="frame-box" style="position:absolute;inset:0"><div class="map-ph">${ic('i-pin')}<span>Loading map…</span><a href="${S.contact.gmaps}" target="_blank" rel="noopener">Open in Google Maps</a></div>
    <iframe class="map-frame" id="mapFrame" title="Shimlen Sdn. Bhd. on Google Maps" referrerpolicy="no-referrer-when-downgrade" data-src="${S.contact.embed}"></iframe></div>
    <div class="map-card"><div class="lab">Visit us</div><h3>Shimlen Sdn. Bhd.</h3><p>${S.contact.address[0]} 43500 Semenyih, Selangor<br>Mon – Fri 8am – 5pm · Sat 8am – 1pm</p>
      <div class="acts"><a class="btn-f" href="${S.contact.directions}" target="_blank" rel="noopener" style="padding:10px 16px;font-size:13px">Get directions</a><a class="more" href="${S.contact.wazeGo}" target="_blank" rel="noopener">Waze</a></div></div></div>
</div></section>`;

document.getElementById('foot').innerHTML=`<div class="wrap"><div class="f-grid">
  <div>${SHIMLEN_LOGO}<p style="margin-top:16px;font-size:13.5px;color:var(--fg2);max-width:30ch">${S.footer.blurb}</p>
    <div class="social"><a href="#" aria-label="Facebook">${ic('fb','fill')}</a><a href="#" aria-label="Instagram">${ic('ig','fill')}</a><a href="#" aria-label="Xiaohongshu">${ic('xhs','fill')}</a></div></div>
  <div><h5>Products</h5><ul>${P.slice(0,6).map((p,i)=>`<li><a href="#products" data-open="${i}">${p.n}</a></li>`).join('')}</ul></div>
  <div><h5>Company</h5><ul><li><a href="#about">About us</a></li><li><a href="#brands">Brands</a></li><li><a href="#low-formaldehyde">Low formaldehyde</a></li><li><a href="#warehouse">Warehouse</a></li><li><a href="#story">Our story</a></li><li><a href="#recognition">Recognition</a></li></ul></div>
  <div><h5>Visit</h5><ul><li>Lot 30482, Jalan P4/8C</li><li>Bandar Teknologi Kajang</li><li>43500 Semenyih, Selangor</li><li style="margin-top:10px">${Core.tels('</li><li>')}</li><li>${Core.mail()}</li></ul></div>
</div><div class="f-bot"><span>${S.footer.legal}</span><span>${S.footer.links}</span></div></div>`;

/* product chips */
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.prod').forEach(p=>p.classList.toggle('hid',b.dataset.c!=='all'&&p.dataset.cat!==b.dataset.c));document.getElementById('prail').scrollTo({left:0})});
/* story: pick a year on the line */
(function(){const d=document.getElementById('ysDetail'),bs=[...document.querySelectorAll('#ysLine button')];let cur=-1;
  const show=i=>{i=(i+Y.length)%Y.length;if(i===cur)return;cur=i;const [y,h,p,img,k]=Y[i];bs.forEach((b,j)=>b.classList.toggle('on',j===i));
    const ln=document.getElementById('ysLine');ln.scrollTo({left:bs[i].offsetLeft-ln.clientWidth/2+bs[i].offsetWidth/2,behavior:'smooth'});
    d.innerHTML=`<div class="md ${k||''}"><img src="${R}${img}" alt=""></div><div><div class="y">${y}</div><h3>${h}</h3><p>${p}</p>
      <div class="arrows"><button id="yP" aria-label="Previous year">${ic('back')}</button><button id="yN" aria-label="Next year">${ic('arrow')}</button><span>${pad(i+1)} / ${Y.length}</span></div></div>`;
    document.getElementById('yP').onclick=()=>show(cur-1);document.getElementById('yN').onclick=()=>show(cur+1)};
  bs.forEach(b=>b.onclick=()=>show(+b.dataset.i));show(0)})();

Core.init();
Core.rail(document.getElementById('prail'),document.getElementById('pPrev'),document.getElementById('pNext'));
document.getElementById('prail').addEventListener('railmove',e=>document.getElementById('pBar').style.transform=`scaleX(${.12+.88*e.detail})`);
/* calm motion: no intro, no custom cursor; pictures open gently, groups rise softly */
Motion.init({intro:'none',cursor:false,magnetic:false,curtain:false});
Motion.masks('.pic.m:not(figure),.euc .pic,.uses figure');
Motion.cascade('.fig,.rec,.feature .card,.prod,.logos div,.record,.years li,.feats>div,.points div,.gal button,.cert,.info li,.ys-detail');
Motion.parallax('.feature .pic img',5);
</script>
</body>
</html>
