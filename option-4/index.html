<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shimlen · Showreel · Option 4</title>
<meta name="description" content="High-quality materials for custom-made furniture: plywood, MFC, HPL, edgeband, acoustic and lacquered panels. 10,000 sq m warehouse in Semenyih, Selangor.">
<link rel="icon" href="../img/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/motion.css">
<style>
/* Option 4 · Quiet, laid out after finsa.com: a full film with one word, an inset banner, a staggered checkerboard
   of rooms and words, a range slider, one statement with picture-and-text slides, a full-width band with big type,
   a framed picture with a card over it, a dotted timeline, a soft "for professionals" band, a column footer.
   Each section is composed differently, so the page reads as placed, not stacked. */
:root{--bg:#fff;--fg:#1D1B1B;--fg2:#5E5958;--mut:#736A68;--line:#E4E0DE;--acc:#7A6865;--soft:#F4F4F6;--hh:76px;
  --wrap:min(1240px,calc(100vw - 64px));--pad:clamp(80px,9vw,140px);--drawer-bg:#fff;--drawer-line:#E4E0DE}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.7;color:var(--fg)}
h1,h2,h3,h4{font-weight:600;line-height:1.25}
.t{font-size:clamp(17px,1.4vw,21px);font-weight:600;letter-spacing:.09em}            /* Finsa's spaced titles */
.h{font-size:clamp(20px,1.7vw,24px);font-weight:600;letter-spacing:.01em}
.s{font-size:13px;color:var(--fg2);line-height:1.75}
.lab{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--fg2)}
section{padding:var(--pad) 0}
.tel{border-bottom:1px solid currentColor;white-space:nowrap}
/* the one link: a short line, then words */
.more{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--acc)}
.more::before{content:"";width:22px;height:1px;background:currentColor;transition:width .45s var(--ease)}
.more:hover::before,a:hover>.more::before,button:hover .more::before{width:40px}
.more.light{color:#fff}
.btn-o{display:inline-flex;align-items:center;padding:12px 30px;border:1px solid currentColor;font-size:13px;font-weight:600;letter-spacing:.08em;transition:background .3s,color .3s}
.btn-o.light{color:#fff}.btn-o.light:hover{background:#fff;color:var(--fg)}
.btn-f{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;background:var(--fg);color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;transition:background .3s}
.btn-f:hover{background:var(--acc)}

/* header: clear over the film, white once you scroll */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;background:transparent;color:#fff;transition:background .35s,color .35s,box-shadow .35s,transform .45s var(--ease)}
#hdr.scrolled,body.menu-open #hdr{background:#fff;color:var(--fg);box-shadow:0 1px 0 var(--line)}
#hdr.hide{transform:translateY(-100%)}
#hdr:not(.scrolled) .logo{filter:brightness(0) invert(1)}
body.menu-open #hdr .logo{filter:none}
.nav{height:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.nav .logo{width:132px;transition:filter .35s}
.nav-links{display:flex;gap:clamp(22px,2.6vw,42px);font-size:12.5px;font-weight:500;letter-spacing:.09em}
.nav-links a{position:relative;padding:6px 0}
.nav-links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:currentColor;transition:width .4s var(--ease)}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-r{display:flex;justify-content:flex-end;align-items:center;gap:18px;font-size:12.5px;font-weight:500;letter-spacing:.09em}
.burger{display:none;font-size:12.5px;font-weight:500;letter-spacing:.09em;color:inherit}
.menu{position:fixed;inset:0;background:#fff;z-index:55;padding:calc(var(--hh) + 24px) 24px 40px;display:flex;flex-direction:column;transform:translateY(-100%);transition:transform .6s var(--ease)}
.menu a{font-size:24px;font-weight:500;padding:12px 0;border-bottom:1px solid var(--line)}
body.menu-open .menu{transform:none}

/* 1 · hero: the film and one line, as Finsa does with a product name */
.hero{position:relative;height:100svh;min-height:560px;padding:0;color:#fff;background:#2a2624;overflow:hidden}
.hero .reel{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,15,15,.35),rgba(18,15,15,.12) 35%,rgba(18,15,15,.4))}
.h-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:0 24px}
.hero h1{font-size:clamp(40px,6.4vw,96px);font-weight:700;letter-spacing:-.01em;line-height:1.02;max-width:12ch}
.h-c>*{opacity:0;transform:translateY(22px);animation:hIn 1.1s var(--ease) forwards}
.h-c>*:nth-child(2){animation-delay:.15s}
@keyframes hIn{to{opacity:1;transform:none}}

/* 2 · inset banner */
.banner{position:relative;display:block;width:min(1000px,calc(100vw - 64px));margin:0 auto;aspect-ratio:1000/390;overflow:hidden;background:var(--soft)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease)}
.banner:hover img{transform:scale(1.03)}
.banner::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(244,244,246,.96) 0,rgba(244,244,246,.9) 26%,rgba(244,244,246,0) 52%)}
.banner .tx{position:absolute;z-index:2;left:clamp(20px,3vw,40px);top:50%;transform:translateY(-50%);width:min(250px,40%)}
.banner .tx h3{font-size:clamp(15px,1.4vw,19px);margin:10px 0 18px;line-height:1.4}

/* 3 · short intro */
.intro{width:var(--wrap);margin:0 auto;padding-left:clamp(0px,7vw,110px)}
.intro .h{margin-bottom:10px}
.intro p{max-width:46ch}

/* 4 · checkerboard: rooms and words interlock, edge to edge */
.ck{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:clamp(40px,5vw,70px)}
.ck .col{display:flex;flex-direction:column;gap:0}
.ck .pic{aspect-ratio:1/1.05;overflow:hidden}
.ck .pic img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.ck .col:hover .pic img{transform:scale(1.04)}
.ck .tx{background:var(--soft);padding:clamp(26px,3vw,46px) clamp(22px,2.6vw,42px);display:flex;flex-direction:column;gap:18px}
.ck .tx p{margin-bottom:6px}
.ck .tx .more{align-self:flex-end}
.ck .col:nth-child(2){margin-top:0}
.ck .col:nth-child(2) .tx{background:var(--soft)}
.ck .col:nth-child(1) .tx,.ck .col:nth-child(3) .tx{background:#fff}

/* 5 · range: a title column, then square cards running off the edge */
.range{display:grid;grid-template-columns:clamp(200px,20vw,260px) 1fr;gap:clamp(24px,3vw,44px);padding-left:calc((100vw - var(--wrap))/2)}
.range .side .t{margin-bottom:14px}
.range>*{min-width:0}
.r-rail{gap:clamp(20px,2.4vw,34px);padding-right:calc((100vw - var(--wrap))/2)}
.prod{width:clamp(240px,19vw,290px);text-align:left;display:flex;flex-direction:column;gap:12px}
.prod .ph{position:relative;aspect-ratio:1;overflow:hidden;background:var(--soft)}
.prod .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.prod:hover .ph img{transform:scale(1.05)}
.prod .ph .cut{position:absolute;right:10px;bottom:10px;width:28%;height:auto;aspect-ratio:1;object-fit:contain;background:#fff;padding:5px;transform:none!important}
.prod h3{font-size:14px;letter-spacing:.09em;margin-top:8px}
.prod .b{font-size:12px;color:var(--mut);margin-top:-6px}
.prod .s{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ctl{display:flex;align-items:center;gap:20px;margin-top:34px}
.ctl .arr{display:flex;gap:6px}
.ctl button{width:30px;height:30px;display:grid;place-items:center;color:var(--acc)}
.ctl button:disabled{opacity:.3}
.ctl .ic{width:20px;height:20px}
.ctl .track{flex:1;height:2px;background:var(--line);position:relative}
.ctl .track i{position:absolute;left:0;top:0;height:2px;width:100%;background:var(--acc);transform-origin:left;transform:scaleX(.2);transition:transform .3s}
.logos{display:grid;grid-template-columns:repeat(8,1fr);margin-top:clamp(60px,6vw,96px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.logos div{height:90px;display:grid;place-items:center;padding:14px}
.logos img{max-height:38px;max-width:104px;object-fit:contain;filter:grayscale(1);opacity:.6;transition:filter .4s,opacity .4s}
.logos img.sm{max-height:28px}
.logos div:hover img{filter:none;opacity:1}

/* 6 · one statement, then picture-and-text slides */
.state{width:var(--wrap);margin:0 auto;padding-left:clamp(0px,7vw,110px)}
.state h4{font-size:15px;margin-bottom:8px}
.state p{font-size:clamp(18px,1.7vw,23px);font-weight:400;line-height:1.45;max-width:30ch;color:var(--fg)}
.s-rail{gap:clamp(24px,3vw,48px);padding:0 calc((100vw - var(--wrap))/2);scroll-padding:0 calc((100vw - var(--wrap))/2);margin-top:clamp(50px,5vw,80px)}
.slide{width:min(980px,82vw);display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,3.4vw,56px);align-items:start}
.slide .pic{position:relative;aspect-ratio:1.1;overflow:hidden;background:var(--soft)}
.slide .pic>img{width:100%;height:100%;object-fit:cover}
.slide .pic.doc>img{object-fit:contain;padding:9%}
.slide .pic .lay{position:absolute;right:12px;bottom:12px;width:38%;background:#fff;padding:6px;cursor:zoom-in}
.slide .tx{padding-top:clamp(6px,2vw,30px);display:flex;flex-direction:column;gap:16px}
.slide .num{font-size:clamp(36px,3.4vw,50px);font-weight:600;line-height:1}
.slide .num small{font-size:13px;color:var(--mut);font-weight:400;margin-left:6px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.mini b{display:block;font-size:12.5px}
.mini span{font-size:12.5px;color:var(--fg2);line-height:1.6}
.steps{list-style:none;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg2)}
.steps b{color:var(--acc);font-weight:600}

/* 7 · band: the warehouse film with big words */
.band{position:relative;padding:0;color:#fff;overflow:hidden}
.band .film{height:min(64svh,620px)}
.band .shade{position:absolute;inset:0;background:rgba(18,15,15,.32)}
.band .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:0 24px}
.band h2{font-size:clamp(46px,7vw,110px);font-weight:700;line-height:1;letter-spacing:-.01em}
.band p{font-size:15px;color:rgba(255,255,255,.9);max-width:46ch}
.points{display:grid;grid-template-columns:repeat(4,1fr);width:var(--wrap);margin:0 auto}
.points div{display:flex;gap:12px;align-items:center;padding:24px 18px 24px 0;font-size:13px;border-bottom:1px solid var(--line)}
.points .ic{width:22px;height:22px;color:var(--acc);flex:none}

/* 8 · framed picture with a card over it */
.frame{position:relative;width:min(1000px,calc(100vw - 64px));margin:0 auto;background:var(--soft);padding-top:clamp(40px,5vw,70px)}
.frame .pic{width:86%;margin:0 auto;aspect-ratio:16/8;overflow:hidden}
.frame .pic img{width:100%;height:100%;object-fit:cover}
.frame .card{position:relative;width:min(520px,84%);margin:-90px auto 0;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);text-align:center;padding:clamp(26px,3vw,40px);display:grid;justify-items:center;gap:12px;top:0}
.frame .card p{max-width:44ch}
.frame::after{content:"";display:block;height:clamp(40px,5vw,70px)}

/* 9 · timeline: dots on a line, the chosen year opens a card beneath */
.tl{position:relative;width:var(--wrap);margin:0 auto}
.tl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px}
.tl-row{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:10px}
.tl-row>button{color:var(--acc);display:grid;place-items:center;height:40px}
.tl-row>button .ic{width:22px;height:22px}
.tl-line{position:relative;display:flex;justify-content:space-between;overflow-x:auto;scrollbar-width:none;padding:14px 6px 12px}
.tl-line::-webkit-scrollbar{display:none}
.tl-line::before{content:"";position:absolute;left:0;right:0;top:55px;border-top:1px dotted #cfc9c7}
.tl-line button{position:relative;flex:none;min-width:58px;display:grid;justify-items:center;gap:10px;padding:0 4px;color:var(--mut);font-size:12.5px;font-weight:500}
.tl-line button span{height:26px;line-height:1.2;display:flex;align-items:flex-end}
.tl-line button i{width:7px;height:7px;border-radius:50%;background:#d6d0ce;margin-top:6px;transition:transform .35s var(--ease),background .35s}
.tl-line button.on{color:var(--acc)}
.tl-line button.on span{font-size:20px;font-weight:600}
.tl-line button.on i{background:var(--acc);transform:scale(2.2)}
.tl-card{position:relative;margin-top:26px;width:min(420px,100%);background:var(--soft);padding:26px 28px 30px;transition:left .5s var(--ease)}
.tl-card::before{content:"";position:absolute;top:-10px;left:var(--tip,40px);border:10px solid transparent;border-top:0;border-bottom-color:var(--soft);transform:translateX(-50%)}
.tl-card .y{color:var(--acc);font-size:12.5px;font-weight:600}
.tl-card h3{font-size:15px;letter-spacing:.09em;margin:8px 0 6px}
.tl-card .row{display:grid;grid-template-columns:1fr 96px;gap:18px;align-items:start}
.tl-card .row img{width:96px;height:72px;object-fit:cover;background:#fff}
.tl-card .row img.c{object-fit:contain;padding:6px}

/* recognition: four quiet frames */
.certs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;width:var(--wrap);margin:clamp(70px,7vw,110px) auto 0}
.cert{text-align:left;display:flex;flex-direction:column;gap:8px}
.cert .fr{position:relative;height:190px;background:var(--soft);overflow:hidden}
.cert .fr img{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain}
.cert .yr{font-size:12px;color:var(--acc);font-weight:600}
.cert h3{font-size:13px;letter-spacing:.06em}
.cert p{font-size:12.5px;color:var(--fg2);line-height:1.6}

/* 10 · for professionals */
.pro{background:var(--soft);padding:clamp(30px,3vw,46px) 0}
.pro .in{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px);align-items:center;width:min(1400px,calc(100vw - 32px));margin:0 auto}
.pro .pic{aspect-ratio:16/10;overflow:hidden}
.pro .pic img{width:100%;height:100%;object-fit:cover}
.pro .t{line-height:1.45;max-width:24ch}
.pro ul{list-style:none;margin:20px 0 22px;display:grid;gap:8px}
.pro li{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--fg2)}
.pro li .ic{width:16px;height:16px;color:var(--acc)}
.pro em{display:block;font-size:12.5px;color:var(--mut);margin-bottom:22px}

/* contact */
.ct{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(40px,6vw,100px);width:var(--wrap);margin:0 auto}
.info{list-style:none;margin-top:26px;border-top:1px solid var(--line)}
.info li{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.info b{font-weight:600;color:var(--mut);font-size:12px}
.info .tels{display:flex;flex-wrap:wrap;gap:4px 14px}
.links{display:flex;gap:14px;margin-top:4px}
.links a{border-bottom:1px solid}
form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px 22px;align-content:start}
.field label{font-size:12px;color:var(--mut);font-weight:500}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;outline:none;font-size:14px;border-radius:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--fg)}
.field textarea{min-height:64px;resize:vertical}
.full{grid-column:1/-1}
.sent{grid-column:1/-1;background:var(--soft);padding:12px;font-size:13px}
.map{position:relative;height:380px;background:var(--soft);width:var(--wrap);margin:clamp(50px,5vw,80px) auto 0;overflow:hidden}
.map-ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--mut);font-size:13px}
.map-ph a{border-bottom:1px solid}
.map-card{position:absolute;left:20px;top:20px;z-index:2;background:#fff;padding:22px 24px;width:min(340px,calc(100% - 40px))}
.map-card h3{font-size:14px;letter-spacing:.06em;margin:8px 0 6px}
.map-card p{font-size:13px;color:var(--fg2)}
.map-card .acts{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}

/* footer: Finsa's columns */
footer{border-top:1px solid var(--line);padding:clamp(50px,5vw,70px) 0 26px}
.f-grid{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:30px;width:var(--wrap);margin:0 auto}
footer .logo{width:128px}
footer h5{font-size:12px;font-weight:600;letter-spacing:.06em;margin-bottom:14px}
footer ul{list-style:none;display:grid;gap:6px;font-size:12.5px;color:var(--fg2);letter-spacing:.03em}
footer a:hover{color:var(--fg)}
.f-bot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);width:var(--wrap);margin:50px auto 0}
.f-bot .l{display:flex;gap:26px;flex-wrap:wrap}
.social{display:flex;gap:12px}
.social .ic{width:15px;height:15px;color:var(--fg)}
.note{font-size:11.5px;color:var(--mut);width:var(--wrap);margin:14px auto 0}

@media (max-width:1080px){
  .nav{grid-template-columns:1fr auto}.nav-links,.nav-r .enq{display:none}.burger{display:block}
  .range{grid-template-columns:1fr;padding-left:0}.range .side{width:var(--wrap);margin:0 auto}
  .r-rail{padding:0 calc((100vw - var(--wrap))/2);scroll-padding:0 calc((100vw - var(--wrap))/2)}
  .logos{grid-template-columns:repeat(4,1fr)}
  .certs{grid-template-columns:1fr 1fr}
  .points{grid-template-columns:1fr 1fr}
  .ct{grid-template-columns:1fr}
  .f-grid{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:860px){
  :root{--wrap:calc(100vw - 40px)}
  .banner{aspect-ratio:auto;height:auto;display:flex;flex-direction:column-reverse;width:var(--wrap)}
  .banner img{position:relative;aspect-ratio:16/10;height:auto}
  .banner::before{display:none}
  .banner .tx{position:relative;transform:none;left:0;top:0;width:auto;padding:24px}
  .ck{grid-template-columns:1fr;gap:0;width:var(--wrap);margin-left:auto;margin-right:auto}
  .ck .col{margin-bottom:24px}
  .ck .col .tx{background:var(--soft)!important}
  .ck .col:nth-child(2){flex-direction:column-reverse}
  .slide{grid-template-columns:1fr;width:80vw}
  .frame .pic{width:100%;aspect-ratio:4/3}
  .frame{width:var(--wrap);padding-top:0;background:none}
  .frame .card{margin-top:-50px;width:92%}
  .pro .in{grid-template-columns:1fr;width:var(--wrap)}
  form{grid-template-columns:1fr 1fr}
  .tl-card{width:100%}
}
@media (max-width:560px){
  :root{--wrap:calc(100vw - 32px);--hh:64px}
  .nav .logo{width:116px}
  .logos{grid-template-columns:repeat(2,1fr)}
  .points{grid-template-columns:1fr}
  .mini{grid-template-columns:1fr}
  .certs{gap:14px}.cert .fr{height:140px}
  form{grid-template-columns:1fr}
  .info li{grid-template-columns:90px 1fr}
  .map{height:auto;display:flex;flex-direction:column}
  .map .frame-box{position:relative!important;height:280px}
  .map-card{position:relative;left:0;top:0;width:100%}
  .f-grid{grid-template-columns:1fr 1fr}
  .tl-row{grid-template-columns:28px 1fr 28px}
}
</style>
</head>
<body>
<header id="hdr"><div class="wrap nav">
  <a href="#top" aria-label="Shimlen home" id="hLogo"></a>
  <nav class="nav-links" id="navLinks"></nav>
  <div class="nav-r"><a class="enq" href="#contact">Enquire</a><button class="burger" id="burger" aria-expanded="false">Menu</button></div>
</div></header>
<nav class="menu" id="menu" aria-label="Menu"></nav>
<main id="app"></main>
<footer id="foot"></footer>

<script>window.ROOT='../'</script>
<script src="../shared/data.js"></script>
<script src="../shared/brand.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/vendor/gsap.min.js"></script>
<script src="../shared/vendor/ScrollTrigger.min.js"></script>
<script src="../shared/vendor/lenis.min.js"></script>
<script src="../shared/core.js"></script>
<script src="../shared/motion.js"></script>
<script>
const {ic,R}=Core,S=SH,P=S.products.list,Y=S.story.years,
  USE=['use-plywood.jpg','use-mfc.jpg','use-hpl.jpg','use-opaq.jpg','use-sleek.jpg','use-edgeband.jpg','use-envplas.jpg','use-flexi.jpg','use-mfp.jpg'];
const nav=S.nav.map(([t,id])=>`<a href="#${id}">${t}</a>`).join('');
document.getElementById('navLinks').innerHTML=nav;
document.getElementById('menu').innerHTML=nav+`<a href="#contact">Enquire</a>`;
document.getElementById('hLogo').innerHTML=SHIMLEN_LOGO;
const more=(t='Find out more')=>`<span class="more">${t}</span>`;

document.getElementById('app').innerHTML=`
<section class="hero" id="top"><div class="reel" id="heroReel"></div><div class="shade"></div>
  <div class="h-c"><h1>Woodworking materials, in stock.</h1><a href="#spaces" class="btn-o light">Find out more</a></div></section>

<section id="about" style="padding-bottom:0">
  <a class="banner" href="#low-formaldehyde"><img src="${R}img/use-mfp.jpg" alt="Wardrobe wall in E0 melamine faced plywood">
    <div class="tx"><div class="lab">eucalli E0</div><h3>What if every board in the room was low formaldehyde?</h3>${more()}</div></a>

  <div class="intro" id="spaces" style="margin-top:clamp(80px,9vw,140px)"><h2 class="h">Materials for every room</h2>
    <p class="s">From the board that holds a kitchen together to the edge you run your hand along, we supply what furniture makers turn into finished rooms. Since 1980.</p></div>

  <div class="ck">
    <a class="col" href="#products"><div class="pic m"><img src="${R}img/use-mfc.jpg" alt="Kitchen in light wood-decor cabinets"></div>
      <div class="tx"><h3 class="t">Kitchens and cabinets</h3><p class="s">Melamine faced chipboard in 400+ decors, high pressure laminates in 500+, and an edgeband matched to every one.</p>${more()}</div></a>
    <a class="col" href="#products"><div class="tx"><h3 class="t">Wardrobes and bedrooms</h3><p class="s">E0 plywood with a eucalyptus core holds screws tight and keeps long doors flat, with less formaldehyde in the rooms you sleep in.</p>${more()}</div>
      <div class="pic m"><img src="${R}img/use-bedroom.jpg" alt="Bedroom with wood wardrobe and headboard"></div></a>
    <a class="col" href="#products"><div class="pic m"><img src="${R}img/use-sleek.jpg" alt="Living room with a fluted feature wall"></div>
      <div class="tx"><h3 class="t">Walls and offices</h3><p class="s">Sleek fluted panels soften sound. OPAQ ultra-matt panels keep fingerprints off. Both arrive ready to fit.</p>${more()}</div></a>
  </div>
</section>

<section id="products">
  <div class="range">
    <div class="side"><h2 class="t">The Shimlen range</h2><p class="s">Board, surface and edge from one supplier, from the brands we represent in Malaysia. Choose a product for sizes and specifications.</p></div>
    <div><div class="rail r-rail" id="prail">${P.map((p,i)=>`<button class="prod" data-p="${i}"><div class="ph"><img src="${R}img/${USE[i]}" alt="${p.n} in use" loading="lazy"><img class="cut" src="${R}${p.img.replace('.jpg','-card.jpg')}" alt="" loading="lazy"></div>
      <h3>${p.n}</h3><div class="b">${p.b}</div><p class="s">${p.d}</p>${more()}</button>`).join('')}</div>
      <div class="ctl" style="padding-right:calc((100vw - var(--wrap))/2)"><div class="arr"><button id="pPrev" aria-label="Previous">${ic('back')}</button><button id="pNext" aria-label="Next">${ic('arrow')}</button></div><div class="track"><i id="pBar"></i></div></div></div>
  </div>
  <div class="wrap"><div class="logos" id="brands">${S.brands.map(([img,n,c])=>`<div title="${n}"><img class="${c||''}" src="${R}img/${img}" alt="${n}"></div>`).join('')}</div></div>
</section>

<section id="low-formaldehyde" style="padding-top:0">
  <div class="state"><h4>Low formaldehyde, as standard</h4>
    <p>Health-conscious panels since 2017, a full E0 range since 2023, and a national record for the stock we keep. No minimum order.</p></div>
  <div class="rail s-rail" id="srail">
    <div class="slide"><button class="pic doc" data-lb="rec" data-src="${R}${S.lf.record.img}" data-cap="The Malaysia Book of Records, 2025"><img src="${R}${S.lf.record.img}" alt="Malaysia Book of Records certificate" loading="lazy"></button>
      <div class="tx"><h3 class="t">On the national record</h3><div class="num"><span data-count="${S.lf.record.n}">0</span><small>${S.lf.record.unit}</small></div>
        <p class="s">${S.lf.record.h}. ${S.lf.record.p}.</p></div></div>
    <div class="slide" id="eucalli"><div class="pic"><img src="${R}img/use-mfp.jpg" alt="Wardrobe in eucalli E0 melamine faced plywood" loading="lazy"><span class="lay" data-lb="layers" data-src="${R}img/eucalli-layers.png" data-cap="eucalli E0 · the layers"><img src="${R}img/eucalli-layers.png" alt="eucalli E0 board layers" loading="lazy"></span></div>
      <div class="tx"><h3 class="t">eucalli E0</h3><p class="s">${S.eucalli.lead}</p>
        <div class="mini">${S.eucalli.feats.map(([b,p])=>`<div><b>${b}</b><span>${p}</span></div>`).join('')}</div>
        <button data-p="8" style="text-align:left">${more('See the specifications')}</button></div></div>
    <div class="slide"><div class="pic"><img src="${R}img/use-island.jpg" alt="Kitchen island in dark and wood finishes" loading="lazy"></div>
      <div class="tx"><h3 class="t">Our path to E0</h3><ul class="steps">${S.lf.steps.map(([y,p])=>`<li><b>${y}</b><span>${p}</span></li>`).join('')}</ul><p class="s">${S.lf.e0}</p></div></div>
  </div>
  <div class="wrap"><div class="ctl"><div class="arr"><button id="sPrev" aria-label="Previous">${ic('back')}</button><button id="sNext" aria-label="Next">${ic('arrow')}</button></div><div class="track"><i id="sBar"></i></div></div></div>
</section>

<section class="band" id="warehouse"><div class="film" id="whFilm"></div><div class="shade"></div>
  <div class="c"><h2>Ready stock.</h2><p>${S.warehouse.lead}</p></div></section>
<div class="points">${S.warehouse.points.map(([i,t])=>`<div>${ic('i-'+i)}${t}</div>`).join('')}</div>

<section style="padding-bottom:0">
  <div class="frame"><div class="pic m"><img src="${R}img/site-building.jpg" alt="The Shimlen building in Semenyih" loading="lazy"></div>
    <div class="card"><h2 class="h">Since 1980</h2><p class="s">Founded to supply furniture makers, Shimlen has moved three times to keep up with them. Our home since 2017 is Bandar Teknologi Kajang, with a new building rising next door.</p><a class="more" href="#story">Find out more</a></div></div>
</section>

<section id="story">
  <div class="tl"><div class="tl-head"><h2 class="t">${S.story.h2}</h2></div>
    <div class="tl-row"><button id="yP" aria-label="Previous year">${ic('back')}</button>
      <div class="tl-line" id="ysLine">${Y.map(([y],i)=>`<button data-i="${i}"><span>${y}</span><i></i></button>`).join('')}</div>
      <button id="yN" aria-label="Next year">${ic('arrow')}</button></div>
    <div class="tl-card" id="ysCard"></div></div>
  <div class="certs" id="recognition">${S.certs.list.map(c=>`<button class="cert" data-lb="certs" data-src="${R}${c.src}" data-cap="${c.h} · ${c.yr}"><div class="fr"><img src="${R}${c.src}" alt="${c.h}" loading="lazy"></div><span class="yr">${c.yr}</span><h3>${c.h}</h3><p>${c.p}</p></button>`).join('')}</div>
</section>

<div class="pro"><div class="in"><div class="pic m"><img src="${R}img/render-office.jpg" alt="An office interior in Shimlen materials" loading="lazy"></div>
  <div><h2 class="t">Making furniture or designing a space? Work with our team.</h2>
    <p class="s" style="margin-top:14px">Carpenters, furniture makers, interior designers and architects come to us for more than boards.</p>
    <ul><li>${ic('i-match')}Samples and decor matching</li><li>${ic('i-stock')}Sizes and stock checked for you</li><li>${ic('i-truck')}Delivery in 24 hours* across the Klang Valley</li></ul>
    <em>Visit the showroom Monday to Saturday.</em><a class="more" href="#contact">Find out more</a></div></div></div>

<section id="contact">
  <div class="ct"><div><div class="lab">${S.contact.eyebrow}</div><h2 class="h" style="margin-top:10px">${S.contact.h2}</h2>
    <ul class="info"><li><b>Phone</b><div class="tels">${Core.tels()}</div></li><li><b>Email</b><div>${Core.mail()}</div></li>
      <li><b>Address</b><div>${S.contact.address.join(' ')}<div class="links"><a href="${S.contact.gmaps}" target="_blank" rel="noopener">Google Maps</a><a href="${S.contact.waze}" target="_blank" rel="noopener">Waze</a></div></div></li>
      <li><b>Office hours</b><div>${S.contact.hours.join(' · ')}</div></li></ul></div>
    <form id="form" novalidate>
      <div class="field"><label>Name *</label><input name="name" required><div class="msg">Please enter your name</div></div>
      <div class="field"><label>Phone / WhatsApp *</label><input name="phone" type="tel" required><div class="msg">Please enter a contact number</div></div>
      <div class="field"><label>Email</label><input name="email" type="email"><div class="msg">Please check the email address</div></div>
      <div class="field"><label>Company</label><input name="company"></div>
      <div class="field"><label>I am a</label><select name="role">${S.contact.roles.map(r=>`<option>${r}</option>`).join('')}</select></div>
      <div class="field"><label>Product</label><select name="product" id="prodSelect"></select></div>
      <div class="field full"><label>Message</label><textarea name="msg" placeholder="Decors, sizes, quantities…"></textarea></div>
      <div class="full"><button class="btn-f" type="submit">Send enquiry</button></div>
      <div class="sent" id="sent">${S.contact.sent}</div>
    </form></div>
  <div class="map" id="map"><div class="frame-box" style="position:absolute;inset:0"><div class="map-ph">${ic('i-pin')}<span>Loading map…</span><a href="${S.contact.gmaps}" target="_blank" rel="noopener">Open in Google Maps</a></div>
    <iframe class="map-frame" id="mapFrame" title="Shimlen Sdn. Bhd. on Google Maps" referrerpolicy="no-referrer-when-downgrade" data-src="${S.contact.embed}"></iframe></div>
    <div class="map-card"><div class="lab">Visit us</div><h3>Shimlen Sdn. Bhd.</h3><p>${S.contact.address[0]} 43500 Semenyih, Selangor<br>Mon – Fri 8am – 5pm · Sat 8am – 1pm</p>
      <div class="acts"><a class="btn-f" href="${S.contact.directions}" target="_blank" rel="noopener" style="padding:10px 16px;font-size:12.5px">Get directions</a><a class="more" href="${S.contact.wazeGo}" target="_blank" rel="noopener">Waze</a></div></div></div>
</section>`;

document.getElementById('foot').innerHTML=`<div class="f-grid">
  <div>${SHIMLEN_LOGO}</div>
  <div><h5>About us</h5><ul><li><a href="#about">About Shimlen</a></li><li><a href="#story">Our story</a></li><li><a href="#recognition">Recognition</a></li><li><a href="#warehouse">Warehouse</a></li></ul></div>
  <div><h5>Products</h5><ul>${P.slice(0,5).map((p,i)=>`<li><a href="#products" data-open="${i}">${p.n}</a></li>`).join('')}</ul></div>
  <div><h5>Low formaldehyde</h5><ul><li><a href="#low-formaldehyde">E0 and Super E0</a></li><li><a href="#eucalli">eucalli E0</a></li><li><a href="#brands">Our brands</a></li></ul></div>
  <div><h5>Contact</h5><ul><li>${Core.tels('</li><li>')}</li><li>${Core.mail()}</li><li>Lot 30482, Jalan P4/8C, 43500 Semenyih</li></ul></div>
</div>
<div class="f-bot"><div class="l"><span>${S.footer.legal}</span><span>Privacy notice</span><span>Terms</span></div>
  <div class="social"><a href="#" aria-label="Facebook">${ic('fb','fill')}</a><a href="#" aria-label="Instagram">${ic('ig','fill')}</a><a href="#" aria-label="Xiaohongshu">${ic('xhs','fill')}</a></div></div>
<p class="note">Interior photos are concept placeholders (Unsplash), to be replaced with Shimlen customer projects.</p>`;

/* timeline: pick a year; the card sits under its dot */
(function(){const card=document.getElementById('ysCard'),ln=document.getElementById('ysLine'),bs=[...ln.querySelectorAll('button')];let cur=-1;
  const place=()=>{if(cur<0)return;const b=bs[cur],box=card.parentElement.getBoundingClientRect(),r=b.getBoundingClientRect();
    const cx=r.left+r.width/2-box.left,w=card.offsetWidth,left=Math.max(0,Math.min(box.width-w,cx-w/2));card.style.left=left+'px';card.style.setProperty('--tip',(cx-left)+'px')};
  const show=i=>{i=(i+Y.length)%Y.length;if(i===cur)return;cur=i;const [y,h,p,img,k]=Y[i];bs.forEach((b,j)=>b.classList.toggle('on',j===i));
    ln.scrollTo({left:bs[i].offsetLeft-ln.clientWidth/2+bs[i].offsetWidth/2,behavior:'smooth'});
    card.innerHTML=`<div class="y">${y}</div><div class="row"><div><h3>${h}</h3><p class="s">${p}</p></div>${img?`<img class="${k?'c':''}" src="${R}${img}" alt="">`:''}</div>`;
    requestAnimationFrame(place);setTimeout(place,450)};
  bs.forEach(b=>b.onclick=()=>show(+b.dataset.i));document.getElementById('yP').onclick=()=>show(cur-1);document.getElementById('yN').onclick=()=>show(cur+1);
  ln.addEventListener('scroll',place,{passive:true});addEventListener('resize',place);show(12)})();

Core.init();
const bar=(r,b)=>{Core.rail(document.getElementById(r),document.getElementById(b+'Prev'),document.getElementById(b+'Next'));
  document.getElementById(r).addEventListener('railmove',e=>document.getElementById(b+'Bar').style.transform=`scaleX(${.2+.8*e.detail})`)};
bar('prail','p');bar('srail','s');
/* calm motion: the film text rises once on load (CSS); pictures open gently as they arrive; cards rise softly */
Motion.init({intro:'none',cursor:false,magnetic:false,curtain:false});
Motion.masks('.banner,.ck .pic,.frame .pic,.slide .pic,.pro .pic');
Motion.cascade('.ck .tx,.prod,.logos div,.slide .tx,.points div,.cert,.frame .card,.tl-card,.info li');
</script>
</body>
</html>
